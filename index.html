function parseEventDate(value){

  if(!value) return null;

  const date =
    new Date(value);

  if(Number.isNaN(date.getTime())){
    return null;
  }

  return {

    month:
      date.toLocaleString(
        "en-US",
        {month:"short"}
      ),

    day:
      date.getDate(),

    formatted:
      date.toLocaleString(
        [],
        {
          day:"numeric",
          month:"long",
          year:"numeric",
          hour:"numeric",
          minute:"2-digit"
        }

    time:
      date.toLocaleString(
        [],
        {
          hour:"numeric",
          minute:"2-digit",
          hour12:true
        }
      ),

    fullDate:
      date.toLocaleString(
        "en-IN",
        {
          day:"numeric",
          month:"long",
          year:"numeric"
        }
      ),

    raw:date
  };
}

/* =====================================================
   LOCATION FIELD
===================================================== */

async function createLocationField(
  containerId,
  initialLocation = null
){

  const container =
    document.querySelector(
      "#" + containerId
    );

  if(!container){
    return {
      getValue:() => null
    };
  }

  const initialText =
    locationText(initialLocation);

  /*
   * Always begin with a normal input.
   * This means the form never depends on Google.
   */
  container.innerHTML = `

    <div class="input-wrapper">

      <span class="input-icon">
        ${SVGS.location}
      </span>

      <div
        class="location-autocomplete"
        style="width:100%;"
      >

        <input
          class="input-field"
          id="${containerId}Input"
          maxlength="250"
          autocomplete="off"
          value="${escapeHTML(initialText)}"
          placeholder="Search for a place or enter it manually"
          style="padding-left:2.4rem;"
        >

      </div>

    </div>

    <div
      class="location-status fallback"
      id="${containerId}Status"
    >
      You can enter any location.
    </div>
  `;

  const input =
    document.querySelector(
      "#" + containerId + "Input"
    );

  const status =
    document.querySelector(
      "#" + containerId + "Status"
    );

  let selectedLocation =
    initialLocation &&
    typeof initialLocation === "object"
      ? {...initialLocation}
      : initialText
        ? {text:initialText}
        : null;

  /*
   * Once the user changes the text manually,
   * the previous Google coordinates are no longer
   * considered authoritative.
   */
  input.addEventListener(
    "input",
    () => {

      selectedLocation = {
        text:input.value.trim()
      };

      status.textContent =
        "Using the location exactly as entered.";

      status.className =
        "location-status fallback";
    }
  );

  /*
   * Try to load Google Places.
   *
   * Failure is intentionally silent from the user's
   * perspective except for a small status message.
   */
  try{

    await loadGoogleMapsPlaces();

    if(
      !window.google?.maps?.places?.Autocomplete
    ){
      throw new Error(
        "Google Places Autocomplete unavailable."
      );
    }

    const autocomplete =
      new google.maps.places.Autocomplete(
        input,
        {
          fields:[
            "place_id",
            "name",
            "formatted_address",
            "geometry"
          ],
          types:[
            "establishment",
            "geocode"
          ]
        }
      );

    autocomplete.addListener(
      "place_changed",
      () => {

        const place =
          autocomplete.getPlace();

        const location =
          place?.geometry?.location;

        /*
         * Google can return an autocomplete value
         * without geometry. In that case we simply
         * keep the text.
         */
        if(
          !location ||
          typeof location.lat !== "function" ||
          typeof location.lng !== "function"
        ){

          selectedLocation = {
            text:input.value.trim()
          };

          status.textContent =
            "Using the location as entered.";

          status.className =
            "location-status fallback";

          return;
        }

        selectedLocation = {

          text:
            place.formatted_address ||
            place.name ||
            input.value.trim(),

          name:
            place.name ||
            "",

          address:
            place.formatted_address ||
            "",

          placeId:
            place.place_id ||
            "",

          lat:
            location.lat(),

          lng:
            location.lng(),

          source:
            "google"
        };

        input.value =
          place.name ||
          place.formatted_address ||
          input.value;

        status.textContent =
          "✓ Google Maps location selected";

        status.className =
          "location-status selected";
      }
    );

    /*
     * If there was an existing Google location,
     * show that it is recognized.
     */
    if(
      selectedLocation?.source === "google" &&
      Number.isFinite(
        Number(selectedLocation.lat)
      ) &&
      Number.isFinite(
        Number(selectedLocation.lng)
      )
    ){

      status.textContent =
        "✓ Google Maps location selected";

      status.className =
        "location-status selected";
    }

  }catch(error){

    console.warn(
      "Google Places unavailable:",
      error
    );

    status.textContent =
      "Google Maps suggestions unavailable. You can still enter the location normally.";

    status.className =
      "location-status fallback";
  }

  return {

    getValue(){

      const currentText =
        input.value.trim();

      if(!currentText){
        return null;
      }

      /*
       * If the user hasn't changed a Google-selected
       * location, retain its metadata.
       */
      if(
        selectedLocation?.source === "google" &&
        selectedLocation.text &&
        selectedLocation.text === currentText
      ){

        return {
          ...selectedLocation,
          text:currentText
        };
      }

      /*
       * If editing and the visible value is the
       * place name while the stored text is its
       * formatted address, preserve the Google data
       * only if the input hasn't materially changed.
       */
      if(
        selectedLocation?.source === "google" &&
        (
          currentText === selectedLocation.name ||
          currentText === selectedLocation.address
        )
      ){

        return {
          ...selectedLocation,
          text:currentText
        };
      }

      /*
       * Otherwise this is just manually entered text.
       */
      return {
        text:currentText
      };
    }
  };
}


/* =====================================================
   AUTH
===================================================== */

async function requireAuth(){

  if(auth.currentUser){
    return true;
  }

  if(signingIn){
    return false;
  }

  signingIn = true;

  try{

    await signInWithPopup(
      auth,
      googleProvider
    );

    return true;

  }catch(error){

    console.error(
      "Firebase Auth Error:",
      error
    );

    if([
      "auth/popup-closed-by-user",
      "auth/cancelled-popup-request",
      "auth/popup-blocked"
    ].includes(error.code)){

      return false;
    }

    alert(
      "Google sign-in failed.\n\n" +
      error.code +
      "\n\n" +
      error.message
    );

    return false;

  }finally{

    signingIn = false;
  }
}

function generateShareText(
  event,
  id
){

  const dateData =
    parseEventDate(
      event.when
    );

  const formattedDateTime =
    dateData
      ? `${dateData.fullDate} · ${dateData.time}`
      : "";

  const link =
    eventURL(
      id,
      event
    );

  const location =
    locationText(
      event.location
    );

  return `${event.title}
${formattedDateTime}

*വരുന്നുണ്ടോ???*

${
  location
    ? `📍 ${location}\n\n`
    : ""
}${link}`;
}

async function shareEvent(id){

  const snapshot =
    await get(
      ref(
        db,
        "events/" + id
      )
    );

  const event =
    snapshot.val();

  if(!event){
    return;
  }

  const shareText =
    generateShareText(
      event,
      id
    );

  if(navigator.share){

    try{

      await navigator.share({
        text:shareText
      });

      return;

    }catch(error){

      if(
        error?.name ===
        "AbortError"
      ){

        return;
      }
    }
  }

  copyEventMessage(id);
}

async function copyEventMessage(
  id,
  button
){

  const snapshot =
    await get(
      ref(
        db,
        "events/" + id
      )
    );

  const event =
    snapshot.val();

  if(!event){
    return;
  }

  const shareText =
    generateShareText(
      event,
      id
    );

  try{

    await navigator.clipboard.writeText(
      shareText
    );

    if(button){

      const original =
        button.innerHTML;

      button.innerHTML =
        `${SVGS.copy} Copied!`;

      setTimeout(
        () => {

          if(button.isConnected){

            button.innerHTML =
              original;
          }

        },
        1500
      );

    }else{

      alert(
        "Message copied to clipboard!"
      );
    }

  }catch{

    prompt(
      "Copy this event message:",
      shareText
    );
  }
}

async function loadFeedEvents(){

  const publicSnapshot =
    await get(
      ref(db,"publicEvents")
    );

  const publicIndex =
    publicSnapshot.val() || {};

  const ids =
    new Set(
      Object.keys(publicIndex)
    );

  if(auth.currentUser){

    const mineSnapshot =
      await get(
        ref(
          db,
          "userEvents/" +
          auth.currentUser.uid
        )
      );

    const mine =
      mineSnapshot.val() || {};

    Object.keys(mine)
      .forEach(
        id => ids.add(id)
      );
  }

  const entries =
    await Promise.all(
      [...ids].map(
        async id => {

          try{

            const snapshot =
              await get(
                ref(
                  db,
                  "events/" + id
                )
              );

            if(!snapshot.exists()){
              return null;
            }

            return [
              id,
              snapshot.val()
            ];

          }catch(error){

            console.warn(
              "Could not load event",
              id,
              error
            );

            return null;
          }
        }
      )
    );

  return entries.filter(Boolean);
}

function eventsPage(){

  stopListener();

  updateBottomNav(

  );

  app.innerHTML = `

    <div class="hero-illustration">
      ${SVGS.landscapeGreen}
    </div>

    <div class="tab-container">

      <button
        class="tab-btn ${
          currentTab === "upcoming"
            ? "active"
            : ""
        }"
        id="tabUpcoming"
      >
        Upcoming
      </button>

      <button
        class="tab-btn ${
          currentTab === "past"
            ? "active"
            : ""
        }"
        id="tabPast"
      >
        Past
      </button>

    </div>

    <div id="eventsContainer">

      <div style="
        text-align:center;
        padding:1.25rem;
        color:var(--text-muted);
        font-size:.875rem;
      ">
        Loading events...
      </div>

    </div>
  `;

  wireHeader();

  const tabUpcoming =
    document.querySelector(
      "#tabUpcoming"
    );

  const tabPast =
    document.querySelector(
      "#tabPast"
    );

  tabUpcoming.onclick = () => {

    currentTab =
      "upcoming";

    tabUpcoming.classList.add(
      "active"
    );

    tabPast.classList.remove(
      "active"
    );

    renderEventsList();
  };

  tabPast.onclick = () => {

    currentTab =
      "past";

    tabPast.classList.add(
      "active"
    );

    tabUpcoming.classList.remove(
      "active"
    );

    renderEventsList();
  };

  let cachedUpcoming = [];
  let cachedPast = [];

  function renderEventsList(){

    const container =
      document.querySelector(
        "#eventsContainer"
      );

    if(!container){
      return;
    }

    const list =
      currentTab === "upcoming"
        ? cachedUpcoming
        : cachedPast;

    if(!list.length){

      container.innerHTML = `

        <div style="
          text-align:center;
          padding:2rem 0;
          color:var(--text-muted);
          font-size:.875rem;
        ">
          No ${currentTab} events found.
        </div>
      `;

      return;
    }

    container.innerHTML = `

      <div class="event-list">

        ${
          list.map(
            ([id,event]) => {

              const dateData =
                parseEventDate(
                  event.when
                );

              const coming =
                Object.values(
                  event.responses || {}
                ).filter(
                  r => r.status === "yes"
                ).length;

              const location =
                locationText(
                  event.location
                );

              return `

                <div
                  class="event-card"
                  data-id="${escapeHTML(id)}"
                >

                  <div class="date-badge">

                    <div class="date-badge-month">
                      ${
                        dateData
                          ? dateData.month
                          : "---"
                      }
                    </div>

                    <div class="date-badge-day">
                      ${
                        dateData
                          ? dateData.day
                          : "--"
                      }
                    </div>

                  </div>

                  <div class="event-info">

                    <div class="event-name">
                      ${escapeHTML(
                        event.title
                      )}
                    </div>

                    <div class="event-meta">

                      ${
                        dateData
                          ? dateData.time
                          : ""
                      }

                      ${
                        location
                          ? " · 📍 " +
                            escapeHTML(
                              location
                            )
                          : ""
                      }

                    </div>

                    ${
                      event.visibility ===
                      "private"
                        ? `
                          <div class="visibility-pill">
                            🔒 Private
                          </div>
                        `
                        : ""
                    }

                  </div>

                  <div class="count-pill">
                    ${coming} coming
                  </div>

                </div>
              `;
            }
          ).join("")
        }

      </div>
    `;

    container
      .querySelectorAll(
        ".event-card"
      )
      .forEach(
        card => {

          card.onclick = () => {

            location.hash =
              "e=" +
              card.dataset.id;
          };
        }
      );
  }

  loadFeedEvents()
    .then(
      events => {

        const now =
          Date.now();

        cachedUpcoming = [];
        cachedPast = [];

        events.forEach(
          ([id,event]) => {

            const eventTime =
              new Date(
                event.when
              ).getTime();

            if(
              Number.isFinite(
                eventTime
              ) &&
              eventTime < now
            ){

              cachedPast.push([
                id,
                event
              ]);

            }else{

              cachedUpcoming.push([
                id,
                event
              ]);
            }
          }
        );

        cachedUpcoming.sort(
          (a,b) =>
            new Date(
              a[1].when
            ).getTime() -
            new Date(
              b[1].when
            ).getTime()
        );

        cachedPast.sort(
          (a,b) =>
            new Date(
              b[1].when
            ).getTime() -
            new Date(
              a[1].when
            ).getTime()
        );

        renderEventsList();
      }
    )
    .catch(
      error => {

        console.error(
          "EVENTS LOAD ERROR:",
          error
        );

        const container =
          document.querySelector(
            "#eventsContainer"
          );

        if(container){

          container.innerHTML = `

            <p class="error">
              Couldn't load events.
              ${escapeHTML(
                error.message || ""
              )}
            </p>
          `;
        }
      }
    );
}

function wireVisibilityControl(
  initialValue
){

  let selectedVisibility =
    initialValue ||
    "public";

  const buttons =
    document.querySelectorAll(
      ".visibility-option"
    );

  const hint =
    document.querySelector(
      "#visibilityHint"
    );

  buttons.forEach(
    button => {

      button.onclick = () => {

        selectedVisibility =
          button.dataset.visibility;

        buttons.forEach(
          item => {

            item.classList.toggle(
              "active",
              item.dataset.visibility ===
              selectedVisibility
            );
          }
        );

        hint.textContent =
          selectedVisibility ===
          "private"

            ? "Only people with the shared event link can access it."

            : "Anyone can find this event on the Events page.";
      };
    }
  );

  return () =>
    selectedVisibility;
}

async function editEvent(id){

    );

      "Event not found."
    );

async function deleteEvent(id){

  const user =
    auth.currentUser;

  if(!user){
    return;
  }

  const snapshot =
    await get(
      ref(
        db,
        "events/" + id
      )
    );

  if(!snapshot.exists()){

    alert(
      "Event not found."
    );

    return;
  }

  const event =
    snapshot.val();

  if(
    event.creatorUid !==
    user.uid
  ){

    alert(
      "Only the creator can delete this event."
    );

    return;
  }

  if(!confirm(
    "Delete this event?\n\nThis cannot be undone."
  )){
    return;
  }

  try{

    const updates = {};

    updates[
      "events/" + id
    ] = null;

    updates[
      "publicEvents/" + id
    ] = null;

    updates[
      "userEvents/" +
      user.uid +
      "/" +
      id
    ] = null;

    updates[
      "eventMembers/" +
      id
    ] = null;

    if(
      event.inviteToken
    ){

      updates[
        "privateInvites/" +
        event.inviteToken
      ] = null;
    }

    if(event.responses){

      Object.keys(
        event.responses
      ).forEach(
        uid => {

          updates[
            "userEvents/" +
            uid +
            "/" +
            id
          ] = null;
        }
      );
    }

    await update(
      ref(db),
      updates
    );

    goToEventsPage();

  }catch(errorObject){

    console.error(
      "DELETE EVENT ERROR:",
      errorObject
    );

    alert(
      "Couldn't delete the event.\n\n" +
      errorObject.code +
      "\n" +
      errorObject.message
    );
  }
}

                  <h3 style="
                    font-size:.95rem;
                    margin-bottom:.65rem;
                  ">
                    Not coming · ${notComing.length}
                  </h3>

                  ${notComing.map(
                    ([,r]) => `

                      <div class="person-row">

                        <div class="person-detail">

                          ${
                            r.photo
                              ? `
                                <img
                                  class="person-avatar"
                                  src="${escapeHTML(
                                    r.photo
                                  )}"
                                  alt=""
                                >
                              `
                              : `
                                <div class="person-avatar"></div>
                              `
                          }

                          <div>

                            <div style="
                              font-weight:600;
                              font-size:.875rem;
                            ">
                              ${escapeHTML(
                                r.name ||
                                "Unknown"
                              )}
                            </div>

                            ${
                              r.note
                                ? `
                                  <div style="
                                    font-size:.75rem;
                                    color:var(--text-muted);
                                    margin-top:.05rem;
                                  ">
                                    ${escapeHTML(
                                      r.note
                                    )}
                                  </div>
                                `
                                : ""
                            }

                          </div>

                        </div>

                        <span style="
                          color:var(--no-text);
                          font-weight:700;
                        ">
                          ×
                        </span>

                      </div>
                    `
                  ).join("")}

                </div>
              `
              : ""
          }

        `;

        document.querySelector(
          "#shareButton"
        )?.addEventListener(
          "click",
          () => shareEvent(id)
        );

        document.querySelector(
          "#copyButton"
        )?.addEventListener(
          "click",
          function(){
            copyEventMessage(
              id,
              this
            );
          }
        );

        if(isCreator){

          if(!isLocked){

            document.querySelector(
              "#editButton"
            )?.addEventListener(
              "click",
              () => editEvent(id)
            );
          }

          document.querySelector(
            "#deleteButton"
          )?.addEventListener(
            "click",
            () => deleteEvent(id)
          );
        }

        if(!userUid){

          document.querySelector(
            "#respondButton"
          )?.addEventListener(
            "click",
            async () => {

              const signedIn =
                await requireAuth();

              if(signedIn){
                eventPage(id);
              }
            }
          );

        }else if(!isLocked){

          const yesBtn =
            document.querySelector(
              "#yesButton"
            );

          const noBtn =
            document.querySelector(
              "#noButton"
            );

          yesBtn.onclick = () => {

            selectedStatus =
              "yes";

            yesBtn.classList.add(
              "selected"
            );

            noBtn.classList.remove(
              "selected"
            );
          };

          noBtn.onclick = () => {

            selectedStatus =
              "no";

            noBtn.classList.add(
              "selected"
            );

            yesBtn.classList.remove(
              "selected"
            );
          };

          document.querySelector(
            "#saveResponse"
          ).onclick =
            async () => {

              const msg =
                document.querySelector(
                  "#responseMessage"
                );

              const note =
                document.querySelector(
                  "#responseNote"
                ).value.trim();

              if(!selectedStatus){

                alert(
                  "Select COMING or NOT COMING first."
                );

                return;
              }

              try{

                const response = {

                  status:
                    selectedStatus,

                  note,

                  name:
                    user.displayName ||
                    "Unknown",

                  photo:
                    user.photoURL ||
                    "",

                  updatedAt:
                    Date.now()
                };

                const updates = {};

                updates[
                  "events/" +
                  id +
                  "/responses/" +
                  userUid
                ] = response;

                /*
                 * Feed access is created for both
                 * COMING and NOT COMING.
                 */
                updates[
                  "userEvents/" +
                  userUid +
                  "/" +
                  id
                ] = true;

                await update(
                  ref(db),
                  updates
                );

                msg.textContent =
                  "Response saved!";

                setTimeout(
                  () => {

                    if(msg){
                      msg.textContent =
                        "";
                    }

                  },
                  2000
                );

              }catch(err){

                console.error(
                  "RESPONSE ERROR:",
                  err
                );

                alert(
                  "Couldn't save the event response: " +
                  err.message
                );
              }
            };
        }

      },

      error => {

        console.error(
          "EVENT LOAD ERROR:",
          error
        );

        const shell =
          document.querySelector(
            "#eventShell"
          );

        if(!shell){
          return;
        }

        if(
          error.code ===
          "PERMISSION_DENIED"
        ){

          shell.innerHTML = `

            <div
              class="details-card"
              style="text-align:center;"
            >

              <div style="
                font-size:2rem;
                margin-bottom:.75rem;
              ">
                🔒
              </div>

              <h2 style="
                font-size:1.2rem;
              ">
                Private event
              </h2>

              <p style="
                color:var(--text-muted);
                font-size:.85rem;
                margin:.5rem 0 1rem;
              ">
                You need the private invitation link
                to access this event.
              </p>

            </div>
          `;

          return;
        }

        shell.innerHTML = `

          <p class="error">
            Couldn't load this event.
            ${escapeHTML(
              error.message || ""
            )}
          </p>
        `;
      }
    );
}


/* =====================================================
   PRIVATE INVITE
===================================================== */

async function privateInvitePage(
  token
){

  stopListener();

  updateBottomNav("");

  app.innerHTML = `

    ${renderHeader(true)}

    <div
      class="details-card"
      style="text-align:center;"
    >

      <div style="
        font-size:2.4rem;
        margin-bottom:.7rem;
      ">
        🔒
      </div>

      <h2 style="
        font-size:1.3rem;
        margin-bottom:.45rem;
      ">
        Private event
      </h2>

      <p
        id="inviteMessage"
        style="
          color:var(--text-muted);
          font-size:.85rem;
          margin-bottom:1rem;
        "
      >
        Checking invitation...
      </p>

      <div id="inviteAction"></div>

    </div>
  `;

  wireHeader();

  const inviteSnapshot =
    await get(
      ref(
        db,
        "privateInvites/" +
        token
      )
    );

  if(!inviteSnapshot.exists()){

    document.querySelector(
      "#inviteMessage"
    ).textContent =
      "This invitation link is invalid or no longer available.";

    return;
  }

  const invite =
    inviteSnapshot.val();

  const eventId =
    invite.eventId;

  if(!eventId){

    document.querySelector(
      "#inviteMessage"
    ).textContent =
      "This invitation link is invalid.";

    return;
  }

  if(!auth.currentUser){

    document.querySelector(
      "#inviteMessage"
    ).textContent =
      "Sign in with Google to open this private event.";

    document.querySelector(
      "#inviteAction"
    ).innerHTML = `

      <button
        class="btn-primary"
        id="acceptInviteButton"
      >
        Continue with Google
      </button>
    `;

    document.querySelector(
      "#acceptInviteButton"
    ).onclick =
      async () => {

        const signedIn =
          await requireAuth();

        if(signedIn){

          await acceptPrivateInvite(
            token,
            eventId
          );
        }
      };

    return;
  }

  await acceptPrivateInvite(
    token,
    eventId
  );
}

async function acceptPrivateInvite(
  token,
  eventId
){

  const user =
    auth.currentUser;

  if(!user){
    return;
  }

  try{

    /*
     * Membership grants access.
     *
     * It does NOT put the event into the
     * user's feed until they save an RSVP.
     */
    const updates = {};

    updates[
      "eventMembers/" +
      eventId +
      "/" +
      user.uid
    ] = token;

    await update(
      ref(db),
      updates
    );

    location.hash =
      "e=" + eventId;

  }catch(error){

    console.error(
      "INVITE ACCEPT ERROR:",
      error
    );

    const message =
      document.querySelector(
        "#inviteMessage"
      );

    if(message){

      message.textContent =
        "Couldn't open this invitation. " +
        error.message;
    }
  }
}

/* =====================================================
   ROUTER
===================================================== */

function route(){

  const hash =
    location.hash;

  if(
    hash === "#create"
  ){

    createPage();

  }else if(
    hash === "#profile"
  ){

    profilePage();

  }else if(
    hash.startsWith(
      "#invite="
    )
  ){

    const token =
      hash.slice(
        "#invite=".length
      );

    if(token){

      privateInvitePage(
        decodeURIComponent(
          token
        )
      );
    }

  }else if(
    hash.startsWith(
      "#e="
    )
  ){

    const id =
      hash.slice(3);

    if(id){

      eventPage(id);

      return;
    }

  }else{

    currentTab =
      "upcoming";

    eventsPage();
  }
}

window.addEventListener(
  "hashchange",
  route
);

onAuthStateChanged(
  auth,
  () => route()
);

</script>
