<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>വരുന്നുണ്ടോ???</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#fff9ef;
  color:#222;
  font:17px system-ui,sans-serif;
  line-height:1.45;
}

main{
  width:min(calc(100% - 24px),620px);
  margin:auto;
  padding:28px 0 70px;
}

h1{
  text-align:center;
  font-size:clamp(34px,8vw,42px);
  line-height:1;
  margin:0 0 28px;
}

h2,h3{
  line-height:1.15;
  margin-top:0;
}

button,
input,
textarea{
  font:inherit;
}

button{
  min-height:48px;
  border:2px solid #222;
  border-radius:12px;
  padding:10px 16px;
  background:#ffcf4a;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

input,
textarea{
  width:100%;
  padding:11px;
  border:2px solid #222;
  border-radius:11px;
  margin:7px 0 12px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.box{
  background:#fff;
  border:3px solid #222;
  border-radius:18px;
  padding:20px;
  margin:16px 0;
  box-shadow:5px 5px #222;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.top h1{
  margin:0;
  text-align:left;
}

.nav{
  display:flex;
  gap:8px;
  margin:12px 0 20px;
}

.nav button{
  flex:1;
  background:#fff;
}

.nav button.active{
  background:#ffcf4a;
}

.event{
  cursor:pointer;
}

.event:hover{
  transform:translateY(-1px);
}

.event-title{
  font-size:21px;
  font-weight:800;
  margin-bottom:5px;
}

.muted{
  color:#777;
}

.small{
  font-size:14px;
}

.center{
  text-align:center;
}

.error{
  color:#b00020;
  font-weight:700;
}

.success{
  font-weight:700;
}

.badge{
  display:inline-block;
  padding:4px 9px;
  border:2px solid #222;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
  margin-top:8px;
}

.yes{
  background:#8ee6a8;
}

.no{
  background:#ff9b9b;
}

.choice{
  display:flex;
  gap:10px;
  margin:18px 0;
}

.choice button{
  flex:1;
}

.choice .selected{
  outline:4px solid #222;
}

.scope{
  display:grid;
  gap:9px;
  margin:12px 0 18px;
}

.scope label{
  display:block;
  border:2px solid #222;
  border-radius:12px;
  padding:12px;
  cursor:pointer;
  background:#fff;
}

.scope input{
  width:auto;
  min-height:auto;
  margin:0 8px 0 0;
}

.invite-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #ddd;
}

.invite-row:last-child{
  border:0;
}

.person{
  padding:11px 0;
  border-bottom:1px solid #ddd;
}

.person:last-child{
  border:0;
}

.person-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.response-note{
  margin:5px 0 0;
  color:#555;
  white-space:pre-wrap;
}

.link{
  overflow-wrap:anywhere;
  background:#f1eee7;
  padding:11px;
  border-radius:9px;
  margin:12px 0;
}

.profile-photo{
  width:64px;
  height:64px;
  border-radius:50%;
  border:3px solid #222;
  object-fit:cover;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.actions button{
  flex:1;
  min-width:120px;
}

.danger{
  background:#ff9b9b;
}

.past-toggle{
  width:100%;
  background:#fff;
  text-align:left;
}

details{
  margin-top:18px;
}

summary{
  cursor:pointer;
  font-weight:800;
}

@media(max-width:360px){
  .choice{
    flex-direction:column;
  }
}
</style>
</head>

<body>
<main>
  <div id="app"></div>
</main>

<script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  onValue,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


/* ==================================================
   FIREBASE
================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyAagNLnoAEmzYzEY9OMeq_m5LR6bmId9zk",
  authDomain: "varunundo-422fe.firebaseapp.com",
  databaseURL: "https://varunundo-422fe-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "varunundo-422fe",
  storageBucket: "varunundo-422fe.firebasestorage.app",
  messagingSenderId: "733075243873",
  appId: "1:733075243873:web:9a232cc80e5c9004517b20"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getDatabase(firebaseApp);
const googleProvider = new GoogleAuthProvider();

const app = document.querySelector("#app");

let signingIn = false;
let activeListener = null;


/* ==================================================
   HELPERS
================================================== */

const esc = value =>
  String(value ?? "").replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));

const uid = () => auth.currentUser?.uid || null;

const newId = () =>
  crypto.randomUUID().replaceAll("-","").slice(0,12);

const eventUrl = id =>
  location.origin + location.pathname + "#e=" + id;

const formatDate = value => {
  if(!value) return "Date unavailable";

  return new Date(value).toLocaleString([],{
    day:"2-digit",
    month:"long",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
};

const isPast = event =>
  Number(event?.whenMs || new Date(event?.when || 0).getTime()) <= Date.now();

const validUsername = value =>
  /^[a-zA-Z0-9_]{3,20}$/.test(value);

const stopListener = () => {
  if(activeListener){
    activeListener();
    activeListener=null;
  }
};

async function shareEvent(id,button){
  const url = eventUrl(id);

  if(navigator.share){
    try{
      await navigator.share({
        title:"വരുന്നുണ്ടോ???",
        text:"Are you coming?",
        url
      });
      return;
    }catch(error){
      if(error?.name==="AbortError") return;
    }
  }

  try{
    await navigator.clipboard.writeText(url);

    if(button){
      const oldText=button.textContent;
      button.textContent="Copied!";
      setTimeout(()=>{
        if(button.isConnected)
          button.textContent=oldText;
      },1200);
    }
  }catch{
    prompt("Copy this event link:",url);
  }
}

function eventCard(id,event,relationship=""){
  const past=isPast(event);

  return `
    <div class="box event" data-id="${esc(id)}">
      <div class="event-title">${esc(event.title)}</div>
      <div>${formatDate(event.when)}</div>

      ${event.note
        ? `<p>${esc(event.note)}</p>`
        : ""
      }

      <p class="muted small">
        by @${esc(event.creatorUsername || "unknown")}
      </p>

      <span class="badge">
        ${past ? "Past event" :
          relationship==="creator"
          ? "Created by you"
          : relationship==="invited"
          ? "Invited"
          : event.scope==="public"
          ? "Public"
          : "Shared"}
      </span>

      <div class="actions" style="margin-top:12px">
        <button
          class="shareEvent"
          data-id="${esc(id)}"
          type="button"
        >
          Share
        </button>
      </div>
    </div>
  `;
}


/* ==================================================
   AUTH
================================================== */

async function requireAuth(){
  if(auth.currentUser)
    return true;

  if(signingIn)
    return false;

  signingIn=true;

  try{
    await signInWithPopup(auth,googleProvider);
    return true;
  }catch(error){
    console.error(
      "Firebase Auth Error:",
      error.code,
      error.message
    );

    if(
      error.code==="auth/popup-closed-by-user" ||
      error.code==="auth/cancelled-popup-request" ||
      error.code==="auth/popup-blocked"
    ){
      return false;
    }

    alert(
      "Google sign-in failed.\n\n" +
      error.code +
      "\n\n" +
      error.message
    );

    return false;
  }finally{
    signingIn=false;
  }
}


/* ==================================================
   PROFILE
================================================== */

async function getProfile(){
  const user=auth.currentUser;

  if(!user)
    return null;

  const snapshot =
    await get(ref(db,"users/"+user.uid));

  return snapshot.exists()
    ? snapshot.val()
    : null;
}

async function ensureProfile(){
  const user=auth.currentUser;

  if(!user)
    return null;

  const existing=await getProfile();

  if(existing?.username)
    return existing;

  return new Promise(resolve=>{

    app.innerHTML=`
      <div class="box">
        <h2>Welcome.</h2>
        <p>Choose your username.</p>

        <input
          id="username"
          maxlength="20"
          placeholder="akshay"
          autocomplete="off"
        >

        <p class="muted small">
          3–20 characters.
          Letters, numbers and underscore.
        </p>

        <p id="usernameError" class="error"></p>

        <button id="continue">
          Continue →
        </button>
      </div>
    `;

    document.querySelector("#continue").onclick=async()=>{

      const input=document.querySelector("#username");
      const error=document.querySelector("#usernameError");

      const username=input.value.trim();
      const usernameLower=username.toLowerCase();

      if(!validUsername(username)){
        error.textContent =
          "Use 3–20 letters, numbers or underscores.";
        return;
      }

      error.textContent="Checking…";

      try{
        const usernameRef =
          ref(db,"usernames/"+usernameLower);

        const result =
          await runTransaction(
            usernameRef,
            current=>{
              if(current===null)
                return user.uid;

              return;
            }
          );

        if(!result.committed){
          error.textContent =
            "That username is already taken.";
          return;
        }

        const profile={
          username,
          usernameLower,
          displayName:user.displayName || username,
          photoURL:user.photoURL || "",
          createdAt:Date.now()
        };

        await set(
          ref(db,"users/"+user.uid),
          profile
        );

        resolve(profile);

      }catch(errorObject){
        console.error(errorObject);
        error.textContent =
          "Couldn't create your profile.";
      }
    };
  });
}


/* ==================================================
   NAVIGATION
================================================== */

function header(){
  const user=auth.currentUser;

  return `
    <div class="top">
      <h1>വരുന്നുണ്ടോ???</h1>

      <button id="account">
        ${user
          ? "@"+esc(user.displayName || "Account")
          : "Sign in"
        }
      </button>
    </div>

    <div class="nav">
      <button id="home">Home</button>
      <button id="myEvents">My Events</button>
      <button id="create">Create</button>
    </div>
  `;
}

function wireHeader(){
  document.querySelector("#home")?.addEventListener(
    "click",
    ()=>{
      location.hash="";
      feedPage();
    }
  );

  document.querySelector("#myEvents")?.addEventListener(
    "click",
    eventsPage
  );

  document.querySelector("#create")?.addEventListener(
    "click",
    createPage
  );

  document.querySelector("#account")?.addEventListener(
    "click",
    async()=>{
      if(!auth.currentUser){
        const signedIn=await requireAuth();

        if(signedIn){
          await ensureProfile();
          route();
        }

        return;
      }

      profilePage();
    }
  );
}


/* ==================================================
   HOME
================================================== */

function feedPage(){
  stopListener();

  app.innerHTML=`
    ${header()}

    <div class="box">
      <h2>Home</h2>
      <p class="muted">Public events.</p>
    </div>

    <div id="feedList"></div>
  `;

  wireHeader();

  activeListener=onValue(
    ref(db,"events"),
    snapshot=>{

      const list=document.querySelector("#feedList");
      if(!list) return;

      const data=snapshot.val() || {};

      const events=Object.entries(data)
        .filter(([,event])=>event?.scope==="public")
        .sort((a,b)=>{
          const ap=isPast(a[1]);
          const bp=isPast(b[1]);

          if(ap!==bp)
            return ap ? 1 : -1;

          return (a[1].when||"")
            .localeCompare(b[1].when||"");
        });

      const upcoming=events.filter(([,event])=>!isPast(event));
      const past=events.filter(([,event])=>isPast(event));

      let html="";

      if(!upcoming.length){
        html+=`
          <div class="box">
            <p class="muted">No upcoming public events.</p>
            <button id="homeCreate">
              Create an event →
            </button>
          </div>
        `;
      }else{
        html+=upcoming
          .map(([id,event])=>eventCard(id,event))
          .join("");
      }

      if(past.length){
        html+=`
          <details>
            <summary>View past events (${past.length})</summary>
            ${past.map(([id,event])=>eventCard(id,event)).join("")}
          </details>
        `;
      }

      list.innerHTML=html;

      document.querySelector("#homeCreate")
        ?.addEventListener("click",createPage);

      wireEventCards(list);
    }
  );
}


/* ==================================================
   MY EVENTS
================================================== */

function eventsPage(){
  stopListener();

  const user=auth.currentUser;

  if(!user){
    app.innerHTML=`
      ${header()}

      <div class="box">
        <h2>My Events</h2>

        <p>
          Sign in to see the events
          you've created or been invited to.
        </p>

        <button id="google">
          Continue with Google
        </button>
      </div>
    `;

    wireHeader();

    document.querySelector("#google").onclick=async()=>{
      const signedIn=await requireAuth();

      if(signedIn){
        await ensureProfile();
        eventsPage();
      }
    };

    return;
  }

  app.innerHTML=`
    ${header()}

    <div class="box">
      <h2>My Events</h2>

      <p class="muted">
        Events you've created or been invited to.
      </p>
    </div>

    <div id="eventList"></div>
  `;

  wireHeader();

  activeListener=onValue(
    ref(db,"events"),
    snapshot=>{

      const list=document.querySelector("#eventList");
      if(!list) return;

      const data=snapshot.val() || {};

      const events=Object.entries(data)
        .filter(([,event])=>{
          return event?.creatorUid===user.uid ||
            !!event?.invitedUsers?.[user.uid];
        })
        .map(([id,event])=>({
          id,
          event,
          relationship:
            event.creatorUid===user.uid
              ? "creator"
              : "invited"
        }))
        .sort((a,b)=>{
          const ap=isPast(a.event);
          const bp=isPast(b.event);

          if(ap!==bp)
            return ap ? 1 : -1;

          return (a.event.when||"")
            .localeCompare(b.event.when||"");
        });

      const upcoming=events.filter(
        item=>!isPast(item.event)
      );

      const past=events.filter(
        item=>isPast(item.event)
      );

      let html="";

      if(!upcoming.length){
        html+=`
          <div class="box">
            <p class="muted">
              You don't have any upcoming events yet.
            </p>

            <button id="makeOne">
              Create an event →
            </button>
          </div>
        `;
      }else{
        html+=upcoming
          .map(item=>
            eventCard(
              item.id,
              item.event,
              item.relationship
            )
          )
          .join("");
      }

      if(past.length){
        html+=`
          <details>
            <summary>View past events (${past.length})</summary>
            ${past.map(item=>
              eventCard(
                item.id,
                item.event,
                item.relationship
              )
            ).join("")}
          </details>
        `;
      }

      list.innerHTML=html;

      document.querySelector("#makeOne")
        ?.addEventListener("click",createPage);

      wireEventCards(list);
    }
  );
}

function wireEventCards(container){
  container.querySelectorAll(".event").forEach(element=>{
    element.addEventListener("click",event=>{
      if(event.target.closest(".shareEvent"))
        return;

      location.hash="e="+element.dataset.id;
    });
  });

  container.querySelectorAll(".shareEvent").forEach(button=>{
    button.addEventListener("click",event=>{
      event.stopPropagation();
      shareEvent(button.dataset.id,button);
    });
  });
}


/* ==================================================
   CREATE / EDIT EVENT FORM
================================================== */

async function eventForm(existingId=null){

  if(!auth.currentUser){
    createPage();
    return;
  }

  const profile=await getProfile();

  if(!profile){
    await ensureProfile();
  }

  const currentProfile=await getProfile();

  let existing=null;

  if(existingId){
    const snapshot=
      await get(ref(db,"events/"+existingId));

    if(!snapshot.exists()){
      alert("Event not found.");
      return;
    }

    existing=snapshot.val();

    if(existing.creatorUid!==uid()){
      alert("Only the creator can edit this event.");
      return;
    }

    if(isPast(existing)){
      eventPage(existingId);
      return;
    }
  }

  const isEdit=!!existing;

  let invited=[];

  if(existing?.invitedUsers){
    for(const invitedUid of Object.keys(existing.invitedUsers)){
      const snapshot=
        await get(ref(db,"users/"+invitedUid+"/username"));

      if(snapshot.exists())
        invited.push(snapshot.val().toLowerCase());
    }
  }

  app.innerHTML=`
    ${header()}

    <div class="box">
      <h2>
        ${isEdit ? "Edit event" : "Create event"}
      </h2>

      <label>
        Event title
        <input
          id="title"
          maxlength="100"
          placeholder="Evening walk"
          value="${esc(existing?.title || "")}"
        >
      </label>

      <label>
        Date and time
        <input
          id="when"
          type="datetime-local"
          value="${esc(existing?.when || "")}"
        >
      </label>

      <label>
        Note
        <textarea
          id="eventNote"
          maxlength="1000"
          placeholder="Anything people should know?"
        >${esc(existing?.note || "")}</textarea>
      </label>

      <h3>Who can respond?</h3>

      <div class="scope">
        <label>
          <input
            type="radio"
            name="scope"
            value="link"
            ${existing?.scope==="link" || !existing ? "checked" : ""}
          >
          <strong>Send link</strong><br>
          <span class="muted small">
            Anyone with the link can respond.
          </span>
        </label>

        <label>
          <input
            type="radio"
            name="scope"
            value="invited"
            ${existing?.scope==="invited" ? "checked" : ""}
          >
          <strong>Invited people</strong><br>
          <span class="muted small">
            Only invited people can respond.
          </span>
        </label>

        <label>
          <input
            type="radio"
            name="scope"
            value="public"
            ${existing?.scope==="public" ? "checked" : ""}
          >
          <strong>Public</strong><br>
          <span class="muted small">
            Anyone can discover it in Home.
          </span>
        </label>
      </div>

      <div id="inviteBox"></div>

      <p id="eventError" class="error"></p>

      <div class="actions">
        <button id="saveEvent">
          ${isEdit ? "Save changes" : "Create →"}
        </button>

        ${
          isEdit
          ? `
            <button id="cancelEdit" type="button">
              Cancel
            </button>
          `
          : ""
        }
      </div>
    </div>
  `;

  wireHeader();

  const renderInvites=()=>{

    const box=document.querySelector("#inviteBox");

    const scope=
      document.querySelector(
        'input[name="scope"]:checked'
      )?.value;

    if(scope!=="invited"){
      box.innerHTML="";
      return;
    }

    box.innerHTML=`
      <h3>Invite people</h3>

      <input
        id="inviteUsername"
        placeholder="@username"
        maxlength="20"
      >

      <button id="addInvite" type="button">
        Add person
      </button>

      <div id="inviteList">
        ${invited.map((username,index)=>`
          <div class="invite-row">
            <span>@${esc(username)}</span>
            <button
              type="button"
              data-index="${index}"
            >
              Remove
            </button>
          </div>
        `).join("")}
      </div>
    `;

    document.querySelector("#addInvite").onclick=async()=>{

      const input=
        document.querySelector("#inviteUsername");

      const username=input.value.trim();
      const lower=username.toLowerCase();

      if(!validUsername(username)){
        alert("Enter a valid username.");
        return;
      }

      if(invited.includes(lower)){
        input.value="";
        return;
      }

      const snapshot=
        await get(ref(db,"usernames/"+lower));

      if(!snapshot.exists()){
        alert("That username doesn't exist.");
        return;
      }

      if(snapshot.val()===uid()){
        alert("You are already the creator.");
        return;
      }

      invited.push(lower);
      input.value="";
      renderInvites();
    };

    document.querySelectorAll("#inviteList button")
      .forEach(button=>{
        button.onclick=()=>{
          invited.splice(
            Number(button.dataset.index),
            1
          );
          renderInvites();
        };
      });
  };

  document.querySelectorAll('input[name="scope"]')
    .forEach(input=>{
      input.onchange=renderInvites;
    });

  renderInvites();

  document.querySelector("#cancelEdit")
    ?.addEventListener(
      "click",
      ()=>eventPage(existingId)
    );

  document.querySelector("#saveEvent").onclick=async()=>{

    const error=document.querySelector("#eventError");

    const title=
      document.querySelector("#title").value.trim();

    const when=
      document.querySelector("#when").value;

    const note=
      document.querySelector("#eventNote").value.trim();

    const scope=
      document.querySelector(
        'input[name="scope"]:checked'
      )?.value;

    if(!title){
      error.textContent="Give the event a title.";
      return;
    }

    if(!when){
      error.textContent="Choose a date and time.";
      return;
    }

    const whenMs=new Date(when).getTime();

    if(!Number.isFinite(whenMs) || whenMs<=Date.now()){
      error.textContent=
        "Choose a future date and time.";
      return;
    }

    if(scope==="invited" && !invited.length){
      error.textContent="Add at least one person.";
      return;
    }

    const invitedUsers={};

    for(const username of invited){
      const snapshot=
        await get(ref(db,"usernames/"+username));

      if(snapshot.exists())
        invitedUsers[snapshot.val()]=true;
    }

    const id=existingId || newId();

    const createdAt=
      existing?.createdAt || Date.now();

    const event={
      title,
      note,
      when,
      whenMs,
      scope,
      creatorUid:uid(),
      creatorUsername:currentProfile.username,
      createdAt,
      invitedUsers,
      responses:existing?.responses || {}
    };

    try{
      await set(
        ref(db,"events/"+id),
        event
      );

      location.hash="e="+id;

    }catch(errorObject){
      console.error(errorObject);

      error.textContent=
        isEdit
        ? "Couldn't save the changes."
        : "Couldn't create the event.";
    }
  };
}


/* ==================================================
   CREATE PAGE
================================================== */

function createPage(){
  stopListener();

  if(!auth.currentUser){
    app.innerHTML=`
      ${header()}

      <div class="box">
        <h2>Create an event</h2>

        <p>
          Sign in to create an event.
        </p>

        <button id="google">
          Continue with Google
        </button>
      </div>
    `;

    wireHeader();

    document.querySelector("#google").onclick=async()=>{
      const signedIn=await requireAuth();

      if(signedIn){
        await ensureProfile();
        eventForm(null);
      }
    };

    return;
  }

  eventForm(null);
}


/* ==================================================
   EDIT EVENT
================================================== */

function editEvent(id){
  eventForm(id);
}


/* ==================================================
   DELETE EVENT
================================================== */

async function deleteEvent(id){

  if(!auth.currentUser)
    return;

  const snapshot=
    await get(ref(db,"events/"+id));

  if(!snapshot.exists()){
    alert("Event not found.");
    return;
  }

  const event=snapshot.val();

  if(event.creatorUid!==uid()){
    alert("Only the creator can delete this event.");
    return;
  }

  if(isPast(event)){
    alert("Past events are locked.");
    return;
  }

  if(!confirm(
    "Delete this event?\n\nThis cannot be undone."
  ))
    return;

  try{
    await set(ref(db,"events/"+id),null);

    location.hash="";
    feedPage();

  }catch(errorObject){
    console.error(errorObject);
    alert("Couldn't delete the event.");
  }
}


/* ==================================================
   EVENT PAGE
================================================== */

function eventPage(id){

  stopListener();

  app.innerHTML=`
    ${header()}

    <div id="eventShell"></div>
  `;

  wireHeader();

  activeListener=onValue(
    ref(db,"events/"+id),
    async snapshot=>{

      const shell=document.querySelector("#eventShell");
      if(!shell) return;

      if(!snapshot.exists()){
        shell.innerHTML=`
          <div class="box">
            <h2>Event not found.</h2>
            <p class="muted">
              This event doesn't exist.
            </p>
          </div>
        `;

        return;
      }

      const event=snapshot.val();
      const user=auth.currentUser;
      const userUid=user?.uid || null;

      const past=isPast(event);
      const isCreator=userUid===event.creatorUid;
      const isInvited=
        !!userUid && !!event.invitedUsers?.[userUid];

      const isPublic=event.scope==="public";

      const canRespond=
        !!userUid &&
        !past &&
        (
          event.scope==="link" ||
          isPublic ||
          isCreator ||
          isInvited
        );

      const responses=
        Object.entries(event.responses || {});

      const coming=
        responses.filter(
          ([,response])=>response.status==="yes"
        );

      const notComing=
        responses.filter(
          ([,response])=>response.status==="no"
        );

      const myResponse=
        userUid
        ? event.responses?.[userUid]
        : null;

      shell.innerHTML=`

        <div class="box">

          <p class="muted">
            ${
              past
              ? "Past event · Locked"
              : event.scope==="public"
              ? "Public event"
              : event.scope==="invited"
              ? "Invited event"
              : "Shared event"
            }
          </p>

          <h2>${esc(event.title)}</h2>

          <p>${formatDate(event.when)}</p>

          ${
            event.note
            ? `
              <div class="box">
                <strong>Note</strong>
                <p style="white-space:pre-wrap">
                  ${esc(event.note)}
                </p>
              </div>
            `
            : ""
          }

          <p class="muted small">
            Created by @${esc(event.creatorUsername || "unknown")}
            · ${formatDate(new Date(event.createdAt).toISOString())}
          </p>

          ${
            isCreator && !past
            ? `
              <div class="actions">
                <button id="edit">Edit</button>
                <button id="delete" class="danger">
                  Delete
                </button>
              </div>
            `
            : ""
          }

          ${
            past
            ? `
              <div class="box">
                <strong>Past event · Locked</strong>
                <p class="muted">
                  Responses and event details can no longer be changed.
                </p>
              </div>
            `
            : ""
          }

          ${
            !userUid && !past
            ? `
              <div class="box">
                <p>
                  You can view this event without signing in.
                </p>

                <button id="respond">
                  Sign in to respond
                </button>
              </div>
            `
            : ""
          }

          ${
            userUid &&
            !past &&
            !canRespond &&
            !isCreator
            ? `
              <div class="box">
                <p>You're signed in.</p>
                <p class="muted">
                  You're not invited to respond to this event.
                </p>
              </div>
            `
            : ""
          }

          ${
            canRespond
            ? `
              <h3>Are you coming?</h3>

              <div class="choice">
                <button
                  id="yes"
                  class="yes ${
                    myResponse?.status==="yes"
                    ? "selected"
                    : ""
                  }"
                >
                  ${
                    myResponse?.status==="yes"
                    ? "✓ "
                    : ""
                  }COMING
                </button>

                <button
                  id="no"
                  class="no ${
                    myResponse?.status==="no"
                    ? "selected"
                    : ""
                  }"
                >
                  ${
                    myResponse?.status==="no"
                    ? "✓ "
                    : ""
                  }NOT COMING
                </button>
              </div>

              <label>
                Your note
                <textarea
                  id="responseNote"
                  maxlength="500"
                  placeholder="Anything you want the group to know?"
                >${esc(myResponse?.note || "")}</textarea>
              </label>

              <button id="saveResponse">
                Save response
              </button>

              <p id="message" class="success"></p>
            `
            : ""
          }

        </div>


        <div class="box">

          <h3>Coming · ${coming.length}</h3>

          ${
            coming.length
            ? coming.map(([,response])=>`
                <div class="person">
                  <div class="person-head">
                    <strong>
                      @${esc(response.username)}
                    </strong>
                    <b>✓</b>
                  </div>

                  ${
                    response.note
                    ? `
                      <div class="response-note">
                        ${esc(response.note)}
                      </div>
                    `
                    : ""
                  }
                </div>
              `).join("")
            : `
              <p class="muted">Nobody yet.</p>
            `
          }

        </div>


        <div class="box">

          <h3>Not coming · ${notComing.length}</h3>

          ${
            notComing.length
            ? notComing.map(([,response])=>`
                <div class="person">
                  <div class="person-head">
                    <strong>
                      @${esc(response.username)}
                    </strong>
                    <b>×</b>
                  </div>

                  ${
                    response.note
                    ? `
                      <div class="response-note">
                        ${esc(response.note)}
                      </div>
                    `
                    : ""
                  }
                </div>
              `).join("")
            : `
              <p class="muted">Nobody yet.</p>
            `
          }

        </div>


        <div class="box">

          <strong>Share this event</strong>

          <div class="link">
            ${esc(eventUrl(id))}
          </div>

          <div class="actions">
            <button id="share">Share</button>
            <button id="copy">Copy link</button>
          </div>

        </div>
      `;

      document.querySelector("#edit")
        ?.addEventListener(
          "click",
          ()=>editEvent(id)
        );

      document.querySelector("#delete")
        ?.addEventListener(
          "click",
          ()=>deleteEvent(id)
        );

      document.querySelector("#respond")
        ?.addEventListener(
          "click",
          async()=>{
            const signedIn=await requireAuth();

            if(signedIn){
              await ensureProfile();
              eventPage(id);
            }
          }
        );

      document.querySelector("#share")
        ?.addEventListener(
          "click",
          event=>shareEvent(
            id,
            event.currentTarget
          )
        );

      document.querySelector("#copy")
        ?.addEventListener(
          "click",
          async()=>{
            const button=
              document.querySelector("#copy");

            try{
              await navigator.clipboard.writeText(
                eventUrl(id)
              );

              button.textContent="Copied!";

              setTimeout(()=>{
                if(button.isConnected)
                  button.textContent="Copy link";
              },1200);

            }catch{
              prompt(
                "Copy this event link:",
                eventUrl(id)
              );
            }
          }
        );

      if(!canRespond)
        return;

      let choice=myResponse?.status || "";

      const yes=document.querySelector("#yes");
      const no=document.querySelector("#no");
      const responseNote=
        document.querySelector("#responseNote");
      const message=
        document.querySelector("#message");

      const updateChoice=()=>{
        yes?.classList.toggle(
          "selected",
          choice==="yes"
        );

        no?.classList.toggle(
          "selected",
          choice==="no"
        );

        if(yes)
          yes.textContent=
            choice==="yes"
            ? "✓ COMING"
            : "COMING";

        if(no)
          no.textContent=
            choice==="no"
            ? "✓ NOT COMING"
            : "NOT COMING";
      };

      yes?.addEventListener(
        "click",
        ()=>{
          choice="yes";
          updateChoice();
        }
      );

      no?.addEventListener(
        "click",
        ()=>{
          choice="no";
          updateChoice();
        }
      );

      document.querySelector("#saveResponse")
        ?.addEventListener(
          "click",
          async()=>{

            if(choice!=="yes" && choice!=="no"){
              message.textContent=
                "Choose COMING or NOT COMING.";
              return;
            }

            const profile=await getProfile();

            if(!profile)
              return;

            const note=
              responseNote.value.trim();

            try{
              await set(
                ref(
                  db,
                  "events/"
                  +id
                  +"/responses/"
                  +userUid
                ),
                {
                  username:profile.username,
                  status:choice,
                  note,
                  updatedAt:Date.now()
                }
              );

              message.textContent=
                choice==="yes"
                ? "You're coming."
                : "You're not coming.";

            }catch(errorObject){
              console.error(errorObject);

              message.textContent=
                "Couldn't save your response.";
            }
          }
        );
    }
  );
}


/* ==================================================
   PROFILE
================================================== */

async function profilePage(){

  if(!auth.currentUser)
    return;

  const profile=await getProfile();

  app.innerHTML=`
    ${header()}

    <div class="box center">

      ${
        profile?.photoURL
        ? `
          <img
            class="profile-photo"
            src="${esc(profile.photoURL)}"
            alt=""
          >
        `
        : ""
      }

      <h2>
        @${esc(profile?.username || "unknown")}
      </h2>

      <p class="muted">
        ${esc(
          profile?.displayName ||
          auth.currentUser.displayName ||
          ""
        )}
      </p>

      <button id="signout">
        Sign out
      </button>

    </div>
  `;

  wireHeader();

  document.querySelector("#signout").onclick=async()=>{
    await signOut(auth);

    location.hash="";
    route();
  };
}


/* ==================================================
   ROUTER
================================================== */

function route(){
  stopListener();

  const match=
    location.hash.match(/^#e=([^]+)$/);

  if(match){
    eventPage(match[1]);
    return;
  }

  feedPage();
}


/* ==================================================
   START
================================================== */

auth.onAuthStateChanged(
  async user=>{
    if(user){
      const profile=await getProfile();

      if(!profile)
        await ensureProfile();
    }

    route();
  }
);

addEventListener(
  "hashchange",
  route
);

</script>
