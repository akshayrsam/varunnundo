<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>വരുന്നുണ്ടോ???</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#fff9ef;
  color:#222;
  font:17px system-ui,sans-serif;
  line-height:1.45;
}

main{
  width:min(calc(100% - 24px),620px);
  margin:auto;
  padding:28px 0 70px;
}

h1{
  text-align:center;
  font-size:clamp(34px,8vw,42px);
  line-height:1;
  margin:0 0 28px;
}

h2,h3{
  line-height:1.15;
  margin-top:0;
}

button,
input,
textarea{
  font:inherit;
}

button{
  min-height:48px;
  border:2px solid #222;
  border-radius:12px;
  padding:10px 16px;
  background:#ffcf4a;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

input,
textarea{
  width:100%;
  padding:11px;
  border:2px solid #222;
  border-radius:11px;
  margin:7px 0 12px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.box{
  background:#fff;
  border:3px solid #222;
  border-radius:18px;
  padding:20px;
  margin:16px 0;
  box-shadow:5px 5px #222;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.top h1{
  margin:0;
  text-align:left;
}

.nav{
  display:flex;
  gap:8px;
  margin:12px 0 20px;
}

.nav button{
  flex:1;
  background:#fff;
}

.event{
  cursor:pointer;
}

.event:hover{
  transform:translateY(-1px);
}

.event-title{
  font-size:21px;
  font-weight:800;
  margin-bottom:5px;
}

.muted{
  color:#777;
}

.small{
  font-size:14px;
}

.center{
  text-align:center;
}

.error{
  color:#b00020;
  font-weight:700;
}

.success{
  font-weight:700;
}

.choice{
  display:flex;
  gap:10px;
  margin:18px 0;
}

.choice button{
  flex:1;
}

.choice .selected{
  outline:4px solid #222;
}

.yes{
  background:#8ee6a8;
}

.no{
  background:#ff9b9b;
}

.person{
  padding:11px 0;
  border-bottom:1px solid #ddd;
}

.person:last-child{
  border:0;
}

.person-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.person-info{
  display:flex;
  align-items:center;
  gap:10px;
}

.person-photo{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #222;
}

.response-note{
  margin:5px 0 0 48px;
  color:#555;
  white-space:pre-wrap;
}

.link{
  overflow-wrap:anywhere;
  background:#f1eee7;
  padding:11px;
  border-radius:9px;
  margin:12px 0;
}

.profile-photo{
  width:64px;
  height:64px;
  border-radius:50%;
  border:3px solid #222;
  object-fit:cover;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.actions button{
  flex:1;
  min-width:120px;
}

.danger{
  background:#ff9b9b;
}

@media(max-width:360px){
  .choice{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<main>
  <div id="app"></div>
</main>

<script type="module">

import{
  initializeApp
}
from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import{
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
}
from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import{
  getDatabase,
  ref,
  get,
  set,
  onValue
}
from"https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


/* ==================================================
   FIREBASE
================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyAagNLnoAEmzYzEY9OMeq_m5LR6bmId9zk",
  authDomain: "varunundo-422fe.firebaseapp.com",
  databaseURL: "https://varunundo-422fe-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "varunundo-422fe",
  storageBucket: "varunundo-422fe.firebasestorage.app",
  messagingSenderId: "733075243873",
  appId: "1:733075243873:web:9a232cc80e5c9004517b20"
};

const firebaseApp=initializeApp(firebaseConfig);

const auth=getAuth(firebaseApp);
const db=getDatabase(firebaseApp);
const googleProvider=new GoogleAuthProvider();

const app=document.querySelector("#app");

let signingIn=false;
let activeListener=null;


/* ==================================================
   HELPERS
================================================== */

const esc=value=>
  String(value??"").replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));

const uid=()=>
  auth.currentUser?.uid||null;

const newId=()=>
  crypto.randomUUID()
    .replaceAll("-","")
    .slice(0,12);

const eventUrl=id=>
  location.origin+
  location.pathname+
  "#e="+id;

const formatDate=value=>{

  if(!value)
    return "Date unavailable";

  return new Date(value).toLocaleString([],{
    day:"2-digit",
    month:"long",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
};

function stopListener(){

  if(activeListener){
    activeListener();
    activeListener=null;
  }
}


/* ==================================================
   SHARE
================================================== */

async function shareEvent(id,button){

  const url=eventUrl(id);

  if(navigator.share){

    try{

      await navigator.share({
        title:"വരുന്നുണ്ടോ???",
        text:"Are you coming?",
        url
      });

      return;

    }catch(error){

      if(error?.name==="AbortError")
        return;
    }
  }

  try{

    await navigator.clipboard.writeText(url);

    if(button){

      const oldText=
        button.textContent;

      button.textContent="Copied!";

      setTimeout(()=>{

        if(button.isConnected)
          button.textContent=oldText;

      },1200);
    }

  }catch{

    prompt(
      "Copy this event link:",
      url
    );
  }
}


/* ==================================================
   AUTH
================================================== */

async function requireAuth(){

  if(auth.currentUser)
    return true;

  if(signingIn)
    return false;

  signingIn=true;

  try{

    await signInWithPopup(
      auth,
      googleProvider
    );

    return true;

  }catch(error){

    console.error(
      "Firebase Auth Error:",
      error.code,
      error.message
    );

    if(
      error.code==="auth/popup-closed-by-user" ||
      error.code==="auth/cancelled-popup-request" ||
      error.code==="auth/popup-blocked"
    ){
      return false;
    }

    alert(
      "Google sign-in failed.\n\n"+
      error.code+
      "\n\n"+
      error.message
    );

    return false;

  }finally{

    signingIn=false;
  }
}


/* ==================================================
   HEADER
================================================== */

function header(){

  const user=auth.currentUser;

  return `

    <div class="top">

      <h1>വരുന്നുണ്ടോ???</h1>

      <button id="account">

        ${
          user
          ? esc(
              user.displayName||
              "Account"
            )
          : "Sign in"
        }

      </button>

    </div>


    <div class="nav">

      <button id="home">
        Home
      </button>

      <button id="myEvents">
        My Events
      </button>

      <button id="create">
        Create
      </button>

    </div>
  `;
}


function wireHeader(){

  document.querySelector("#home")
    ?.addEventListener(
      "click",
      ()=>{
        location.hash="";
        homePage();
      }
    );


  document.querySelector("#myEvents")
    ?.addEventListener(
      "click",
      myEventsPage
    );


  document.querySelector("#create")
    ?.addEventListener(
      "click",
      createPage
    );


  document.querySelector("#account")
    ?.addEventListener(
      "click",
      async()=>{

        if(!auth.currentUser){

          const signedIn=
            await requireAuth();

          if(signedIn)
            route();

          return;
        }

        profilePage();
      }
    );
}


/* ==================================================
   EVENT CARD
================================================== */

function eventCard(id,event){

  return `

    <div
      class="box event"
      data-id="${esc(id)}"
    >

      <div class="event-title">
        ${esc(event.title)}
      </div>

      <div>
        ${formatDate(event.when)}
      </div>

      ${
        event.note
        ? `
          <p>
            ${esc(event.note)}
          </p>
        `
        : ""
      }

      <p class="muted small">

        Created by
        ${esc(
          event.creatorName||
          "Unknown"
        )}

      </p>

      <div class="actions">

        <button
          class="shareEvent"
          data-id="${esc(id)}"
          type="button"
        >
          Share
        </button>

      </div>

    </div>
  `;
}


function wireEventCards(container){

  container
    .querySelectorAll(".event")
    .forEach(element=>{

      element.addEventListener(
        "click",
        event=>{

          if(
            event.target.closest(
              ".shareEvent"
            )
          )
            return;

          location.hash=
            "e="+element.dataset.id;
        }
      );
    });


  container
    .querySelectorAll(".shareEvent")
    .forEach(button=>{

      button.addEventListener(
        "click",
        event=>{

          event.stopPropagation();

          shareEvent(
            button.dataset.id,
            button
          );
        }
      );
    });
}


/* ==================================================
   HOME
================================================== */

function homePage(){

  stopListener();

  app.innerHTML=`

    ${header()}

    <div class="box">

      <h2>Events</h2>

      <p class="muted">
        Create an event and share the link.
      </p>

      <button id="homeCreate">
        Create an event →
      </button>

    </div>

    <div id="eventList"></div>
  `;

  wireHeader();


  document.querySelector("#homeCreate")
    ?.addEventListener(
      "click",
      createPage
    );


  activeListener=onValue(
    ref(db,"events"),
    snapshot=>{

      const list=
        document.querySelector(
          "#eventList"
        );

      if(!list)
        return;

      const data=
        snapshot.val()||{};


      const events=
        Object.entries(data)
          .sort(
            (a,b)=>
              (a[1].when||"")
              .localeCompare(
                b[1].when||""
              )
          );


      if(!events.length){

        list.innerHTML=`

          <div class="box">

            <p class="muted">
              No events yet.
            </p>

          </div>
        `;

        return;
      }


      list.innerHTML=
        events
          .map(
            ([id,event])=>
              eventCard(id,event)
          )
          .join("");


      wireEventCards(list);
    }
  );
}


/* ==================================================
   MY EVENTS
================================================== */

function myEventsPage(){

  stopListener();

  const user=auth.currentUser;


  if(!user){

    app.innerHTML=`

      ${header()}

      <div class="box">

        <h2>My Events</h2>

        <p>
          Sign in to see the events
          you created.
        </p>

        <button id="google">
          Continue with Google
        </button>

      </div>
    `;

    wireHeader();


    document.querySelector("#google")
      .onclick=async()=>{

        const signedIn=
          await requireAuth();

        if(signedIn)
          myEventsPage();
      };

    return;
  }


  app.innerHTML=`

    ${header()}

    <div class="box">

      <h2>My Events</h2>

    </div>

    <div id="eventList"></div>
  `;

  wireHeader();


  activeListener=onValue(
    ref(db,"events"),
    snapshot=>{

      const list=
        document.querySelector(
          "#eventList"
        );

      if(!list)
        return;


      const data=
        snapshot.val()||{};


      const events=
        Object.entries(data)
          .filter(
            ([,event])=>
              event?.creatorUid===user.uid
          )
          .sort(
            (a,b)=>
              (a[1].when||"")
              .localeCompare(
                b[1].when||""
              )
          );


      if(!events.length){

        list.innerHTML=`

          <div class="box">

            <p class="muted">
              You haven't created
              any events yet.
            </p>

            <button id="makeOne">
              Create an event →
            </button>

          </div>
        `;


        document.querySelector("#makeOne")
          ?.addEventListener(
            "click",
            createPage
          );

        return;
      }


      list.innerHTML=
        events
          .map(
            ([id,event])=>
              eventCard(id,event)
          )
          .join("");


      wireEventCards(list);
    }
  );
}


/* ==================================================
   CREATE EVENT
================================================== */

function createPage(){

  stopListener();


  if(!auth.currentUser){

    app.innerHTML=`

      ${header()}

      <div class="box">

        <h2>Create an event</h2>

        <p>
          Sign in with Google
          to create an event.
        </p>

        <button id="google">
          Continue with Google
        </button>

      </div>
    `;

    wireHeader();


    document.querySelector("#google")
      .onclick=async()=>{

        const signedIn=
          await requireAuth();

        if(signedIn)
          createPage();
      };

    return;
  }


  app.innerHTML=`

    ${header()}

    <div class="box">

      <h2>Create an event</h2>


      <label>

        Event title

        <input
          id="title"
          maxlength="100"
          placeholder="Evening walk"
        >

      </label>


      <label>

        Date and time

        <input
          id="when"
          type="datetime-local"
        >

      </label>


      <label>

        Note

        <textarea
          id="eventNote"
          maxlength="1000"
          placeholder="Anything people should know?"
        ></textarea>

      </label>


      <p
        id="eventError"
        class="error"
      ></p>


      <button id="saveEvent">
        Create →
      </button>

    </div>
  `;

  wireHeader();


  document.querySelector("#saveEvent")
    .onclick=async()=>{

      const error=
        document.querySelector(
          "#eventError"
        );


      const title=
        document.querySelector(
          "#title"
        ).value.trim();


      const when=
        document.querySelector(
          "#when"
        ).value;


      const note=
        document.querySelector(
          "#eventNote"
        ).value.trim();


      if(!title){

        error.textContent=
          "Give the event a title.";

        return;
      }


      if(!when){

        error.textContent=
          "Choose a date and time.";

        return;
      }


      const whenMs=
        new Date(when).getTime();


      if(
        !Number.isFinite(whenMs) ||
        whenMs<=Date.now()
      ){

        error.textContent=
          "Choose a future date and time.";

        return;
      }


      const user=auth.currentUser;

      if(!user){

        error.textContent=
          "Please sign in first.";

        return;
      }


      const id=newId();


      const event={

        title,

        when,

        note,

        creatorUid:
          user.uid,

        creatorName:
          user.displayName||
          "Unknown",

        creatorPhoto:
          user.photoURL||
          "",

        createdAt:
          Date.now(),

        responses:{}

      };


      try{

        await set(
          ref(
            db,
            "events/"+id
          ),
          event
        );


        location.hash=
          "e="+id;

      }catch(errorObject){

        console.error(
          errorObject
        );

        error.textContent=
          "Couldn't create the event.";
      }
    };
}


/* ==================================================
   EDIT EVENT
================================================== */

async function editEvent(id){

  const user=auth.currentUser;

  if(!user)
    return;


  const snapshot=
    await get(
      ref(db,"events/"+id)
    );


  if(!snapshot.exists()){

    alert("Event not found.");

    return;
  }


  const event=snapshot.val();


  if(event.creatorUid!==user.uid){

    alert(
      "Only the creator can edit this event."
    );

    return;
  }


  app.innerHTML=`

    ${header()}

    <div class="box">

      <h2>Edit event</h2>


      <label>

        Event title

        <input
          id="title"
          maxlength="100"
          value="${esc(event.title)}"
        >

      </label>


      <label>

        Date and time

        <input
          id="when"
          type="datetime-local"
          value="${esc(event.when)}"
        >

      </label>


      <label>

        Note

        <textarea
          id="eventNote"
          maxlength="1000"
        >${esc(event.note||"")}</textarea>

      </label>


      <p
        id="eventError"
        class="error"
      ></p>


      <div class="actions">

        <button id="saveEvent">
          Save changes
        </button>

        <button id="cancel">
          Cancel
        </button>

      </div>

    </div>
  `;

  wireHeader();


  document.querySelector("#cancel")
    .onclick=()=>eventPage(id);


  document.querySelector("#saveEvent")
    .onclick=async()=>{

      const error=
        document.querySelector(
          "#eventError"
        );


      const title=
        document.querySelector(
          "#title"
        ).value.trim();


      const when=
        document.querySelector(
          "#when"
        ).value;


      const note=
        document.querySelector(
          "#eventNote"
        ).value.trim();


      if(!title){

        error.textContent=
          "Give the event a title.";

        return;
      }


      if(!when){

        error.textContent=
          "Choose a date and time.";

        return;
      }


      const whenMs=
        new Date(when).getTime();


      if(
        !Number.isFinite(whenMs) ||
        whenMs<=Date.now()
      ){

        error.textContent=
          "Choose a future date and time.";

        return;
      }


      const updated={

        title,

        when,

        note,

        creatorUid:
          event.creatorUid,

        creatorName:
          event.creatorName,

        creatorPhoto:
          event.creatorPhoto||"",

        createdAt:
          event.createdAt,

        responses:
          event.responses||{}

      };


      try{

        await set(
          ref(
            db,
            "events/"+id
          ),
          updated
        );


        eventPage(id);

      }catch(errorObject){

        console.error(
          errorObject
        );

        error.textContent=
          "Couldn't save the changes.";
      }
    };
}


/* ==================================================
   DELETE EVENT
================================================== */

async function deleteEvent(id){

  const user=auth.currentUser;

  if(!user)
    return;


  const snapshot=
    await get(
      ref(db,"events/"+id)
    );


  if(!snapshot.exists()){

    alert("Event not found.");

    return;
  }


  const event=snapshot.val();


  if(event.creatorUid!==user.uid){

    alert(
      "Only the creator can delete this event."
    );

    return;
  }


  if(!confirm(
    "Delete this event?\n\nThis cannot be undone."
  ))
    return;


  try{

    await set(
      ref(db,"events/"+id),
      null
    );


    location.hash="";

    homePage();

  }catch(errorObject){

    console.error(
      errorObject
    );

    alert(
      "Couldn't delete the event."
    );
  }
}


/* ==================================================
   EVENT PAGE
================================================== */

function eventPage(id){

  stopListener();


  app.innerHTML=`

    ${header()}

    <div id="eventShell"></div>
  `;

  wireHeader();


  activeListener=onValue(
    ref(db,"events/"+id),
    snapshot=>{

      const shell=
        document.querySelector(
          "#eventShell"
        );


      if(!shell)
        return;


      if(!snapshot.exists()){

        shell.innerHTML=`

          <div class="box">

            <h2>
              Event not found.
            </h2>

            <p class="muted">
              This event doesn't exist
              or has been deleted.
            </p>

          </div>
        `;

        return;
      }


      const event=snapshot.val();

      const user=auth.currentUser;

      const userUid=
        user?.uid||null;

      const isCreator=
        userUid===event.creatorUid;


      const responses=
        Object.entries(
          event.responses||{}
        );


      const coming=
        responses.filter(
          ([,response])=>
            response.status==="yes"
        );


      const notComing=
        responses.filter(
          ([,response])=>
            response.status==="no"
        );


      const myResponse=
        userUid
        ? event.responses?.[userUid]
        : null;


      shell.innerHTML=`

        <div class="box">

          <h2>
            ${esc(event.title)}
          </h2>


          <p>
            ${formatDate(event.when)}
          </p>


          ${
            event.note
            ? `
              <div class="box">

                <strong>
                  Note
                </strong>

                <p style="white-space:pre-wrap">
                  ${esc(event.note)}
                </p>

              </div>
            `
            : ""
          }


          <div class="person-info">

            ${
              event.creatorPhoto
              ? `
                <img
                  class="person-photo"
                  src="${esc(
                    event.creatorPhoto
                  )}"
                  alt=""
                >
              `
              : ""
            }

            <p class="muted small">
              Created by
              ${esc(
                event.creatorName||
                "Unknown"
              )}
            </p>

          </div>


          ${
            isCreator
            ? `
              <div
                class="actions"
                style="margin-top:14px"
              >

                <button id="edit">
                  Edit
                </button>

                <button
                  id="delete"
                  class="danger"
                >
                  Delete
                </button>

              </div>
            `
            : ""
          }


          ${
            !userUid
            ? `
              <div class="box">

                <p>
                  Sign in with Google
                  to respond.
                </p>

                <button id="respond">
                  Continue with Google
                </button>

              </div>
            `
            : `
              <h3>
                Are you coming?
              </h3>


              <div class="choice">

                <button
                  id="yes"
                  class="yes ${
                    myResponse?.status==="yes"
                    ? "selected"
                    : ""
                  }"
                >

                  ${
                    myResponse?.status==="yes"
                    ? "✓ "
                    : ""
                  }

                  COMING

                </button>


                <button
                  id="no"
                  class="no ${
                    myResponse?.status==="no"
                    ? "selected"
                    : ""
                  }"
                >

                  ${
                    myResponse?.status==="no"
                    ? "✓ "
                    : ""
                  }

                  NOT COMING

                </button>

              </div>


              <label>

                Your note

                <textarea
                  id="responseNote"
                  maxlength="500"
                  placeholder="Anything you want people to know?"
                >${esc(
                  myResponse?.note||""
                )}</textarea>

              </label>


              <button id="saveResponse">
                Save response
              </button>


              <p
                id="message"
                class="success"
              ></p>
            `
          }

        </div>


        <div class="box">

          <h3>
            Coming · ${coming.length}
          </h3>


          ${
            coming.length
            ? coming.map(
                ([,response])=>`

                  <div class="person">

                    <div class="person-head">

                      <div class="person-info">

                        ${
                          response.photo
                          ? `
                            <img
                              class="person-photo"
                              src="${esc(
                                response.photo
                              )}"
                              alt=""
                            >
                          `
                          : ""
                        }

                        <strong>
                          ${esc(
                            response.name||
                            "Unknown"
                          )}
                        </strong>

                      </div>

                      <b>✓</b>

                    </div>


                    ${
                      response.note
                      ? `
                        <div class="response-note">
                          ${esc(
                            response.note
                          )}
                        </div>
                      `
                      : ""
                    }

                  </div>

                `
              ).join("")
            : `
              <p class="muted">
                Nobody yet.
              </p>
            `
          }

        </div>


        <div class="box">

          <h3>
            Not coming · ${notComing.length}
          </h3>


          ${
            notComing.length
            ? notComing.map(
                ([,response])=>`

                  <div class="person">

                    <div class="person-head">

                      <div class="person-info">

                        ${
                          response.photo
                          ? `
                            <img
                              class="person-photo"
                              src="${esc(
                                response.photo
                              )}"
                              alt=""
                            >
                          `
                          : ""
                        }

                        <strong>
                          ${esc(
                            response.name||
                            "Unknown"
                          )}
                        </strong>

                      </div>

                      <b>×</b>

                    </div>


                    ${
                      response.note
                      ? `
                        <div class="response-note">
                          ${esc(
                            response.note
                          )}
                        </div>
                      `
                      : ""
                    }

                  </div>

                `
              ).join("")
            : `
              <p class="muted">
                Nobody yet.
              </p>
            `
          }

        </div>


        <div class="box">

          <strong>
            Share this event
          </strong>


          <div class="link">
            ${esc(eventUrl(id))}
          </div>


          <div class="actions">

            <button id="share">
              Share
            </button>

            <button id="copy">
              Copy link
            </button>

          </div>

        </div>
      `;


      /* EDIT */

      document.querySelector("#edit")
        ?.addEventListener(
          "click",
          ()=>editEvent(id)
        );


      /* DELETE */

      document.querySelector("#delete")
        ?.addEventListener(
          "click",
          ()=>deleteEvent(id)
        );


      /* GOOGLE SIGN-IN */

      document.querySelector("#respond")
        ?.addEventListener(
          "click",
          async()=>{

            const signedIn=
              await requireAuth();

            if(signedIn)
              eventPage(id);
          }
        );


      /* SHARE */

      document.querySelector("#share")
        ?.addEventListener(
          "click",
          event=>
            shareEvent(
              id,
              event.currentTarget
            )
        );


      /* COPY */

      document.querySelector("#copy")
        ?.addEventListener(
          "click",
          async()=>{

            const button=
              document.querySelector(
                "#copy"
              );

            try{

              await navigator.clipboard.writeText(
                eventUrl(id)
              );

              button.textContent="Copied!";

              setTimeout(()=>{

                if(button.isConnected)
                  button.textContent=
                    "Copy link";

              },1200);

            }catch{

              prompt(
                "Copy this event link:",
                eventUrl(id)
              );
            }
          }
        );


      /* RESPONSE */

      if(!userUid)
        return;


      let choice=
        myResponse?.status||"";


      const yes=
        document.querySelector("#yes");

      const no=
        document.querySelector("#no");

      const responseNote=
        document.querySelector(
          "#responseNote"
        );

      const message=
        document.querySelector(
          "#message"
        );


      const updateChoice=()=>{

        yes?.classList.toggle(
          "selected",
          choice==="yes"
        );

        no?.classList.toggle(
          "selected",
          choice==="no"
        );


        if(yes)
          yes.textContent=
            choice==="yes"
            ? "✓ COMING"
            : "COMING";


        if(no)
          no.textContent=
            choice==="no"
            ? "✓ NOT COMING"
            : "NOT COMING";
      };


      yes?.addEventListener(
        "click",
        ()=>{
          choice="yes";
          updateChoice();
        }
      );


      no?.addEventListener(
        "click",
        ()=>{
          choice="no";
          updateChoice();
        }
      );


      document.querySelector(
        "#saveResponse"
      )?.addEventListener(
        "click",
        async()=>{

          if(
            choice!=="yes" &&
            choice!=="no"
          ){

            message.textContent=
              "Choose COMING or NOT COMING.";

            return;
          }


          const currentUser=
            auth.currentUser;


          if(!currentUser)
            return;


          const note=
            responseNote.value.trim();


          try{

            await set(

              ref(
                db,
                "events/"
                +id+
                "/responses/"
                +currentUser.uid
              ),

              {

                name:
                  currentUser.displayName||
                  "Unknown",

                photo:
                  currentUser.photoURL||
                  "",

                status:
                  choice,

                note,

                updatedAt:
                  Date.now()

              }
            );


            message.textContent=
              choice==="yes"
              ? "You're coming."
              : "You're not coming.";

          }catch(errorObject){

            console.error(
              errorObject
            );

            message.textContent=
              "Couldn't save your response.";
          }
        }
      );
    }
  );
}


/* ==================================================
   PROFILE
================================================== */

function profilePage(){

  const user=auth.currentUser;

  if(!user)
    return;


  app.innerHTML=`

    ${header()}

    <div class="box center">

      ${
        user.photoURL
        ? `
          <img
            class="profile-photo"
            src="${esc(
              user.photoURL
            )}"
            alt=""
          >
        `
        : ""
      }


      <h2>
        ${esc(
          user.displayName||
          "Google account"
        )}
      </h2>


      <p class="muted">
        ${esc(
          user.email||
          ""
        )}
      </p>


      <button id="signout">
        Sign out
      </button>

    </div>
  `;


  wireHeader();


  document.querySelector("#signout")
    .onclick=async()=>{

      await signOut(auth);

      location.hash="";

      route();
    };
}


/* ==================================================
   ROUTER
================================================== */

function route(){

  stopListener();


  const match=
    location.hash.match(
      /^#e=([^]+)$/
    );


  if(match){

    eventPage(match[1]);

    return;
  }


  homePage();
}


/* ==================================================
   START
================================================== */

onAuthStateChanged(
  auth,
  ()=>{
    route();
  }
);


addEventListener(
  "hashchange",
  route
);

</script>

</body>
</html>
