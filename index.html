/* =====================================================
   AUTH
===================================================== */

async function requireAuth(){
  if(auth.currentUser) return true;

  if(signingIn) return false;

  signingIn = true;

  try{
    await signInWithPopup(auth,googleProvider);
    return true;
  }catch(error){
    console.error("Firebase Auth Error:",error);

    if([
      "auth/popup-closed-by-user",
      "auth/cancelled-popup-request",
      "auth/popup-blocked"
    ].includes(error.code)){
      return false;
    }

    alert(
      "Google sign-in failed.\n\n" +
      error.code +
      "\n\n" +
      error.message
    );

    return false;
  }finally{
    signingIn = false;
  }
}

/* =====================================================
   SHARING
===================================================== */

function generateShareText(event,id){

  const dateData = parseEventDate(event.when);

  const formattedDateTime =
    dateData
      ? `${dateData.fullDate} · ${dateData.time}`
      : "";

  const link = eventURL(id,event);

  return `${event.title}
${formattedDateTime}

*വരുന്നുണ്ടോ???*

${event.location ? `📍 ${event.location}\n\n` : ""}${link}`;
}

async function shareEvent(id){

  const snapshot =
    await get(ref(db,"events/" + id));

  const event = snapshot.val();

  if(!event) return;

  const shareText =
    generateShareText(event,id);

  if(navigator.share){

    try{
      await navigator.share({
        text:shareText
      });

      return;

    }catch(error){

      if(error?.name === "AbortError"){
        return;
      }
    }
  }

  copyEventMessage(id);
}

async function copyEventMessage(id,button){

  const snapshot =
    await get(ref(db,"events/" + id));

  const event = snapshot.val();

  if(!event) return;

  const shareText =
    generateShareText(event,id);

  try{

    await navigator.clipboard.writeText(
      shareText
    );

    if(button){

      const original =
        button.innerHTML;

      button.innerHTML =
        `${SVGS.copy} Copied!`;

      setTimeout(() => {

        if(button.isConnected){
          button.innerHTML =
            original;
        }

      },1500);

    }else{

      alert("Message copied to clipboard!");

    }

  }catch{

    prompt(
      "Copy this event message:",
      shareText
    );

  }
}

async function renderGoogleMap(event){

  if(!event.location){
    return;
  }

  const mapElement =
    document.querySelector("#googleMap");

  if(!mapElement){
    return;
  }

  const lat =
    Number(event.latitude);

  const lng =
    Number(event.longitude);

  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ){
    mapElement.innerHTML = `
      <div class="location-placeholder">
        <div>
          <div style="font-weight:700;color:var(--text-main);">
            ${SVGS.location}
          </div>

          <div style="margin-top:.4rem;">
            Map preview needs an exact map pin.
          </div>

          <a
            class="maps-link"
            href="${googleMapsSearchURL(event.location)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open in Google Maps →
          </a>
        </div>
      </div>
    `;

    return;
  }

  try{

    await loadGoogleMaps();

    const map =
      new google.maps.Map(mapElement,{
        center:{
          lat,
          lng
        },
        zoom:16,
        mapTypeControl:false,
        streetViewControl:false,
        fullscreenControl:true,
        gestureHandling:"cooperative"
      });

    new google.maps.Marker({
      map,
      position:{
        lat,
        lng
      },
      title:event.location
    });

  }catch(error){

    console.error(
      "GOOGLE MAP ERROR:",
      error
    );

    mapElement.innerHTML = `
      <div class="location-placeholder">
        <div>
          <div style="font-weight:700;color:var(--text-main);">
            Map unavailable
          </div>

          <a
            class="maps-link"
            href="${googleMapsSearchURL(event.location)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open in Google Maps →
          </a>
        </div>
      </div>
    `;
  }
}


/* =====================================================
   EVENTS FEED
===================================================== */

async function loadFeedEvents(){

  const publicSnapshot =
    await get(ref(db,"publicEvents"));

  const publicIndex =
    publicSnapshot.val() || {};

  const ids = new Set(
    Object.keys(publicIndex)
  );

  if(auth.currentUser){

    const mineSnapshot =
      await get(
        ref(
          db,
          "userEvents/" +
          auth.currentUser.uid
        )
      );

    const mine =
      mineSnapshot.val() || {};

    Object.keys(mine)
      .forEach(id => ids.add(id));
  }

  const entries =
    await Promise.all(
      [...ids].map(async id => {

        try{

          const snapshot =
            await get(
              ref(db,"events/" + id)
            );

          if(!snapshot.exists()){
            return null;
          }

          return [
            id,
            snapshot.val()
          ];

        }catch(error){

          console.warn(
            "Could not load event",
            id,
            error
          );

          return null;
        }
      })
    );

  return entries.filter(Boolean);
}

    renderEventsList();
  };

  let cachedUpcoming = [];
  let cachedPast = [];

  function renderEventsList(){

    const container =
      document.querySelector("#eventsContainer");

    if(!container) return;

    const list =
      currentTab === "upcoming"
        ? cachedUpcoming
        : cachedPast;

    if(!list.length){

      container.innerHTML = `
        <div style="
          text-align:center;
          padding:2rem 0;
          color:var(--text-muted);
          font-size:.875rem;
        ">
          No ${currentTab} events found.
        </div>
      `;

      return;
    }

    container.innerHTML = `
      <div class="event-list">

        ${list.map(([id,event]) => {

          const dateData =
            parseEventDate(event.when);

          const coming =
            Object.values(
              event.responses || {}
            )
            .filter(
              r => r.status === "yes"
            )
            .length;

          return `
            <div
              class="event-card"
              data-id="${escapeHTML(id)}"
            >

              <div class="date-badge">

                <div class="date-badge-month">
                  ${dateData ? dateData.month : "---"}
                </div>

                <div class="date-badge-day">
                  ${dateData ? dateData.day : "--"}
                </div>

              </div>

              <div class="event-info">

                <div class="event-name">
                  ${escapeHTML(event.title)}
                </div>

                <div class="event-meta">
                  ${dateData ? dateData.time : ""}
                  ${event.location ? " · 📍 " + escapeHTML(event.location) : ""}
                </div>

                ${
                  event.visibility === "private"
                    ? `
                      <div class="visibility-pill">
                        🔒 Private
                      </div>
                    `
                    : ""
                }

              </div>

              <div class="count-pill">
                ${coming} coming
              </div>

            </div>
          `;

        }).join("")}

      </div>
    `;

    container
      .querySelectorAll(".event-card")
      .forEach(card => {

        card.onclick = () => {

          location.hash =
            "e=" + card.dataset.id;

        };

      });
  }

  loadFeedEvents()
    .then(events => {

      const now = Date.now();

      cachedUpcoming = [];
      cachedPast = [];

      events.forEach(([id,event]) => {

        const eventTime =
          new Date(event.when).getTime();

        if(
          Number.isFinite(eventTime) &&
          eventTime < now
        ){

          cachedPast.push([
            id,
            event
          ]);

        }else{

          cachedUpcoming.push([
            id,
            event
          ]);

        }

      });

      cachedUpcoming.sort(
        (a,b) =>
          new Date(a[1].when).getTime() -
          new Date(b[1].when).getTime()
      );

      cachedPast.sort(
        (a,b) =>
          new Date(b[1].when).getTime() -
          new Date(a[1].when).getTime()
      );

      renderEventsList();

    })
    .catch(error => {

      console.error(
        "EVENTS LOAD ERROR:",
        error
      );

      const container =
        document.querySelector("#eventsContainer");

      if(container){

        container.innerHTML = `
          <p class="error">
            Couldn't load events.
            ${escapeHTML(error.message || "")}
          </p>
        `;
      }

    });
}

function wireVisibilityControl(initialValue){

  let selectedVisibility =
    initialValue || "public";

  const buttons =
    document.querySelectorAll(
      ".visibility-option"
    );

  const hint =
    document.querySelector("#visibilityHint");

  buttons.forEach(button => {

    button.onclick = () => {

      selectedVisibility =
        button.dataset.visibility;

      buttons.forEach(item => {
        item.classList.toggle(
          "active",
          item.dataset.visibility ===
          selectedVisibility
        );
      });

      hint.textContent =
        selectedVisibility === "private"
          ? "Only people with the shared event link can access it."
          : "Anyone can find this event on the Events page.";
    };

  });

  return () => selectedVisibility;
}

    const when =

        .value;

    const location =

        .value.trim();

        .value.trim();

    const longitudeRaw =

        .value.trim();

    const note =

        .value.trim();

    const visibility =
      getVisibility();

    if(!title){

        "Give the event a title.";

      return;
    }

    if(!when){

      error.textContent =
        "Choose a date and time.";

      return;
    }

    const whenMs =
      new Date(when).getTime();

    if(
      !Number.isFinite(whenMs) ||
      whenMs <= Date.now()
    ){

      error.textContent =
        "Choose a future date and time.";

    let longitude = null;

      auth.currentUser;

      error.textContent =

      return;
    }

    const id =
      newEventId();

    const inviteToken =
      visibility === "private"
        ? newInviteToken()
        : null;

    const event = {

      title,
      when,
      note,

      location:location || null,

      latitude,
      longitude,

      visibility,

      inviteToken,

      creatorUid:user.uid,
      creatorName:user.displayName || "Unknown",
      creatorPhoto:user.photoURL || "",

      createdAt:Date.now()
    };

    try{

      const updates = {};

      updates[
        "events/" + id
      ] = event;

      if(visibility === "public"){

        updates[
          "publicEvents/" + id
        ] = true;

      }else{

        updates[
          "userEvents/" +
          user.uid +
          "/" +
          id
        ] = true;

        updates[
          "eventMembers/" +
          id +
          "/" +
          user.uid
        ] = inviteToken;

      }

      await update(
        ref(db),
        updates
      );

      if(
        visibility === "private" &&
        inviteToken
      ){

        await set(
          ref(
            db,
            "privateInvites/" +
            inviteToken
          ),
          {
            eventId:id
          }
        );
      }

      location.hash =
        "e=" + id;

    }catch(errorObject){

      console.error(
        "CREATE EVENT ERROR:",
        errorObject
      );

      error.textContent =
        "Couldn't create event.\n\n" +
        errorObject.code +
        "\n" +
        errorObject.message;
    }
  };
}

      </div>

      <div class="location-fields" style="margin-top:.5rem;">

        <input
          class="input-field"
          id="eventLatitude"
          type="number"
          step="any"
          value="${event.latitude ?? ""}"
          placeholder="Latitude (optional)"
          style="padding-left:.85rem;"
        >

        <input
          class="input-field"
          id="eventLongitude"
          type="number"
          step="any"
          value="${event.longitude ?? ""}"
          placeholder="Longitude (optional)"
          style="padding-left:.85rem;"
        >

      </div>

    </div>

    <div class="input-group">

      <label class="input-label">
        Note (optional)
      </label>

      <textarea
        class="input-field"
        id="eventNote"
        maxlength="1000"
      >${escapeHTML(event.note || "")}</textarea>

    </div>

    ${visibilityControl(currentVisibility)}

    <p id="eventError" class="error"></p>

    <div style="
      display:flex;
      flex-direction:column;
      gap:.5rem;
      margin-top:1rem;
    ">

      <button
        class="btn-primary"
        id="saveEvent"
      >
        Save changes
      </button>

      <button
        class="btn-secondary"
        id="cancel"
      >
        Cancel
      </button>

    </div>

    <div
      class="hero-illustration"
      style="margin-top:1rem;"
    >
      ${SVGS.landscape}
    </div>
  `;

  wireHeader();

  const getVisibility =
    wireVisibilityControl(
      currentVisibility
    );

  document.querySelector(
    "#cancel"
  ).onclick = () =>
    eventPage(id);

  document.querySelector(
    "#saveEvent"
  ).onclick = async () => {

    const error =
      document.querySelector("#eventError");

    const title =
      document.querySelector("#title")
        .value.trim();

    const when =
      document.querySelector("#when")
        .value;

    const locationValue =
      document.querySelector("#eventLocation")
        .value.trim();

    const latitudeRaw =
      document.querySelector("#eventLatitude")
        .value.trim();

    const longitudeRaw =
      document.querySelector("#eventLongitude")
        .value.trim();

    const note =
      document.querySelector("#eventNote")
        .value.trim();

    const visibility =
      getVisibility();

    if(!title){

      error.textContent =
        "Give the event a title.";

      return;
    }

    if(!when){

      error.textContent =
        "Choose a date and time.";

      return;
    }

    const whenMs =
      new Date(when).getTime();

    if(
      !Number.isFinite(whenMs) ||
      whenMs <= Date.now()
    ){

      error.textContent =
        "Choose a future date and time.";

      return;
    }

    let latitude = null;
    let longitude = null;

    if(latitudeRaw || longitudeRaw){

      latitude = Number(latitudeRaw);
      longitude = Number(longitudeRaw);

      if(
        !Number.isFinite(latitude) ||
        !Number.isFinite(longitude) ||
        latitude < -90 ||
        latitude > 90 ||
        longitude < -180 ||
        longitude > 180
      ){

        error.textContent =
          "Latitude/longitude is invalid.";

        return;
      }
    }

    try{

      const oldVisibility =
        event.visibility || "public";

      let inviteToken =
        event.inviteToken || null;

      if(
        visibility === "private" &&
        !inviteToken
      ){

        inviteToken =
          newInviteToken();
      }

      const updates = {};

      updates[
        "events/" + id + "/title"
      ] = title;

      updates[
        "events/" + id + "/when"
      ] = when;

      updates[
        "events/" + id + "/note"
      ] = note;

      updates[
        "events/" + id + "/location"
      ] = locationValue || null;

      updates[
        "events/" + id + "/latitude"
      ] = latitude;

      updates[
        "events/" + id + "/longitude"
      ] = longitude;

      updates[
        "events/" + id + "/visibility"
      ] = visibility;

      updates[
        "events/" + id + "/inviteToken"
      ] = inviteToken;

      if(oldVisibility === "public"){

        updates[
          "publicEvents/" + id
        ] = null;

      }

      if(visibility === "public"){

        updates[
          "publicEvents/" + id
        ] = true;

      }else{

        updates[
          "userEvents/" +
          user.uid +
          "/" +
          id
        ] = true;

        updates[
          "eventMembers/" +
          id +
          "/" +
          user.uid
        ] = inviteToken;

      }

      await update(
        ref(db),
        updates
      );

      if(
        visibility === "private" &&
        inviteToken
      ){

        await set(
          ref(
            db,
            "privateInvites/" +
            inviteToken
          ),
          {
            eventId:id
          }
        );

      }

      eventPage(id);

    }catch(errorObject){

      console.error(
        "EDIT EVENT ERROR:",
        errorObject
      );

      error.textContent =
        "Couldn't save changes.\n\n" +
        errorObject.code +
        "\n" +
        errorObject.message;
    }
  };
}


/* =====================================================
   DELETE
===================================================== */

async function deleteEvent(id){

  const user =
    auth.currentUser;

  if(!user) return;

  const snapshot =
    await get(
      ref(db,"events/" + id)
    );

  if(!snapshot.exists()){

    alert("Event not found.");

    return;
  }

  const event =
    snapshot.val();

  if(event.creatorUid !== user.uid){

    alert(
      "Only the creator can delete this event."
    );

    return;
  }

  if(!confirm(
    "Delete this event?\n\nThis cannot be undone."
  )) return;

  try{

    const updates = {};

    updates[
      "events/" + id
    ] = null;

    updates[
      "publicEvents/" + id
    ] = null;

    updates[
      "userEvents/" +
      user.uid +
      "/" +
      id
    ] = null;

    updates[
      "eventMembers/" +
      id
    ] = null;

    if(event.inviteToken){

      updates[
        "privateInvites/" +
        event.inviteToken
      ] = null;

    }

    if(event.responses){

      Object.keys(
        event.responses
      ).forEach(uid => {

        updates[
          "userEvents/" +
          uid +
          "/" +
          id
        ] = null;

      });
    }

    await update(
      ref(db),
      updates
    );

    goToEventsPage();

  }catch(errorObject){

    console.error(
      "DELETE EVENT ERROR:",
      errorObject
    );

    alert(
      "Couldn't delete the event.\n\n" +
      errorObject.code +
      "\n" +
      errorObject.message
    );
  }
}

              document.querySelector(

              const response = {

                status:selectedStatus,
                note,

                name:
                  user.displayName ||
                  "Unknown",

                photo:
                  user.photoURL ||
                  "",

                updatedAt:
                  Date.now()
              };

              const updates = {};

              updates[
                "events/" +
                id +
                "/responses/" +
                userUid
              ] = response;

              /*
                This is the important part:

                The feed index is written regardless
                of whether the response is YES or NO.
              */
              updates[
                "userEvents/" +
                userUid +
                "/" +
                id
              ] = true;

              await update(
                ref(db),
                updates
              );

              msg.textContent =
                "Response saved!";

              setTimeout(() => {

                if(msg){
                  msg.textContent = "";
                }

              },2000);

            }catch(err){

              console.error(
                "RESPONSE ERROR:",
                err
              );

              alert(
                "Couldn't save response: " +
                err.message
              );
            }
          };
        }

      },

      error => {

        console.error(
          "EVENT LOAD ERROR:",
          error
        );

        const shell =
          document.querySelector(
            "#eventShell"
          );

        if(!shell) return;

        if(
          error.code ===

          `;

          return;
        }

        shell.innerHTML = `
          <p class="error">
            Couldn't load this event.
            ${escapeHTML(error.message || "")}
          </p>
        `;
      }
    );
}

  await acceptPrivateInvite(

async function acceptPrivateInvite(
  token,
  eventId
){

  const user =
    auth.currentUser;

  if(!user) return;

  try{

    /*
      Membership grants access to the event.

      It does NOT put the event in the user's feed yet.

      The feed entry is created only when the user
      actually saves COMING or NOT COMING.
    */

    const updates = {};

    updates[
      "eventMembers/" +
      eventId +
      "/" +
      user.uid
    ] = token;

    await update(
      ref(db),
      updates
    );

    location.hash =
      "e=" + eventId;

  }catch(error){

    console.error(
      "INVITE ACCEPT ERROR:",
      error
    );

    const message =
      document.querySelector(
        "#inviteMessage"
      );

    if(message){

      message.textContent =
        "Couldn't open this invitation. " +
        error.message;
    }
  }
}

/* =====================================================
   ROUTER
===================================================== */

function route(){

  const hash =
    location.hash;

  if(hash === "#create"){

    createPage();

  }else if(hash === "#profile"){

    profilePage();

  }else if(hash.startsWith("#invite=")){

    const token =
      hash.slice("#invite=".length);

    if(token){

      privateInvitePage(
        decodeURIComponent(token)
      );

    }

  }else if(hash.startsWith("#e=")){

    const id =
      hash.slice(3);

    if(id){

      eventPage(id);

      return;
    }

  }else{

    currentTab = "upcoming";

    eventsPage();
  }
}

window.addEventListener(
  "hashchange",
  route
);

onAuthStateChanged(
  auth,
  () => route()
);
</script>
