/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[character]));

}


function newEventId(){

  return crypto.randomUUID()
    .replaceAll("-","")
    .slice(0,12);

}


function eventURL(id){

  return (
    location.origin +
    location.pathname +
    "#e=" +
    id
  );

}


function formatDate(value){

  if(!value)
    return "Date unavailable";

  const date = new Date(value);

  if(Number.isNaN(date.getTime()))
    return "Date unavailable";

  return date.toLocaleString([],{
    day:"numeric",
    month:"long",
    year:"numeric",
    hour:"numeric",
    minute:"2-digit"
  });

}


function stopListener(){

  if(activeListener){

    activeListener();
    activeListener = null;

  }

}


/* =====================================================
   AUTH
===================================================== */

async function requireAuth(){

  if(auth.currentUser)
    return true;

  if(signingIn)
    return false;

  signingIn = true;

  try{

    await signInWithPopup(
      auth,
      googleProvider
    );

    return true;

  }catch(error){

    console.error(
      "Firebase Auth Error:",
      error
    );

    if(
      error.code === "auth/popup-closed-by-user" ||
      error.code === "auth/cancelled-popup-request" ||
      error.code === "auth/popup-blocked"
    ){
      return false;
    }

    alert(
      "Google sign-in failed.\n\n" +
      error.code +
      "\n\n" +
      error.message
    );

    return false;

  }finally{

    signingIn = false;

  }

}

        "

                  width:36px;

function wireHeader(){

      "click",

    .querySelector("#homeTitle")

        );

        eventsPage();

      }
    );

  document
    .querySelector("#accountButton")
    ?.addEventListener(

      async()=>{

        if(!auth.currentUser){

          const signedIn =
            await requireAuth();

          if(signedIn)
            route();

          return;
        }

        profilePage();

}


/* =====================================================
   SHARE
===================================================== */

async function shareEvent(id,button){

  const url = eventURL(id);

  const snapshot =
    await get(ref(db,"events/"+id));

  const event =
    snapshot.val();

  if(!event)
    return;

  const date =
    new Date(event.when);

  const dateText =
    date.toLocaleDateString(
      "en-IN",
      {
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

  const timeText =
    date.toLocaleTimeString(
      "en-IN",
      {
        hour:"numeric",
        minute:"2-digit",
        hour12:true
      }
    );

  const message =
`${event.title}
${dateText} · ${timeText}

# വരുന്നുണ്ടോ???`;

  if(navigator.share){

    try{

      await navigator.share({
        title:"വരുന്നുണ്ടോ???",
        text:message,
        url
      });

      return;

    }catch(error){

      if(error?.name === "AbortError")
        return;

    }

  }

  try{

    await navigator.clipboard.writeText(
      message + "\n\n" + url
    );

    if(button){

      const original =
        button.textContent;

      button.textContent = "Copied!";

      setTimeout(()=>{

        if(button.isConnected)
          button.textContent = original;

      },1200);

    }

  }catch{

    prompt(
      "Copy this event message:",
      message + "\n\n" + url
    );

  }

}


/* =====================================================
   EVENTS
===================================================== */

function eventsPage(){

  stopListener();

  app.innerHTML = `

    ${renderHeader()}

    <div class="box">

      <h2>Events</h2>

      <div id="upcomingEvents">
        Loading...
      </div>

      <details style="margin-top:24px;">

        <summary
          style="
            cursor:pointer;
            font-weight:bold;
          "
        >
          Past events
        </summary>

        <div
          id="pastEvents"
          style="margin-top:16px;"
        ></div>

      </details>

    </div>

  `;

  wireHeader();


  const upcomingEvents =
    document.querySelector(
      "#upcomingEvents"
    );

  const pastEvents =
    document.querySelector(
      "#pastEvents"
    );


  activeListener = onValue(

    ref(db,"events"),

    snapshot=>{

      const events =
        snapshot.val() || {};

      const now =
        Date.now();

      const upcoming = [];
      const past = [];


      Object.entries(events)
        .forEach(([id,event])=>{

          const eventTime =
            new Date(
              event.when
            ).getTime();

          if(
            Number.isFinite(eventTime) &&
            eventTime < now
          ){

            past.push([id,event]);

          }else{

            upcoming.push([id,event]);

          }

        });


      upcoming.sort(
        (a,b)=>
          new Date(a[1].when).getTime() -
          new Date(b[1].when).getTime()
      );


      past.sort(
        (a,b)=>
          new Date(b[1].when).getTime() -
          new Date(a[1].when).getTime()
      );


      function renderEvents(entries){

        if(!entries.length){

          return `
            <p class="muted">
              No events.
            </p>
          `;

        }


        return entries
          .map(([id,event])=>`

            <div
              class="event"
              data-id="${escapeHTML(id)}"
              style="
                cursor:pointer;
                padding:14px 0;
                border-bottom:1px solid #ddd;
              "
            >

              <div style="font-size:19px;">
                <strong>${escapeHTML(event.title)}</strong>
                <span
                  class="muted"
                  style="
                    font-size:14px;
                    font-weight:400;
                    margin-left:4px;
                  "
                >
                  (${Object.values(event.responses || {})
                    .filter(response => response.status === "yes")
                    .length}
                  coming)
                </span>
              </div>

              <div class="muted">
                ${formatDate(event.when)}
              </div>

              ${
                event.note
                  ? `
                    <div
                      class="muted"
                      style="margin-top:4px;"
                    >
                      ${escapeHTML(event.note)}
                    </div>
                  `
                  : ""
              }

            </div>

          `)
          .join("");

      }


      upcomingEvents.innerHTML =
        renderEvents(upcoming);

      pastEvents.innerHTML =
        renderEvents(past);


      document
        .querySelectorAll(
          "#upcomingEvents .event, " +
          "#pastEvents .event"
        )
        .forEach(card=>{

          card.onclick = ()=>{

            location.hash =
              "e=" +
              card.dataset.id;

          };

        });

    },

    error=>{

      console.error(
        "EVENTS LOAD ERROR:",
        error
      );

      upcomingEvents.innerHTML = `
        <p class="error">
          Couldn't load events.

          ${escapeHTML(
            error.message || ""
          )}
        </p>
      `;

    }

  );

}


/* =====================================================

===================================================== */

function createPage(){

  stopListener();


  if(!auth.currentUser){

      .onclick = async()=>{

        const signedIn =
          await requireAuth();

        if(signedIn)
          createPage();

      };

    return;

  }


  app.innerHTML = `

    ${renderHeader()}

    <div class="box">

      <h2>
        Create an event
      </h2>

      <label>

        Event title

        <input
          id="title"
          maxlength="100"
          placeholder="Evening walk"
        >

      </label>

      <label>

        Date and time

        <input
          id="when"
          type="datetime-local"
        >

      </label>

      <label>

        Note

        <textarea
          id="eventNote"
          maxlength="1000"
          placeholder="Anything people should know?"
        ></textarea>

      </label>

      <p
        id="eventError"
        class="error"
      ></p>

      <button id="saveEvent">
        Create →
      </button>

    </div>

  `;

  wireHeader();


  document
    .querySelector("#saveEvent")
    .onclick = async()=>{

      const error =
        document.querySelector(
          "#eventError"
        );

      const title =
        document
          .querySelector("#title")
          .value
          .trim();

      const when =
        document
          .querySelector("#when")
          .value;

      const note =
        document
          .querySelector("#eventNote")
          .value
          .trim();


      if(!title){

        error.textContent =
          "Give the event a title.";

        return;

      }


      if(!when){

        error.textContent =
          "Choose a date and time.";

        return;

      }


      const whenMs =
        new Date(when).getTime();

      if(
        !Number.isFinite(whenMs) ||
        whenMs <= Date.now()
      ){

        error.textContent =
          "Choose a future date and time.";

        return;

      }


      const user =
        auth.currentUser;

      if(!user){

        error.textContent =
          "Please sign in first.";

        return;

      }


      const id =
        newEventId();


      const event = {

        title,

        when,

        note,

        creatorUid:
          user.uid,

        creatorName:
          user.displayName ||
          "Unknown",

        creatorPhoto:
          user.photoURL ||
          "",

        createdAt:
          Date.now()

      };


      try{

        await set(
          ref(
            db,
            "events/" + id
          ),
          event
        );

        location.hash =
          "e=" + id;

      }catch(errorObject){

        console.error(
          "CREATE EVENT ERROR:",
          errorObject
        );

        error.textContent =
          "Couldn't create event.\n\n" +
          errorObject.code +
          "\n" +
          errorObject.message;

      }

    };

}


/* =====================================================
   EDIT
===================================================== */

async function editEvent(id){

  const user =
    auth.currentUser;

  if(!user)
    return;


  const snapshot =
    await get(
      ref(
        db,
        "events/" + id
      )
    );


  if(!snapshot.exists()){

    alert("Event not found.");
    return;

  }


  const event =
    snapshot.val();


  if(event.creatorUid !== user.uid){

    alert(
      "Only the creator can edit this event."
    );

    return;

  }


  app.innerHTML = `

    ${renderHeader()}

    <div class="box">

      <h2>
        Edit event
      </h2>

      <label>

        Event title

        <input
          id="title"
          maxlength="100"
          value="${escapeHTML(event.title)}"
        >

      </label>

      <label>

        Date and time

        <input
          id="when"
          type="datetime-local"
          value="${escapeHTML(event.when)}"
        >

      </label>

      <label>

        Note

        <textarea
          id="eventNote"
          maxlength="1000"
        >${escapeHTML(event.note || "")}</textarea>

      </label>

      <p
        id="eventError"
        class="error"
      ></p>

      <div class="actions">

        <button id="saveEvent">
          Save changes
        </button>

        <button id="cancel">
          Cancel
        </button>

      </div>

    </div>

  `;

  wireHeader();


  document
    .querySelector("#cancel")
    .onclick = () =>
      eventPage(id);


  document
    .querySelector("#saveEvent")
    .onclick = async()=>{

      const error =
        document.querySelector(
          "#eventError"
        );

      const title =
        document
          .querySelector("#title")
          .value
          .trim();

      const when =
        document
          .querySelector("#when")
          .value;

      const note =
        document
          .querySelector("#eventNote")
          .value
          .trim();


      if(!title){

        error.textContent =
          "Give the event a title.";

        return;

      }


      if(!when){

        error.textContent =
          "Choose a date and time.";

        return;

      }


      const whenMs =
        new Date(when).getTime();

      if(
        !Number.isFinite(whenMs) ||
        whenMs <= Date.now()
      ){

        error.textContent =
          "Choose a future date and time.";

        return;

      }


      try{

        await set(
          ref(
            db,
            "events/" +
            id +
            "/title"
          ),
          title
        );

        await set(
          ref(
            db,
            "events/" +
            id +
            "/when"
          ),
          when
        );

        await set(
          ref(
            db,
            "events/" +
            id +
            "/note"
          ),
          note
        );

        eventPage(id);

      }catch(errorObject){

        console.error(
          "EDIT EVENT ERROR:",
          errorObject
        );

        error.textContent =
          "Couldn't save changes.\n\n" +
          errorObject.code +
          "\n" +
          errorObject.message;

      }

    };

}


/* =====================================================
   DELETE
===================================================== */

async function deleteEvent(id){

  const user =
    auth.currentUser;

  if(!user)
    return;


  const snapshot =
    await get(
      ref(
        db,
        "events/" + id
      )
    );


  if(!snapshot.exists()){

    alert("Event not found.");
    return;

  }


  const event =
    snapshot.val();


  if(event.creatorUid !== user.uid){

    alert(
      "Only the creator can delete this event."
    );

    return;

  }


  if(
    !confirm(
      "Delete this event?\n\n" +
      "This cannot be undone."
    )
  )
    return;


  try{

    await set(
      ref(
        db,
        "events/" + id
      ),
      null
    );

    location.hash = "";
    route();

  }catch(errorObject){

    console.error(
      "DELETE EVENT ERROR:",
      errorObject
    );

    alert(
      "Couldn't delete the event.\n\n" +
      errorObject.code +
      "\n" +
      errorObject.message
    );

  }

}

function eventPage(id){

  stopListener();

  app.innerHTML = `

    ${renderHeader()}

    <div id="eventShell"></div>

  `;

  wireHeader();


  activeListener =
    onValue(
      ref(
        db,
        "events/" + id
      ),

      snapshot=>{

        const shell =
          document.querySelector(
            "#eventShell"
          );

        if(!shell)
          return;


        if(!snapshot.exists()){

          shell.innerHTML = `

            <div class="box">

              <h2>
                Event not found.
              </h2>

              <p class="muted">
                This event doesn't exist
                or has been deleted.
              </p>

            </div>

          `;

          return;

        }


        const event =
          snapshot.val();

        const user =
          auth.currentUser;

        const userUid =
          user?.uid || null;

        const isCreator =
          userUid === event.creatorUid;


        const responses =
          Object.entries(
            event.responses || {}
          );


        const coming =
          responses.filter(
            ([,response]) =>
              response.status === "yes"
          );


        const notComing =
          responses.filter(
            ([,response]) =>
              response.status === "no"
          );


        const myResponse =
          userUid
            ? event.responses?.[userUid]
            : null;


        shell.innerHTML = `

          <div class="box">

            <h2>
              ${escapeHTML(event.title)}
            </h2>

            <p>
              ${formatDate(event.when)}
            </p>

            ${
              event.note
                ? `
                  <div
                    style="
                      background:#f1eee7;
                      border-radius:12px;
                      padding:14px;
                      margin:16px 0;
                    "
                  >

                    <strong>
                      Note
                    </strong>

                    <p
                      style="white-space:pre-wrap"
                    >
                      ${escapeHTML(event.note)}
                    </p>

                  </div>
                `
                : ""
            }


            <div class="person-info">

              ${
                event.creatorPhoto
                  ? `
                    <img
                      class="person-photo"
                      src="${escapeHTML(event.creatorPhoto)}"
                      alt=""
                    >
                  `
                  : ""
              }

              <span class="muted small">

                Created by
                ${escapeHTML(
                  event.creatorName ||
                  "Unknown"
                )}

              </span>

            </div>


            ${
              isCreator
                ? `
                  <div
                    class="actions"
                    style="margin-top:16px"
                  >

                    <button id="editButton">
                      Edit
                    </button>

                    <button
                      id="deleteButton"
                      class="danger"
                    >
                      Delete
                    </button>

                  </div>
                `
                : ""
            }

          </div>


          ${
            !userUid
              ? `

                <div class="box">

                  <h3>
                    Are you coming?
                  </h3>

                  <p>
                    Sign in with Google
                    to respond.
                  </p>

                  <button id="respondButton">
                    Continue with Google
                  </button>

                </div>

              `
              : `

                <div class="box">

                  <h3>
                    Are you coming?
                  </h3>


                  <div class="choice">

                    <button
                      id="yesButton"
                      class="yes ${
                        myResponse?.status === "yes"
                          ? "selected"
                          : ""
                      }"
                    >
                      ${
                        myResponse?.status === "yes"
                          ? "✓ "
                          : ""
                      }COMING
                    </button>


                    <button
                      id="noButton"
                      class="no ${
                        myResponse?.status === "no"
                          ? "selected"
                          : ""
                      }"
                    >
                      ${
                        myResponse?.status === "no"
                          ? "✓ "
                          : ""
                      }NOT COMING
                    </button>

                  </div>


                  <label>

                    Your note

                    <textarea
                      id="responseNote"
                      maxlength="500"
                      placeholder="Anything you want people to know?"
                    >${escapeHTML(
                      myResponse?.note || ""
                    )}</textarea>

                  </label>


                  <button id="saveResponse">
                    Save response
                  </button>


                  <p
                    id="responseMessage"
                    class="success"
                  ></p>

                </div>

              `
          }


          <div class="box">

            <h3>
              Coming · ${coming.length}
            </h3>

            ${
              coming.length
                ? coming.map(
                    ([,response])=>`

                      <div class="person">

                        <div class="person-head">

                          <div class="person-info">

                            ${
                              response.photo
                                ? `
                                  <img
                                    class="person-photo"
                                    src="${escapeHTML(response.photo)}"
                                    alt=""
                                  >
                                `
                                : ""
                            }

                            <strong>
                              ${escapeHTML(
                                response.name ||
                                "Unknown"
                              )}
                            </strong>

                          </div>

                          <b>✓</b>

                        </div>


                        ${
                          response.note
                            ? `
                              <div class="response-note">
                                ${escapeHTML(
                                  response.note
                                )}
                              </div>
                            `
                            : ""
                        }

                      </div>

                    `
                  ).join("")
                : `
                    <p class="muted">
                      Nobody yet.
                    </p>
                  `
            }

          </div>


          <div class="box">

            <h3>
              Not coming · ${notComing.length}
            </h3>

            ${
              notComing.length
                ? notComing.map(
                    ([,response])=>`

                      <div class="person">

                        <div class="person-head">

                          <div class="person-info">

                            ${
                              response.photo
                                ? `
                                  <img
                                    class="person-photo"
                                    src="${escapeHTML(response.photo)}"
                                    alt=""
                                  >
                                `
                                : ""
                            }

                            <strong>
                              ${escapeHTML(
                                response.name ||
                                "Unknown"
                              )}
                            </strong>

                          </div>

                          <b>×</b>

                        </div>


                        ${
                          response.note
                            ? `
                              <div class="response-note">
                                ${escapeHTML(
                                  response.note
                                )}
                              </div>
                            `
                            : ""
                        }

                      </div>

                    `
                  ).join("")
                : `
                    <p class="muted">
                      Nobody yet.
                    </p>
                  `
            }

          </div>


          <div class="box">

            <strong>
              Share this event
            </strong>

            <div class="link">
              ${escapeHTML(eventURL(id))}
            </div>

            <div class="actions">

              <button id="shareButton">
                Share
              </button>

              <button id="copyButton">
                Copy link
              </button>

            </div>

          </div>

        `;


        /* EDIT */

        document
          .querySelector("#editButton")
          ?.addEventListener(
            "click",
            ()=>editEvent(id)
          );


        /* DELETE */

        document
          .querySelector("#deleteButton")
          ?.addEventListener(
            "click",
            ()=>deleteEvent(id)
          );


        /* SIGN IN */

        document
          .querySelector("#respondButton")
          ?.addEventListener(
            "click",
            async()=>{

              const signedIn =
                await requireAuth();

              if(signedIn)
                eventPage(id);

            }
          );


        /* SHARE */

        document
          .querySelector("#shareButton")
          ?.addEventListener(
            "click",
            event =>
              shareEvent(
                id,
                event.currentTarget
              )
          );


        /* COPY */

        document
          .querySelector("#copyButton")
          ?.addEventListener(
            "click",
            async()=>{

              const button =
                document.querySelector(
                  "#copyButton"
                );

              try{

                await navigator.clipboard.writeText(
                  eventURL(id)
                );

                button.textContent =
                  "Copied!";

                setTimeout(()=>{

                  if(button.isConnected)
                    button.textContent =
                      "Copy link";

                },1200);

              }catch{

                prompt(
                  "Copy this event link:",
                  eventURL(id)
                );

              }

            }
          );


        /* RESPONSE */

        if(!userUid)
          return;


        let choice =
          myResponse?.status || "";


        const yesButton =
          document.querySelector(
            "#yesButton"
          );

        const noButton =
          document.querySelector(
            "#noButton"
          );

        const responseNote =
          document.querySelector(
            "#responseNote"
          );

        const message =
          document.querySelector(
            "#responseMessage"
          );


        function updateChoice(){

          yesButton?.classList.toggle(
            "selected",
            choice === "yes"
          );

          noButton?.classList.toggle(
            "selected",
            choice === "no"
          );


          if(yesButton){

            yesButton.textContent =
              choice === "yes"
                ? "✓ COMING"
                : "COMING";

          }


          if(noButton){

            noButton.textContent =
              choice === "no"
                ? "✓ NOT COMING"
                : "NOT COMING";

          }

        }


        yesButton?.addEventListener(
          "click",
          ()=>{
            choice = "yes";
            updateChoice();
          }
        );


        noButton?.addEventListener(
          "click",
          ()=>{
            choice = "no";
            updateChoice();
          }
        );


        document
          .querySelector("#saveResponse")
          ?.addEventListener(
            "click",
            async()=>{

              if(
                choice !== "yes" &&
                choice !== "no"
              ){

                message.textContent =
                  "Choose COMING or NOT COMING.";

                return;

              }


              const currentUser =
                auth.currentUser;

              if(!currentUser)
                return;


              const note =
                responseNote.value.trim();


              try{

                await set(

                  ref(
                    db,
                    "events/" +
                    id +
                    "/responses/" +
                    currentUser.uid
                  ),

                  {
                    name:
                      currentUser.displayName ||
                      "Unknown",

                    photo:
                      currentUser.photoURL ||
                      "",

                    status:
                      choice,

                    note,

                    updatedAt:
                      Date.now()
                  }

                );


                message.textContent =
                  choice === "yes"
                    ? "You're coming."
                    : "You're not coming.";

              }catch(errorObject){

                console.error(
                  "RESPONSE ERROR:",
                  errorObject
                );

                message.textContent =
                  "Couldn't save your response.\n\n" +
                  errorObject.code +
                  "\n" +
                  errorObject.message;

              }

            }
          );

      },

      error=>{

        console.error(
          "EVENT ERROR:",
          error
        );

        const shell =
          document.querySelector(
            "#eventShell"
          );

        if(shell){

          shell.innerHTML = `
            <div class="box">
              <p class="error">
                Couldn't load event.

                ${escapeHTML(
                  error.message || ""
                )}
              </p>
            </div>
          `;

        }

      }

    );

}


/* =====================================================
   ACCOUNT
===================================================== */

function profilePage(){

  const user =
    auth.currentUser;

  if(!user)
    return;


  app.innerHTML = `

    ${renderHeader()}

    <div class="box center">

      ${
        user.photoURL
          ? `
            <img
              class="profile-photo"
              src="${escapeHTML(user.photoURL)}"
              alt=""
            >
          `
          : ""
      }

      <h2>
        ${escapeHTML(
          user.displayName ||
          "Google account"
        )}
      </h2>

      <p class="muted">
        ${escapeHTML(
          user.email || ""
        )}
      </p>

      <button id="signOutButton">
        Sign out
      </button>

    </div>

  `;

  wireHeader();


  document
    .querySelector("#signOutButton")
    .onclick = async()=>{

      await signOut(auth);

      location.hash = "";

      route();

    };

}


/* =====================================================
   ROUTER
===================================================== */

function route(){

  stopListener();


  const match =
    location.hash.match(
      /^#e=(.+)$/
    );


  if(match){

    eventPage(
      decodeURIComponent(
        match[1]
      )
    );

    return;

  }

  eventsPage();

}


/* =====================================================
   START
===================================================== */

onAuthStateChanged(
  auth,
  ()=>{
    route();
  }
);


window.addEventListener(
  "hashchange",
  route
);

</script>

</body>
</html>
