function escapeHTML(v){

    "<":"&lt;",

    '"':"&quot;",
    "'":"&#39;"

}

function newEventId(){

}

function randomToken(){
  const bytes=new Uint8Array(24);
  crypto.getRandomValues(bytes);
  return Array.from(
    bytes,
    b=>b.toString(16).padStart(2,"0")
  ).join("");
}

function parseEventDate(v){
  if(!v)return null;
  const d=new Date(v);
  if(Number.isNaN(d.getTime()))return null;

  return{
    month:d.toLocaleString("en-US",{month:"short"}),
    day:d.getDate(),
    formatted:d.toLocaleString([],{
      day:"numeric",
      month:"long",
      year:"numeric",
      hour:"numeric",
      minute:"2-digit"
    }),
    time:d.toLocaleString([],{
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    }),
    fullDate:d.toLocaleString("en-IN",{
      day:"numeric",
      month:"long",
      year:"numeric"
    }),
    raw:d
  };
}

async function requireAuth(){
  if(auth.currentUser)return true;
  if(signingIn)return false;

  signingIn=true;

  try{
    await signInWithPopup(auth,googleProvider);
    return true;
  }catch(e){
    console.error(e);

    if([
      "auth/popup-closed-by-user",
      "auth/cancelled-popup-request",
      "auth/popup-blocked"
    ].includes(e.code))return false;

    alert(
      "Google sign-in failed.\n\n"+
      e.code+"\n\n"+
      e.message
    );

    return false;
  }finally{
    signingIn=false;
  }
}

function generateShareText(e,id){
  const d=parseEventDate(e.when);

  return `${e.title}
${d?`${d.fullDate} · ${d.time}`:""}${e.location?.name?`\n${e.location.name}`:""}

*വരുന്നുണ്ടോ???*

${eventURL(id)}`;
}

async function shareEvent(id){
  const s=await get(ref(db,"events/"+id));
  if(!s.exists())return;

  const t=generateShareText(s.val(),id);

  if(navigator.share){
    try{
      await navigator.share({text:t});
      return;
    }catch(e){
      if(e?.name==="AbortError")return;
    }
  }

  copyText(t);
}

async function copyText(t){
  try{
    await navigator.clipboard.writeText(t);
    alert("Message copied to clipboard!");
  }catch{
    prompt("Copy this event message:",t);
  }
}

async function copyEventMessage(id,button){
  const s=await get(ref(db,"events/"+id));
  if(!s.exists())return;

  const t=generateShareText(s.val(),id);

  try{
    await navigator.clipboard.writeText(t);

    if(button){
      const o=button.innerHTML;
      button.innerHTML=`${SVGS.copy} Copied!`;

      setTimeout(()=>{
        if(button.isConnected)
          button.innerHTML=o;
      },1500);
    }
  }catch{
    prompt("Copy this event message:",t);
  }
}

async function fetchEvent(id){
  const s=await get(ref(db,"events/"+id));
  return s.exists()?s.val():null;
}

async function fetchEventsByIds(ids){
  const out=[];

  await Promise.all(
    ids.map(async id=>{
      const e=await fetchEvent(id);
      if(e)out.push([id,e]);
    })
  );

  return out;
}

function sortEvents(list,ascending){
  return list.sort((a,b)=>{
    const am=a[1].whenMs??new Date(a[1].when||"").getTime();
    const bm=b[1].whenMs??new Date(b[1].when||"").getTime();
    return ascending?am-bm:bm-am;
  });
}

async function loadFeed(){
  const now=Date.now();
  const publicPath=ref(db,"publicEvents");
  const user=auth.currentUser;

  let refs=new Set();
  let upcomingRefs=new Set();
  let pastRefs=new Set();

  const qUp=query(
    publicPath,
    orderByChild("whenMs"),
    startAt(now),
    limitToFirst(FEED_LIMIT)
  );

  const qPast=query(
    publicPath,
    orderByChild("whenMs"),
    endAt(now),
    limitToLast(FEED_LIMIT)
  );

  const [upSnap,pastSnap]=await Promise.all([
    get(qUp),
    get(qPast)
  ]);

  upSnap.forEach(x=>upcomingRefs.add(x.key));
  pastSnap.forEach(x=>pastRefs.add(x.key));

  if(user){
    const us=await get(ref(db,"userEvents/"+user.uid));

    if(us.exists()){
      Object.entries(us.val()).forEach(([id,v])=>{
        if(v?.whenMs>=now)
          upcomingRefs.add(id);
        else
          pastRefs.add(id);
      });
    }
  }

  [...upcomingRefs,...pastRefs].forEach(id=>refs.add(id));

  const events=await fetchEventsByIds([...refs]);
  const map=new Map(events);

  return{
    upcoming:[...upcomingRefs]
      .map(id=>[id,map.get(id)])
      .filter(x=>x[1]),

    past:[...pastRefs]
      .map(id=>[id,map.get(id)])
      .filter(x=>x[1])
  };
}

function renderEventList(container,list){
  if(!list.length){
    container.innerHTML=
      `<div style="text-align:center;padding:2rem 0;color:var(--text-muted);font-size:.875rem">
        No ${currentTab} events found.
      </div>`;
    return;
  }

  container.innerHTML=
    `<div class="event-list">${
      sortEvents(list,currentTab==="upcoming")
        .map(([id,e])=>{
          const d=parseEventDate(e.when);
          const coming=Object.values(e.responses||{})
            .filter(r=>r.status==="yes").length;

          return `<div class="event-card" data-id="${escapeHTML(id)}">
            <div class="date-badge">
              <div class="date-badge-month">${d?d.month:"---"}</div>
              <div class="date-badge-day">${d?d.day:"--"}</div>
            </div>

            <div class="event-info">
              <div class="event-name">${escapeHTML(e.title)}</div>
              <div class="event-meta">
                ${d?d.time:""}
                ${e.location?.name?" · "+escapeHTML(e.location.name):""}
              </div>
            </div>

            <div class="count-pill">${coming} coming</div>
          </div>`;
        }).join("")
    }</div>`;

  container.querySelectorAll(".event-card").forEach(c=>{
    c.onclick=()=>location.hash="e="+c.dataset.id;
  });
}

function locationFields(existing){
  return `<div class="input-group">
    <label class="input-label">Where? (optional)</label>

      <span class="input-icon">${SVGS.location}</span>
      <input
        class="input-field"

        value="${escapeHTML(existing?.name||"")}"
      >
    </div>

    <div style="font-size:.7rem;color:var(--text-muted);margin-top:.3rem">
      Location search can be connected to a Places API later.
    </div>

    <input type="hidden" id="locationPlaceId" value="${escapeHTML(existing?.placeId||"")}">
    <input type="hidden" id="locationAddress" value="${escapeHTML(existing?.address||"")}">
    <input type="hidden" id="locationLat" value="${existing?.latitude??""}">
    <input type="hidden" id="locationLng" value="${existing?.longitude??""}">
  </div>`;
}

function readLocation(){
  const name=document.querySelector("#locationName")?.value.trim();

  if(!name)return null;

  const placeId=document.querySelector("#locationPlaceId")?.value.trim();
  const address=document.querySelector("#locationAddress")?.value.trim();

  const latRaw=document.querySelector("#locationLat")?.value.trim();
  const lngRaw=document.querySelector("#locationLng")?.value.trim();

  const lat=latRaw===""?null:Number(latRaw);
  const lng=lngRaw===""?null:Number(lngRaw);

  const l={name};

  if(placeId)l.placeId=placeId;
  if(address)l.address=address;

  if(lat!==null&&Number.isFinite(lat))
    l.latitude=lat;

  if(lng!==null&&Number.isFinite(lng))
    l.longitude=lng;

  return l;
}

function visibilityFields(value="public"){
  return `<div class="input-group">
    <label class="input-label">Who can see it?</label>

    <div class="visibility-row">
      <button type="button"
        class="visibility-option ${value==="public"?"selected":""}"
        id="publicOption">
        <strong>Public</strong>
        <span>Anyone can discover and respond.</span>
      </button>

      <button type="button"
        class="visibility-option ${value==="private"?"selected":""}"
        id="privateOption">
        <strong>Private</strong>
        <span>Only people with the invite can access it.</span>
      </button>
    </div>

    <input type="hidden" id="visibility" value="${value}">
  </div>`;
}

function wireVisibility(){
  const p=document.querySelector("#publicOption");
  const q=document.querySelector("#privateOption");
  const v=document.querySelector("#visibility");

  p.onclick=()=>{
    v.value="public";
    p.classList.add("selected");
    q.classList.remove("selected");
  };

  q.onclick=()=>{
    v.value="private";
    q.classList.add("selected");
    p.classList.remove("selected");
  };
}

      <label class="input-label">Date & time *</label>
      <div class="input-wrapper">
        <span class="input-icon">${SVGS.calendar}</span>

          value="${escapeHTML(e.when)}">

      <label class="input-label">Note (optional)</label>
      <textarea class="input-field" id="eventNote" maxlength="1000">${escapeHTML(e.note||"")}</textarea>
    </div>

    ${visibilityFields(e.visibility||"public")}

    <p id="eventError" class="error"></p>

      <button class="btn-primary" id="saveEvent">
        Save changes
      </button>

      <button class="btn-secondary" id="cancel">
        Cancel
      </button>
    </div>

    <div class="hero-illustration" style="margin-top:1rem">
      ${SVGS.landscape}
    </div>`;

  wireHeader();
  wireVisibility();

  document.querySelector("#cancel").onclick=()=>eventPage(id);

  document.querySelector("#saveEvent").onclick=async()=>{
    const error=document.querySelector("#eventError");
    const title=document.querySelector("#title").value.trim();
    const when=document.querySelector("#when").value;
    const note=document.querySelector("#eventNote").value.trim();
    const visibility=document.querySelector("#visibility").value;
    const whenMs=new Date(when).getTime();

    if(!title){
      error.textContent="Give the event a title.";
      return;
    }

    if(
      !when ||
      !Number.isFinite(whenMs) ||
      whenMs<=Date.now()
    ){
      error.textContent="Choose a future date and time.";
      return;
    }

    const updates={
      ["events/"+id+"/title"]:title,
      ["events/"+id+"/when"]:when,
      ["events/"+id+"/whenMs"]:whenMs,
      ["events/"+id+"/note"]:note,
      ["events/"+id+"/visibility"]:visibility,
      ["events/"+id+"/location"]:readLocation()
    };

    let token=e.inviteToken||null;

    if(visibility==="private"){
      if(!token)
        token=randomToken();

      updates["events/"+id+"/inviteToken"]=token;

      updates["privateInvites/"+token]={
        eventId:id,
        createdAt:Date.now(),
        creatorUid:user.uid
      };

    }else{
      updates["events/"+id+"/inviteToken"]=null;

      if(e.inviteToken)
        updates["privateInvites/"+e.inviteToken]=null;
    }

    if(visibility==="public")
      updates["publicEvents/"+id]={whenMs};
    else
      updates["publicEvents/"+id]=null;

    updates["userEvents/"+user.uid+"/"+id]={
      whenMs,
      visibility
    };

    try{
      await update(ref(db),updates);
      eventPage(id);

    }catch(x){
      console.error(x);

      error.textContent=
        "Couldn't save changes.\n\n"+
        x.code+"\n"+
        x.message;
    }
  };
}

async function deleteEvent(id){
  const u=auth.currentUser;

  if(!u)return;

  const e=await fetchEvent(id);

  if(!e){
    alert("Event not found.");
    return;
  }

  if(e.creatorUid!==u.uid){
    alert("Only the creator can delete this event.");
    return;
  }

  if(!confirm(
    "Delete this event?\n\nThis cannot be undone."
  ))return;

  try{
    const updates={
      ["events/"+id]:null,
      ["publicEvents/"+id]:null,
      ["userEvents/"+u.uid+"/"+id]:null
    };

    if(e.inviteToken)
      updates["privateInvites/"+e.inviteToken]=null;

    await update(ref(db),updates);

    goToEventsPage();

  }catch(x){
    alert(
      "Couldn't delete the event.\n\n"+
      x.code+"\n"+
      x.message
    );
  }
}

async function ensureInviteAccess(token){
  if(!auth.currentUser)return null;

  const s=await get(ref(db,"privateInvites/"+token));

  if(!s.exists())return null;

  const invite=s.val();
  const id=invite.eventId;

  if(!id)return null;

  await set(
    ref(db,"inviteAccess/"+id+"/"+auth.currentUser.uid),
    {
      inviteToken:token,
      createdAt:Date.now()
    }
  );

  return id;
}

          <button class="btn-secondary" id="copyButton"
            style="flex:1;display:flex;gap:.45rem">
            ${SVGS.copy} Copy Text
          </button>
        </div>

        <div class="details-card">
          <h3 style="font-size:.95rem;margin-bottom:.65rem">
            Coming · ${coming.length}
          </h3>

          ${coming.length
            ?coming.map(([,r])=>`
              <div class="person-row">
                <div class="person-detail">
                  ${r.photo
                    ?`<img class="person-avatar"
                        src="${escapeHTML(r.photo)}"
                        alt="">`
                    :`<div class="person-avatar"></div>`}

                  <div>
                    <div style="font-weight:600;font-size:.875rem">
                      ${escapeHTML(r.name||"Unknown")}
                    </div>

                    ${r.note
                      ?`<div style="font-size:.75rem;color:var(--text-muted)">
                          ${escapeHTML(r.note)}
                        </div>`
                      :""}
                  </div>
                </div>

                <span style="color:var(--yes-text);font-weight:700">
                  ✓
                </span>
              </div>
            `).join("")

            :`<p style="font-size:.8rem;color:var(--text-muted)">
                Nobody yet.
              </p>`
          }
        </div>

        ${notComing.length
          ?`<div class="details-card">
              <h3 style="font-size:.95rem;margin-bottom:.65rem">
                Not coming · ${notComing.length}
              </h3>

              ${notComing.map(([,r])=>`
                <div class="person-row">
                  <div class="person-detail">
                    ${r.photo
                      ?`<img class="person-avatar"
                          src="${escapeHTML(r.photo)}"
                          alt="">`
                      :`<div class="person-avatar"></div>`}

                    <div>
                      <div style="font-weight:600;font-size:.875rem">
                        ${escapeHTML(r.name||"Unknown")}
                      </div>

                      ${r.note
                        ?`<div style="font-size:.75rem;color:var(--text-muted)">
                            ${escapeHTML(r.note)}
                          </div>`
                        :""}
                    </div>
                  </div>

                  <span style="color:var(--no-text);font-weight:700">
                    ×
                  </span>
                </div>
              `).join("")}
            </div>`
          :""}`;

      document.querySelector("#shareButton")
        ?.addEventListener("click",()=>shareEvent(id));

      document.querySelector("#copyButton")
        ?.addEventListener("click",function(){
          copyEventMessage(id,this);
        });

      if(isCreator){
        document.querySelector("#editButton")
          ?.addEventListener("click",()=>editEvent(id));

        document.querySelector("#deleteButton")
          ?.addEventListener("click",()=>deleteEvent(id));

        if(e.inviteToken)
          wireInviteBox(e.inviteToken);
      }

      if(!uid){
        document.querySelector("#respondButton")
          ?.addEventListener("click",async()=>{
            if(await requireAuth())
              eventPage(id);
          });

      }else if(!locked){

        let selected=mine?.status||null;

        const y=document.querySelector("#yesButton");
        const n=document.querySelector("#noButton");

        y.onclick=()=>{
          selected="yes";
          y.classList.add("selected");
          n.classList.remove("selected");
        };

        n.onclick=()=>{
          selected="no";
          n.classList.add("selected");
          y.classList.remove("selected");
        };

        document.querySelector("#saveResponse").onclick=async()=>{
          if(!selected){
            alert("Select COMING or NOT COMING first.");
            return;
          }

          const note=document
            .querySelector("#responseNote")
            .value
            .trim();

          try{
            const now=Date.now();
            const updates={};

            updates["events/"+id+"/responses/"+uid]={
              status:selected,
              note,
              name:u.displayName||"Unknown",
              photo:u.photoURL||"",
              updatedAt:now
            };

            updates["eventMembers/"+id+"/"+uid]={
              joinedAt:now
            };

            updates["userEvents/"+uid+"/"+id]={
              whenMs:e.whenMs??new Date(e.when).getTime(),
              visibility:e.visibility||"public"
            };

            if(e.visibility==="private")
              updates["inviteAccess/"+id+"/"+uid]=null;

            await update(ref(db),updates);

            const msg=document.querySelector("#responseMessage");

            if(msg){
              msg.textContent="Response saved!";

              setTimeout(()=>{
                if(msg.isConnected)
                  msg.textContent="";
              },2000);
            }

          }catch(x){
            alert(
              "Couldn't save response: "+
              x.message
            );
          }
        };
      }
    },
    x=>console.error("EVENT DETAIL ERROR",x)
  );
}

function profilePage(){
  stopListener();
  updateBottomNav("");

  const u=auth.currentUser;

  if(!u){
    goToEventsPage();
    return;
  }

  app.innerHTML=`
    ${renderHeader(true)}

    <div style="text-align:center;padding:2.5rem 1rem 1rem">
      <div style="width:80px;height:80px;border-radius:50%;overflow:hidden;margin:0 auto 1rem;border:2px solid var(--border)">
        <img src="${escapeHTML(u.photoURL||"")}"
          alt="Profile"
          style="width:100%;height:100%;object-fit:cover">
      </div>

      <h2 style="font-size:1.3rem">
        ${escapeHTML(u.displayName||"User")}
      </h2>

      <p style="color:var(--text-muted);font-size:.85rem;margin-top:.25rem;margin-bottom:2rem">
        ${escapeHTML(u.email||"")}
      </p>

      <button class="btn-secondary" id="signOutButton"
        style="max-width:280px;margin:0 auto">
        Sign out
      </button>
    </div>`;

  wireHeader();

  document.querySelector("#signOutButton").onclick=async()=>{
    await signOut(auth);
    goToEventsPage();
  };
}

async function route(){
  const h=location.hash;

  if(h==="#create")
    return createPage();

  if(h==="#profile")
    return profilePage();

  if(h.startsWith("#invite=")){
    const token=h.slice(7);
    return token
      ?renderInvitePage(token)
      :goToEventsPage();
  }

  if(h.startsWith("#e=")){
    const id=h.slice(3);
    return id
      ?eventPage(id)
      :eventsPage();
  }

  currentTab="upcoming";
  eventsPage();
}

addEventListener("hashchange",route);
onAuthStateChanged(auth,()=>route());
route();
</script>
</body>
</html>
