function escapeHTML(value){
  return String(value ?? "")
    .replace(/[&<>"']/g, character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[character]));
}

function parseEventDate(value) {
  if(!value) return null;
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return null;
  return {
    month: date.toLocaleString('en-US', { month: 'short' }),
    day: date.getDate(),
    formatted: date.toLocaleString([], { day: 'numeric', month: 'long', year: 'numeric', hour: 'numeric', minute: '2-digit' }),

    fullDate: date.toLocaleString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' }),

}

async function requireAuth(){
  if(auth.currentUser) return true;
  if(signingIn) return false;
  signingIn = true;
  try {
    await signInWithPopup(auth, googleProvider);
    return true;
  } catch(error){
    console.error("Firebase Auth Error:", error);
    if(["auth/popup-closed-by-user","auth/cancelled-popup-request","auth/popup-blocked"].includes(error.code)) return false;
    alert("Google sign-in failed.\n\n" + error.code + "\n\n" + error.message);
    return false;
  } finally {
    signingIn = false;
  }
}

function generateShareText(event, id) {
  const dateData = parseEventDate(event.when);
  const formattedDateTime = dateData ? `${dateData.fullDate} · ${dateData.time}` : '';
  const link = eventURL(id);

  return `${event.title}\n${formattedDateTime}\n\n*വരുന്നുണ്ടോ???*\n\n${link}`;
}

async function shareEvent(id){
  const snapshot = await get(ref(db, "events/" + id));
  const event = snapshot.val();
  if(!event) return;

  const shareText = generateShareText(event, id);

  if(navigator.share){
    try {
      await navigator.share({ text: shareText });
      return;
    } catch(error){
      if(error?.name === "AbortError") return;
    }
  }

  copyEventMessage(id);
}

  const shareText = generateShareText(event, id);

  try {
    await navigator.clipboard.writeText(shareText);
    if(button){
      const original = button.innerHTML;
      button.innerHTML = `${SVGS.copy} Copied!`;
      setTimeout(() => { if(button.isConnected) button.innerHTML = original; }, 1500);
    } else {
      alert("Message copied to clipboard!");
    }
  } catch {
    prompt("Copy this event message:", shareText);
  }
}

/* =====================================================
   EVENTS LIST (HOME) PAGE
===================================================== */
function eventsPage(){
  stopListener();
  updateBottomNav("events");

  app.innerHTML = `
    ${renderHeader(false)}
    
    <div class="hero-illustration">
      ${SVGS.landscapeGreen}
    </div>

    <div class="tab-container">
      <button class="tab-btn ${currentTab === 'upcoming' ? 'active' : ''}" id="tabUpcoming">Upcoming</button>
      <button class="tab-btn ${currentTab === 'past' ? 'active' : ''}" id="tabPast">Past</button>
    </div>

    <div id="eventsContainer">
      <div style="text-align:center; padding: 1.25rem; color: var(--text-muted); font-size: 0.875rem;">Loading events...</div>
    </div>
  `;

  wireHeader();

  const tabUpcoming = document.querySelector("#tabUpcoming");
  const tabPast = document.querySelector("#tabPast");

  tabUpcoming.onclick = () => {
    currentTab = 'upcoming';
    tabUpcoming.classList.add('active');
    tabPast.classList.remove('active');
    renderEventsList();
  };

  tabPast.onclick = () => {
    currentTab = 'past';
    tabPast.classList.add('active');
    tabUpcoming.classList.remove('active');
    renderEventsList();
  };

  let cachedUpcoming = [];
  let cachedPast = [];

  function renderEventsList() {
    const container = document.querySelector("#eventsContainer");
    const list = currentTab === 'upcoming' ? cachedUpcoming : cachedPast;

    if(!list.length){
      container.innerHTML = `<div style="text-align:center; padding: 2rem 0; color: var(--text-muted); font-size:0.875rem;">No ${currentTab} events found.</div>`;
      return;
    }

    container.innerHTML = `
      <div class="event-list">
        ${list.map(([id, event]) => {
          const dateData = parseEventDate(event.when);
          const coming = Object.values(event.responses || {}).filter(r => r.status === "yes").length;
          return `
            <div class="event-card" data-id="${escapeHTML(id)}">
              <div class="date-badge">
                <div class="date-badge-month">${dateData ? dateData.month : '---'}</div>
                <div class="date-badge-day">${dateData ? dateData.day : '--'}</div>
              </div>
              <div class="event-info">
                <div class="event-name">${escapeHTML(event.title)}</div>
                <div class="event-meta">${dateData ? dateData.time : ''}</div>
              </div>
              <div class="count-pill">${coming} coming</div>
            </div>
          `;
        }).join('')}
      </div>
    `;

    container.querySelectorAll('.event-card').forEach(card => {
      card.onclick = () => {
        location.hash = "e=" + card.dataset.id;
      };
    });
  }

  activeListener = onValue(ref(db, "events"), snapshot => {
    const events = snapshot.val() || {};
    const now = Date.now();

    cachedUpcoming = [];
    cachedPast = [];

    Object.entries(events).forEach(([id, event]) => {
      const eventTime = new Date(event.when).getTime();
      if(Number.isFinite(eventTime) && eventTime < now){
        cachedPast.push([id, event]);
      } else {
        cachedUpcoming.push([id, event]);
      }
    });

    cachedUpcoming.sort((a,b) => new Date(a[1].when).getTime() - new Date(b[1].when).getTime());
    cachedPast.sort((a,b) => new Date(b[1].when).getTime() - new Date(a[1].when).getTime());

    renderEventsList();
  }, error => {
    console.error("EVENTS LOAD ERROR:", error);
    document.querySelector("#eventsContainer").innerHTML = `<p class="error">Couldn't load events. ${escapeHTML(error.message || "")}</p>`;
  });
}

  if(!auth.currentUser){

        <h2 style="margin-bottom:0.5rem; font-size: 1.25rem;">Create an Event</h2>
        <p style="color:var(--text-muted); margin-bottom:1.25rem; font-size:0.875rem;">Sign in with Google to create and host your event.</p>

      </div>
    `;
    wireHeader();
    document.querySelector("#googleButton").onclick = async () => {
      const signedIn = await requireAuth();
      if(signedIn) createPage();
    };
    return;
  }

  app.innerHTML = `
    ${renderHeader(true)}

    <div style="text-align:center; margin: 0.4rem 0 1rem;">
      <div style="width:80px; height:80px; margin: 0 auto;">
        ${SVGS.createCalendarIcon}

      <h2 style="font-size:1.35rem; margin-top:0.4rem;">Create a new event</h2>
    </div>

    <div class="input-group">
      <label class="input-label">Event title *</label>
      <div class="input-wrapper">
        <span class="input-icon">${SVGS.pencil}</span>
        <input class="input-field" id="title" maxlength="100" placeholder="e.g. Evening walk">
      </div>
    </div>

    <div class="input-group">
      <label class="input-label">Date & time *</label>
      <div class="input-wrapper">
        <span class="input-icon">${SVGS.calendar}</span>
        <input class="input-field" id="when" type="datetime-local">
      </div>
    </div>

    <div class="input-group">
      <label class="input-label">Note (optional)</label>
      <textarea class="input-field" id="eventNote" maxlength="1000" placeholder="Anything people should know?"></textarea>
    </div>

    <p id="eventError" class="error"></p>

    <button class="btn-primary" id="saveEvent" style="margin-top:0.5rem;">Create →</button>
  `;

  wireHeader();

  document.querySelector("#saveEvent").onclick = async () => {
    const error = document.querySelector("#eventError");
    const title = document.querySelector("#title").value.trim();
    const when = document.querySelector("#when").value;
    const note = document.querySelector("#eventNote").value.trim();

    if(!title){ error.textContent = "Give the event a title."; return; }
    if(!when){ error.textContent = "Choose a date and time."; return; }

    const whenMs = new Date(when).getTime();
    if(!Number.isFinite(whenMs) || whenMs <= Date.now()){
      error.textContent = "Choose a future date and time.";
      return;
    }

    const user = auth.currentUser;
    if(!user){ error.textContent = "Please sign in first."; return; }

    const id = newEventId();
    const event = {
      title,
      when,
      note,
      creatorUid: user.uid,
      creatorName: user.displayName || "Unknown",
      creatorPhoto: user.photoURL || "",
      createdAt: Date.now()
    };

    try {
      await set(ref(db, "events/" + id), event);
      location.hash = "e=" + id;
    } catch(errorObject){
      console.error("CREATE EVENT ERROR:", errorObject);
      error.textContent = "Couldn't create event.\n\n" + errorObject.code + "\n" + errorObject.message;
    }
  };
}

/* =====================================================
   EDIT EVENT PAGE
===================================================== */
async function editEvent(id){
  const user = auth.currentUser;
  if(!user) return;

  const snapshot = await get(ref(db, "events/" + id));
  if(!snapshot.exists()){ alert("Event not found."); return; }

  const event = snapshot.val();
  
  const eventTime = new Date(event.when).getTime();
  if(Number.isFinite(eventTime) && eventTime <= Date.now()){
    alert("This event has already started and can no longer be edited.");
    eventPage(id);
    return;
  }

  if(event.creatorUid !== user.uid){
    alert("Only the creator can edit this event.");
    return;
  }

  app.innerHTML = `
    ${renderHeader(true)}

    <h2 style="font-size:1.35rem; margin-bottom:1rem;">Edit event</h2>

    <div class="input-group">
      <label class="input-label">Event title *</label>
      <div class="input-wrapper">
        <span class="input-icon">${SVGS.pencil}</span>
        <input class="input-field" id="title" maxlength="100" value="${escapeHTML(event.title)}">
      </div>
    </div>

    <div class="input-group">
      <label class="input-label">Date & time *</label>
      <div class="input-wrapper">
        <span class="input-icon">${SVGS.calendar}</span>
        <input class="input-field" id="when" type="datetime-local" value="${escapeHTML(event.when)}">
      </div>
    </div>

    <div class="input-group">
      <label class="input-label">Note (optional)</label>
      <textarea class="input-field" id="eventNote" maxlength="1000">${escapeHTML(event.note || "")}</textarea>
    </div>

    <p id="eventError" class="error"></p>

    <div style="display:flex; flex-direction:column; gap:0.5rem; margin-top:1rem;">
      <button class="btn-primary" id="saveEvent">Save changes</button>
      <button class="btn-secondary" id="cancel">Cancel</button>
    </div>

    <div class="hero-illustration" style="margin-top:1rem;">
      ${SVGS.landscape}
    </div>
  `;

  wireHeader();

  document.querySelector("#cancel").onclick = () => eventPage(id);

  document.querySelector("#saveEvent").onclick = async () => {
    const error = document.querySelector("#eventError");
    const title = document.querySelector("#title").value.trim();
    const when = document.querySelector("#when").value;
    const note = document.querySelector("#eventNote").value.trim();

    if(!title){ error.textContent = "Give the event a title."; return; }
    if(!when){ error.textContent = "Choose a date and time."; return; }

    const whenMs = new Date(when).getTime();
    if(!Number.isFinite(whenMs) || whenMs <= Date.now()){
      error.textContent = "Choose a future date and time.";
      return;
    }

    try {
      await set(ref(db, "events/" + id + "/title"), title);
      await set(ref(db, "events/" + id + "/when"), when);
      await set(ref(db, "events/" + id + "/note"), note);
      eventPage(id);
    } catch(errorObject){
      console.error("EDIT EVENT ERROR:", errorObject);
      error.textContent = "Couldn't save changes.\n\n" + errorObject.code + "\n" + errorObject.message;
    }
  };
}

/* =====================================================
   DELETE EVENT
===================================================== */
async function deleteEvent(id){
  const user = auth.currentUser;
  if(!user) return;

  const snapshot = await get(ref(db, "events/" + id));
  if(!snapshot.exists()){ alert("Event not found."); return; }

  const event = snapshot.val();
  if(event.creatorUid !== user.uid){
    alert("Only the creator can delete this event.");
    return;
  }

  if(!confirm("Delete this event?\n\nThis cannot be undone.")) return;

  try {
    await set(ref(db, "events/" + id), null);
    goToEventsPage();
  } catch(errorObject){
    console.error("DELETE EVENT ERROR:", errorObject);
    alert("Couldn't delete the event.\n\n" + errorObject.code + "\n" + errorObject.message);
  }
}

/* =====================================================
   EVENT DETAILS PAGE
===================================================== */
function eventPage(id){
  stopListener();
  updateBottomNav("");

  app.innerHTML = `
    ${renderHeader(true)}
    <div id="eventShell">
      <div style="text-align:center; padding:2rem; color:var(--text-muted); font-size: 0.875rem;">Loading event details...</div>
    </div>
  `;

  wireHeader();

  activeListener = onValue(ref(db, "events/" + id), snapshot => {
    const shell = document.querySelector("#eventShell");
    if(!shell) return;

    if(!snapshot.exists()){
      shell.innerHTML = `
        <div class="details-card" style="text-align:center;">
          <h2 style="font-size:1.2rem;">Event not found</h2>
          <p style="color:var(--text-muted); font-size:0.85rem; margin-top:0.4rem;">This event doesn't exist or has been deleted.</p>
        </div>
      `;
      return;
    }

    const event = snapshot.val();
    const user = auth.currentUser;
    const userUid = user?.uid || null;
    const isCreator = userUid === event.creatorUid;

    const eventTime = new Date(event.when).getTime();
    const isLocked = Number.isFinite(eventTime) && eventTime <= Date.now();

    const dateData = parseEventDate(event.when);
    const responses = Object.entries(event.responses || {});
    const coming = responses.filter(([,r]) => r.status === "yes");
    const notComing = responses.filter(([,r]) => r.status === "no");
    const myResponse = userUid ? event.responses?.[userUid] : null;

    let selectedStatus = myResponse?.status || null;

    shell.innerHTML = `
      <div class="hero-illustration" style="padding:0 0 0.5rem;">
        ${SVGS.landscapeGreen}
      </div>

      <div class="details-card">
        <h1 class="serif-title">${escapeHTML(event.title)}</h1>
        
        <div style="display:flex; align-items:center; gap:0.45rem; color:var(--text-muted); margin-top:0.4rem; font-size:0.875rem;">
          ${SVGS.calendar}
          <span>${dateData ? dateData.formatted : 'Date unavailable'}</span>
        </div>

        <div style="display:inline-block; background:#FAF8F5; border:1px solid var(--border); padding:0.25rem 0.65rem; border-radius:999px; font-size:0.75rem; font-weight:600; margin-top:0.5rem;">
          ${coming.length} coming
        </div>

        ${event.note ? `
          <div class="note-box">
            <div style="font-weight:700; display:flex; align-items:center; gap:0.35rem; margin-bottom:0.2rem; font-size:0.8rem;">
              ${SVGS.note} Note
            </div>
            <div style="white-space:pre-wrap; color:var(--text-main); font-size:0.875rem;">${escapeHTML(event.note)}</div>
          </div>
        ` : ''}

        <div class="creator-info">
          ${event.creatorPhoto ? `<img class="creator-photo" src="${escapeHTML(event.creatorPhoto)}" alt="">` : ''}
          <span>Created by <strong>${escapeHTML(event.creatorName || "Unknown")}</strong></span>
        </div>

        ${isCreator ? `
          <div style="display:flex; gap:0.5rem; margin-top:0.85rem; border-top:1px solid var(--border); padding-top:0.85rem;">
            ${!isLocked ? `<button class="btn-secondary" id="editButton" style="padding:0.45rem 0.8rem; font-size:0.8rem;">Edit</button>` : ''}
            <button class="btn-secondary" id="deleteButton" style="padding:0.45rem 0.8rem; font-size:0.8rem; color:#dc2626; border-color:#fca5a5;">Delete</button>
          </div>
        ` : ''}
      </div>

      <!-- RSVP Box -->
      <div class="details-card">
        <h3 style="font-size:1rem;">Are you coming?</h3>
        
        ${isLocked ? `
          <div class="locked-badge">This event has already started. Responses are locked.</div>
        ` : !userUid ? `
          <p style="font-size:0.85rem; color:var(--text-muted); margin: 0.4rem 0 0.85rem;">Sign in with Google to submit your response.</p>
          <button class="btn-primary" id="respondButton">Continue with Google</button>
        ` : `
          <div class="rsvp-grid">
            <button class="rsvp-btn yes ${selectedStatus === 'yes' ? 'selected' : ''}" id="yesButton">
              ${selectedStatus === 'yes' ? '✓ ' : ''}COMING
            </button>
            <button class="rsvp-btn no ${selectedStatus === 'no' ? 'selected' : ''}" id="noButton">
              ${selectedStatus === 'no' ? '✓ ' : ''}NOT COMING
            </button>
          </div>

          <div class="input-group">
            <textarea class="input-field" id="responseNote" maxlength="500" placeholder="Add a note (optional)" style="min-height:65px;">${escapeHTML(myResponse?.note || "")}</textarea>
          </div>

          <button class="btn-primary" id="saveResponse">Save response</button>
          <p id="responseMessage" class="success"></p>
        `}
      </div>

      <!-- Action Buttons -->
      <div style="display:flex; gap:0.5rem; margin-bottom:1.25rem;">
        <button class="btn-secondary" id="shareButton" style="flex:1; display:flex; gap:0.45rem;">
          ${SVGS.share} Share
        </button>
        <button class="btn-secondary" id="copyButton" style="flex:1; display:flex; gap:0.45rem;">
          ${SVGS.copy} Copy Text
        </button>
      </div>

      <!-- Coming List -->
      <div class="details-card">
        <h3 style="font-size:0.95rem; margin-bottom:0.65rem;">Coming · ${coming.length}</h3>
        ${coming.length ? coming.map(([,r]) => `
          <div class="person-row">
            <div class="person-detail">
              ${r.photo ? `<img class="person-avatar" src="${escapeHTML(r.photo)}" alt="">` : `<div class="person-avatar"></div>`}
              <div>
                <div style="font-weight:600; font-size:0.875rem;">${escapeHTML(r.name || "Unknown")}</div>
                ${r.note ? `<div style="font-size:0.75rem; color:var(--text-muted); margin-top:0.05rem;">${escapeHTML(r.note)}</div>` : ''}
              </div>
            </div>
            <span style="color:var(--yes-text); font-weight:700;">✓</span>
          </div>
        `).join('') : `<p style="font-size:0.8rem; color:var(--text-muted);">Nobody yet.</p>`}
      </div>

      <!-- Not Coming List -->
      ${notComing.length ? `
        <div class="details-card">
          <h3 style="font-size:0.95rem; margin-bottom:0.65rem;">Not coming · ${notComing.length}</h3>${notComing.map(([,r]) => `
            <div class="person-row">
              <div class="person-detail">
                ${r.photo ? `<img class="person-avatar" src="${escapeHTML(r.photo)}" alt="">` : `<div class="person-avatar"></div>`}
                <div>
                  <div style="font-weight:600; font-size:0.875rem;">${escapeHTML(r.name || "Unknown")}</div>
                  ${r.note ? `<div style="font-size:0.75rem; color:var(--text-muted); margin-top:0.05rem;">${escapeHTML(r.note)}</div>` : ''}
                </div>
              </div>
              <span style="color:var(--no-text); font-weight:700;">×</span>
            </div>
          `).join('')}
        </div>
      ` : ''}
    `;

    document.querySelector("#shareButton")?.addEventListener("click", () => shareEvent(id));
    document.querySelector("#copyButton")?.addEventListener("click", function(){ copyEventMessage(id, this); });

    if(isCreator){
      if(!isLocked) document.querySelector("#editButton")?.addEventListener("click", () => editEvent(id));
      document.querySelector("#deleteButton")?.addEventListener("click", () => deleteEvent(id));
    }

    if(!userUid){
      document.querySelector("#respondButton")?.addEventListener("click", async () => {
        const signedIn = await requireAuth();
        if(signedIn) eventPage(id);
      });
    } else if(!isLocked) {
      const yesBtn = document.querySelector("#yesButton");
      const noBtn = document.querySelector("#noButton");

      yesBtn.onclick = () => {
        selectedStatus = "yes";
        yesBtn.classList.add("selected");
        noBtn.classList.remove("selected");
      };

      noBtn.onclick = () => {
        selectedStatus = "no";
        noBtn.classList.add("selected");
        yesBtn.classList.remove("selected");
      };

      document.querySelector("#saveResponse").onclick = async () => {
        const msg = document.querySelector("#responseMessage");
        const note = document.querySelector("#responseNote").value.trim();

        if(!selectedStatus){
          alert("Select COMING or NOT COMING first.");
          return;
        }

        try {
          await set(ref(db, "events/" + id + "/responses/" + userUid), {
            status: selectedStatus,
            note,
            name: user.displayName || "Unknown",
            photo: user.photoURL || "",
            updatedAt: Date.now()
          });
          msg.textContent = "Response saved!";
          setTimeout(() => { if(msg) msg.textContent = ""; }, 2000);
        } catch(err){
          console.error("RESPONSE ERROR:", err);
          alert("Couldn't save response: " + err.message);
        }
      };
    }
  });
}

/* =====================================================
   ROUTER & INITIALIZATION
===================================================== */
function route(){
  const hash = location.hash;
  if(hash === "#create"){
    createPage();
  } else if(hash === "#profile"){
    profilePage();
  } else if(hash.startsWith("#e=")){
    const id = hash.slice(3);
    if(id) {
      eventPage(id);
      return;
    }
  } else {
    currentTab = 'upcoming'; // Always default to upcoming on main events route
    eventsPage();
  }
}

window.addEventListener("hashchange", route);

onAuthStateChanged(auth, () => {
  route();
});
