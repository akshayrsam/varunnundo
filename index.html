<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>വരുന്നുണ്ടോ???</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#fff9ef;
  color:#222;
  font:17px system-ui,sans-serif;
  line-height:1.45;
}

main{
  width:min(calc(100% - 24px),620px);
  margin:auto;
  padding:28px 0 70px;
}

h1{
  text-align:center;
  font-size:clamp(34px,8vw,42px);
  line-height:1;
  margin:0 0 28px;
}

h2,h3{
  line-height:1.15;
  margin-top:0;
}

button,
input{
  font:inherit;
}

button{
  min-height:48px;
  border:2px solid #222;
  border-radius:12px;
  padding:10px 16px;
  background:#ffcf4a;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

input{
  width:100%;
  min-height:50px;
  padding:11px;
  border:2px solid #222;
  border-radius:11px;
  margin:7px 0 12px;
}

.box{
  background:#fff;
  border:3px solid #222;
  border-radius:18px;
  padding:20px;
  margin:16px 0;
  box-shadow:5px 5px #222;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.top h1{
  margin:0;
  text-align:left;
}

.nav{
  display:flex;
  gap:8px;
  margin:12px 0 20px;
}

.nav button{
  flex:1;
  background:#fff;
}

.nav button.active{
  background:#ffcf4a;
}

.event{
  cursor:pointer;
}

.event:hover{
  transform:translateY(-1px);
}

.event-title{
  font-size:21px;
  font-weight:800;
  margin-bottom:5px;
}

.muted{
  color:#777;
}

.small{
  font-size:14px;
}

.center{
  text-align:center;
}

.error{
  color:#b00020;
  font-weight:700;
}

.success{
  font-weight:700;
}

.badge{
  display:inline-block;
  padding:4px 9px;
  border:2px solid #222;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
  margin-top:8px;
}

.yes{
  background:#8ee6a8;
}

.no{
  background:#ff9b9b;
}

.choice{
  display:flex;
  gap:10px;
  margin:18px 0;
}

.choice button{
  flex:1;
}

.choice .selected{
  outline:4px solid #222;
}

.scope{
  display:grid;
  gap:9px;
  margin:12px 0 18px;
}

.scope label{
  display:block;
  border:2px solid #222;
  border-radius:12px;
  padding:12px;
  cursor:pointer;
  background:#fff;
}

.scope input{
  width:auto;
  min-height:auto;
  margin:0 8px 0 0;
}

.invite-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #ddd;
}

.invite-row:last-child{
  border:0;
}

.person{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid #ddd;
}

.person:last-child{
  border:0;
}

.link{
  overflow-wrap:anywhere;
  background:#f1eee7;
  padding:11px;
  border-radius:9px;
  margin:12px 0;
}

.profile-photo{
  width:64px;
  height:64px;
  border-radius:50%;
  border:3px solid #222;
  object-fit:cover;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.actions button{
  flex:1;
  min-width:120px;
}

.danger{
  background:#ff9b9b;
}

@media(max-width:360px){
  .choice{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<main>
  <div id="app"></div>
</main>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  onValue,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


/* ==================================================
   FIREBASE
================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyAagNLnoAEmzYzEY9OMeq_m5LR6bmId9zk",
  authDomain: "varunundo-422fe.firebaseapp.com",
  databaseURL: "https://varunundo-422fe-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "varunundo-422fe",
  storageBucket: "varunundo-422fe.firebasestorage.app",
  messagingSenderId: "733075243873",
  appId: "1:733075243873:web:9a232cc80e5c9004517b20"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getDatabase(firebaseApp);

const googleProvider = new GoogleAuthProvider();

const app = document.querySelector("#app");

let signingIn = false;
let activeListener = null;
let authReadyResolve;
const authReady = new Promise(resolve => { authReadyResolve = resolve; });


/* ==================================================
   HELPERS
================================================== */

const esc = value =>
  String(value ?? "").replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));

const uid = () =>
  auth.currentUser?.uid || null;

const newId = () =>
  crypto.randomUUID().replaceAll("-","").slice(0,12);

const eventUrl = id =>
  location.origin +
  location.pathname +
  "#e=" +
  id;

const formatDate = value => {

  if(!value)
    return "Date unavailable";

  return new Date(value).toLocaleString([],{
    day:"2-digit",
    month:"long",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
};

const validUsername = value =>
  /^[a-zA-Z0-9_]{3,20}$/.test(value);

const stopListener = () => {

  if(activeListener){
    activeListener();
    activeListener=null;
  }
};


/* ==================================================
   AUTH
================================================== */

async function requireAuth(){

  await authReady;

  if(auth.currentUser) return true;
  if(signingIn) return false;

  signingIn=true;

  try{
    await signInWithPopup(auth,googleProvider);
    return !!auth.currentUser;
  }catch(error){
    console.error("Firebase Auth Error:",error.code,error.message);
    if(error.code==="auth/popup-closed-by-user" ||
       error.code==="auth/cancelled-popup-request" ||
       error.code==="auth/popup-blocked") return false;
    alert("Google sign-in failed.

"+error.code+"

"+error.message);
    return false;
  }finally{
    signingIn=false;
  }
}


/* ==================================================
   PROFILE
================================================== */

async function getProfile(){

  const user=auth.currentUser;

  if(!user)
    return null;

  const snapshot =
    await get(ref(db,"users/"+user.uid));

  return snapshot.exists()
    ? snapshot.val()
    : null;
}


async function ensureProfile(){

  const user=auth.currentUser;

  if(!user)
    return null;

  const existing=await getProfile();

  if(existing?.username)
    return existing;

  return new Promise(resolve=>{

    app.innerHTML=`

      <div class="box">

        <h2>Welcome.</h2>

        <p>
          Choose your username.
        </p>

        <input
          id="username"
          maxlength="20"
          placeholder="akshay"
          autocomplete="off"
        >

        <p class="muted small">
          3–20 characters.
          Letters, numbers and underscore.
        </p>

        <p id="usernameError" class="error"></p>

        <button id="continue">
          Continue →
        </button>

      </div>
    `;

    document.querySelector("#continue").onclick=async()=>{

      const input =
        document.querySelector("#username");

      const error =
        document.querySelector("#usernameError");

      const username =
        input.value.trim();

      const usernameLower =
        username.toLowerCase();

      if(!validUsername(username)){

        error.textContent =
          "Use 3–20 letters, numbers or underscores.";

        return;
      }

      error.textContent="Checking…";

      try{

        const usernameRef =
          ref(db,"usernames/"+usernameLower);

        const result =
          await runTransaction(
            usernameRef,
            current=>{

              if(current===null)
                return user.uid;

              return;
            }
          );

        if(!result.committed){

          error.textContent =
            "That username is already taken.";

          return;
        }

        const profile = {
          username,
          usernameLower,
          displayName:
            user.displayName || username,
          photoURL:
            user.photoURL || "",
          createdAt:Date.now()
        };

        await set(
          ref(db,"users/"+user.uid),
          profile
        );

        resolve(profile);

      }catch(errorObject){

        console.error(errorObject);

        error.textContent =
          "Couldn't create your profile.";
      }
    };
  });
}


/* ==================================================
   NAVIGATION
================================================== */

function header(){

  const user=auth.currentUser;

  return `

    <div class="top">

      <h1>വരുന്നുണ്ടോ???</h1>

      ${
        user
        ?`
          <button id="account">
            Account
          </button>
        `
        :`
          <button id="account">
            Sign in
          </button>
        `
      }

    </div>

    <div class="nav">

      <button id="home">
        Home
      </button>

      <button id="myEvents">
        My Events
      </button>

      <button id="create">
        Create
      </button>

    </div>
  `;
}


function wireHeader(){
  const home=document.querySelector("#home");
  const myEvents=document.querySelector("#myEvents");
  const create=document.querySelector("#create");
  const account=document.querySelector("#account");

  home?.addEventListener("click",()=>{
    if(location.hash) location.hash="";
    else feedPage();
  });

  myEvents?.addEventListener("click",async()=>{
    if(myEvents.disabled) return;
    myEvents.disabled=true;
    try{ await eventsPage(); } finally{ myEvents.disabled=false; }
  });

  create?.addEventListener("click",async()=>{
    if(create.disabled) return;
    create.disabled=true;
    try{ await createPage(); } finally{ create.disabled=false; }
  });

  account?.addEventListener("click",async()=>{
    if(account.disabled) return;
    if(!auth.currentUser){
      account.disabled=true;
      try{
        const ok=await requireAuth();
        if(ok){ await ensureProfile(); route(); }
      }finally{ account.disabled=false; }
    }else{
      profilePage();
    }
  });
}


/* ==================================================
   HOME
================================================== */

async function feedPage(){
  stopListener();
  app.innerHTML=`
    ${header()}
    <div class="box"><h2>Home</h2><p class="muted">Public events.</p></div>
    <div id="feedList"><p class="muted">Loading…</p></div>`;
  wireHeader();

  try{
    const snap=await get(ref(db,"publicEvents"));
    renderPublicEvents(snap.val() || {});
  }catch(error){
    console.error(error);
    const list=document.querySelector("#feedList");
    if(list) list.innerHTML=`<div class="box"><p class="error">Couldn't load public events.</p><button id="retryHome">Try again</button></div>`;
    document.querySelector("#retryHome")?.addEventListener("click",feedPage);
    return;
  }

  activeListener=onValue(ref(db,"publicEvents"),snap=>{
    if(document.querySelector("#feedList")) renderPublicEvents(snap.val() || {});
  },error=>console.error("Public events listener:",error));
}

function renderPublicEvents(data){
  const list=document.querySelector("#feedList");
  if(!list) return;
  const events=Object.entries(data).sort((a,b)=>(a[1].when||"").localeCompare(b[1].when||""));
  if(!events.length){
    list.innerHTML=`<div class="box"><p class="muted">No public events yet.</p><button id="homeCreate">Create an event →</button></div>`;
    document.querySelector("#homeCreate")?.addEventListener("click",createPage);
    return;
  }
  list.innerHTML=events.map(([id,event])=>`<div class="box event" data-id="${esc(id)}"><div class="event-title">${esc(event.title)}</div><div>${formatDate(event.when)}</div><p class="muted small">by @${esc(event.creatorUsername)}</p><span class="badge">Public</span></div>`).join("");
  list.querySelectorAll(".event").forEach(el=>el.addEventListener("click",()=>location.hash="e="+el.dataset.id));
}


/* ==================================================
   MY EVENTS
================================================== */

async function eventsPage(){
  stopListener();
  await authReady;
  const user=auth.currentUser;

  if(!user){
    app.innerHTML=`${header()}<div class="box"><h2>My Events</h2><p>Sign in to see the events you've created or been invited to.</p><button id="google">Continue with Google</button></div>`;
    wireHeader();
    document.querySelector("#google").addEventListener("click",async()=>{
      const button=document.querySelector("#google");
      button.disabled=true;
      try{ const ok=await requireAuth(); if(ok){ await ensureProfile(); await eventsPage(); } } finally{ if(button) button.disabled=false; }
    });
    return;
  }

  app.innerHTML=`${header()}<div class="box"><h2>My Events</h2><p class="muted">Events you've created or been invited to.</p></div><div id="eventList"><p class="muted">Loading…</p></div>`;
  wireHeader();

  const render=async(index)=>{
    const list=document.querySelector("#eventList");
    if(!list) return;
    const events=[];
    for(const id of Object.keys(index)){
      const snap=await get(ref(db,"events/"+id));
      if(snap.exists()) events.push({id,event:snap.val(),relationship:index[id]});
    }
    events.sort((a,b)=>(a.event.when||"").localeCompare(b.event.when||""));
    if(!events.length){
      list.innerHTML=`<div class="box"><p class="muted">You don't have any events yet.</p><button id="makeOne">Create an event →</button></div>`;
      document.querySelector("#makeOne")?.addEventListener("click",createPage);
      return;
    }
    list.innerHTML=events.map(({id,event,relationship})=>`<div class="box event" data-id="${esc(id)}"><div class="event-title">${esc(event.title)}</div><div>${formatDate(event.when)}</div><p class="muted small">by @${esc(event.creatorUsername)}</p><span class="badge">${relationship==="creator"?"Created by you":"Invited"}</span></div>`).join("");
    list.querySelectorAll(".event").forEach(el=>el.addEventListener("click",()=>location.hash="e="+el.dataset.id));
  };

  try{
    const snap=await get(ref(db,"userEvents/"+user.uid));
    await render(snap.val() || {});
  }catch(error){
    console.error(error);
    const list=document.querySelector("#eventList");
    if(list) list.innerHTML=`<div class="box"><p class="error">Couldn't load your events.</p><button id="retryMyEvents">Try again</button></div>`;
    document.querySelector("#retryMyEvents")?.addEventListener("click",eventsPage);
    return;
  }

  activeListener=onValue(ref(db,"userEvents/"+user.uid),snap=>{
    if(document.querySelector("#eventList")) render(snap.val() || {});
  },error=>console.error("My Events listener:",error));
}


/* ==================================================
   CREATE / EDIT EVENT FORM
================================================== */

async function eventForm(existingId=null){

  await authReady;

  if(!auth.currentUser)
    return;

  await ensureProfile();

  const profile =
    await getProfile();

  let existing=null;

  if(existingId){

    const snapshot =
      await get(
        ref(db,"events/"+existingId)
      );

    if(!snapshot.exists()){

      alert("Event not found.");
      return;
    }

    existing=snapshot.val();

    if(existing.creatorUid !== uid()){

      alert(
        "Only the creator can edit this event."
      );

      return;
    }
  }

  const isEdit=!!existing;

  let invited=[];

  if(existing?.invitedUsers){

    for(const invitedUid of Object.keys(
      existing.invitedUsers
    )){

      const snapshot =
        await get(
          ref(
            db,
            "users/"+invitedUid+"/username"
          )
        );

      if(snapshot.exists())
        invited.push(
          snapshot.val().toLowerCase()
        );
    }
  }

  app.innerHTML=`

    ${header()}

    <div class="box">

      <h2>
        ${isEdit ? "Edit event" : "Create event"}
      </h2>

      <input
        id="title"
        maxlength="100"
        placeholder="Evening walk"
        value="${esc(existing?.title || "")}"
      >

      <input
        id="when"
        type="datetime-local"
        value="${esc(existing?.when || "")}"
      >

      <h3>
        Who can respond?
      </h3>

      <div class="scope">

        <label>

          <input
            type="radio"
            name="scope"
            value="link"
            ${existing?.scope==="link" || !existing ? "checked" : ""}
          >

          <strong>
            Send link
          </strong>

          <br>

          <span class="muted small">
            Anyone with the link can respond.
          </span>

        </label>

        <label>

          <input
            type="radio"
            name="scope"
            value="invited"
            ${existing?.scope==="invited" ? "checked" : ""}
          >

          <strong>
            Invited people
          </strong>

          <br>

          <span class="muted small">
            Only invited people can respond.
          </span>

        </label>

        <label>

          <input
            type="radio"
            name="scope"
            value="public"
            ${existing?.scope==="public" ? "checked" : ""}
          >

          <strong>
            Public
          </strong>

          <br>

          <span class="muted small">
            Anyone can discover it in Home.
          </span>

        </label>

      </div>

      <div id="inviteBox"></div>

      <p id="eventError" class="error"></p>

      <div class="actions">

        <button id="saveEvent">
          ${isEdit ? "Save changes" : "Create →"}
        </button>

        ${
          isEdit
          ?`
            <button
              id="cancelEdit"
              type="button"
            >
              Cancel
            </button>
          `
          :""
        }

      </div>

    </div>
  `;

  wireHeader();

  const renderInvites=()=>{

    const box =
      document.querySelector("#inviteBox");

    const scope =
      document.querySelector(
        'input[name="scope"]:checked'
      )?.value;

    if(scope!=="invited"){

      box.innerHTML="";
      return;
    }

    box.innerHTML=`

      <h3>
        Invite people
      </h3>

      <input
        id="inviteUsername"
        placeholder="@username"
        maxlength="20"
      >

      <button
        id="addInvite"
        type="button"
      >
        Add person
      </button>

      <div id="inviteList">

        ${
          invited.map(
            (username,index)=>`

              <div class="invite-row">

                <span>
                  @${esc(username)}
                </span>

                <button
                  type="button"
                  data-index="${index}"
                >
                  Remove
                </button>

              </div>

            `
          ).join("")
        }

      </div>
    `;

    document.querySelector("#addInvite")
      .onclick=async()=>{

        const input =
          document.querySelector(
            "#inviteUsername"
          );

        const username =
          input.value.trim();

        const lower =
          username.toLowerCase();

        if(!validUsername(username)){

          alert(
            "Enter a valid username."
          );

          return;
        }

        if(invited.includes(lower)){

          input.value="";
          return;
        }

        const snapshot =
          await get(
            ref(db,"usernames/"+lower)
          );

        if(!snapshot.exists()){

          alert(
            "That username doesn't exist."
          );

          return;
        }

        if(snapshot.val()===uid()){

          alert(
            "You are already the creator."
          );

          return;
        }

        invited.push(lower);

        input.value="";

        renderInvites();
      };

    document
      .querySelectorAll(
        "#inviteList button"
      )
      .forEach(button=>{

        button.onclick=()=>{

          invited.splice(
            Number(button.dataset.index),
            1
          );

          renderInvites();
        };

      });
  };

  document
    .querySelectorAll(
      'input[name="scope"]'
    )
    .forEach(input=>{

      input.onchange =
        renderInvites;

    });

  renderInvites();

  document.querySelector("#cancelEdit")
    ?.addEventListener(
      "click",
      ()=>eventPage(existingId)
    );

  document.querySelector("#saveEvent")
    .onclick=async()=>{

      const error =
        document.querySelector("#eventError");

      const title =
        document.querySelector("#title")
        .value.trim();

      const when =
        document.querySelector("#when")
        .value;

      const scope =
        document.querySelector(
          'input[name="scope"]:checked'
        )?.value;

      if(!title){

        error.textContent =
          "Give the event a title.";

        return;
      }

      if(!when){

        error.textContent =
          "Choose a date and time.";

        return;
      }

      if(
        scope==="invited" &&
        !invited.length
      ){

        error.textContent =
          "Add at least one person.";

        return;
      }

      const invitedUsers={};

      for(const username of invited){

        const snapshot =
          await get(
            ref(db,"usernames/"+username)
          );

        if(snapshot.exists()){

          invitedUsers[
            snapshot.val()
          ]=true;

        }
      }

      const id =
        existingId || newId();

      const createdAt =
        existing?.createdAt || Date.now();

      const event = {

        title,
        when,
        scope,

        creatorUid:
          uid(),

        creatorUsername:
          profile.username,

        createdAt,

        invitedUsers,

        responses:
          existing?.responses || {}

      };

      try{

        /*
          Everything is updated through one
          multi-location Firebase update.

          This keeps the event and its indexes
          synchronized.
        */

        const updates={};

        updates[
          "events/"+id
        ]=event;

        /*
          Creator must always have the event
          in My Events.
        */

        updates[
          "userEvents/"
          +uid()
          +"/"
          +id
        ]="creator";

        /*
          Remove old invitation indexes.
        */

        if(existing?.invitedUsers){

          for(
            const oldInvitedUid
            of Object.keys(existing.invitedUsers)
          ){

            updates[
              "userEvents/"
              +oldInvitedUid
              +"/"
              +id
            ]=null;

          }
        }

        /*
          Add new invitation indexes.
        */

        for(
          const invitedUid
          of Object.keys(invitedUsers)
        ){

          updates[
            "userEvents/"
            +invitedUid
            +"/"
            +id
          ]="invited";

        }

        /*
          Public Home index.
        */

        if(scope==="public"){

          updates[
            "publicEvents/"+id
          ]={
            title,
            when,
            creatorUid:uid(),
            creatorUsername:
              profile.username,
            createdAt
          };

        }else{

          /*
            If it used to be public but isn't anymore,
            remove it from Home.
          */

          updates[
            "publicEvents/"+id
          ]=null;
        }

        await update(
          ref(db),
          updates
        );

        location.hash="e="+id;

      }catch(errorObject){

        console.error(errorObject);

        error.textContent =
          isEdit
          ? "Couldn't save the changes."
          : "Couldn't create the event.";
      }
    };
}


/* ==================================================
   CREATE PAGE
================================================== */

async function createPage(){
  stopListener();
  await authReady;

  if(!auth.currentUser){
    app.innerHTML=`${header()}<div class="box"><h2>Create</h2><p>Sign in to create an event.</p><button id="googleCreate">Continue with Google</button></div>`;
    wireHeader();

    document.querySelector("#googleCreate")?.addEventListener("click",async()=>{
      const button=document.querySelector("#googleCreate");
      if(!button || button.disabled) return;
      button.disabled=true;
      try{
        const ok=await requireAuth();
        if(ok){
          await ensureProfile();
          await eventForm(null);
        }
      }finally{
        if(button) button.disabled=false;
      }
    });
    return;
  }

  await eventForm(null);
}


/* ==================================================
   EDIT EVENT
================================================== */

function editEvent(id){

  eventForm(id);
}


/* ==================================================
   DELETE EVENT
================================================== */

async function deleteEvent(id){

  if(!auth.currentUser)
    return;

  const snapshot =
    await get(
      ref(db,"events/"+id)
    );

  if(!snapshot.exists()){

    alert("Event not found.");
    return;
  }

  const event =
    snapshot.val();

  if(event.creatorUid !== uid()){

    alert(
      "Only the creator can delete this event."
    );

    return;
  }

  const confirmed =
    confirm(
      "Delete this event?\n\n" +
      "This cannot be undone."
    );

  if(!confirmed)
    return;

  const updates={};

  /*
    Delete the main event.
  */

  updates[
    "events/"+id
  ]=null;

  /*
    Delete public Home entry.
  */

  updates[
    "publicEvents/"+id
  ]=null;

  /*
    Remove creator's My Events entry.
  */

  updates[
    "userEvents/"
    +event.creatorUid
    +"/"
    +id
  ]=null;

  /*
    Remove all invited users' My Events entries.
  */

  for(
    const invitedUid
    of Object.keys(event.invitedUsers || {})
  ){

    updates[
      "userEvents/"
      +invitedUid
      +"/"
      +id
    ]=null;

  }

  try{

    await update(
      ref(db),
      updates
    );

    location.hash="";
    feedPage();

  }catch(errorObject){

    console.error(errorObject);

    alert(
      "Couldn't delete the event."
    );
  }
}


/* ==================================================
   EVENT PAGE
================================================== */

function eventPage(id){

  stopListener();

  app.innerHTML=`

    ${header()}

    <div class="box">

      <p class="muted">
        Loading…
      </p>

    </div>
  `;

  wireHeader();

  activeListener =
    onValue(
      ref(db,"events/"+id),
      async snapshot=>{

        if(!snapshot.exists()){

          app.innerHTML=`

            ${header()}

            <div class="box">

              <h2>
                Event not found.
              </h2>

              <p class="muted">
                This event doesn't exist.
              </p>

            </div>
          `;

          wireHeader();

          return;
        }

        const event =
          snapshot.val();

        const user =
          auth.currentUser;

        const userUid =
          user?.uid || null;

        const isCreator =
          userUid===event.creatorUid;

        const isInvited =
          !!event.invitedUsers?.[userUid];

        const isPublic =
          event.scope==="public";

        const canRespond =
          !!userUid &&
          (
            event.scope==="link" ||
            isPublic ||
            isCreator ||
            isInvited
          );

        const responses =
          Object.entries(
            event.responses || {}
          );

        const coming =
          responses.filter(
            ([,response]) =>
              response.status==="yes"
          );

        const notComing =
          responses.filter(
            ([,response]) =>
              response.status==="no"
          );

        const myResponse =
          userUid
          ? event.responses?.[userUid]?.status || ""
          : "";

        app.innerHTML=`

          ${header()}

          <div class="box">

            <p class="muted">

              ${
                event.scope==="public"
                ? "Public event"
                : event.scope==="invited"
                ? "Invited event"
                : "Shared event"
              }

            </p>

            <h2>
              ${esc(event.title)}
            </h2>

            <p>
              ${formatDate(event.when)}
            </p>

            <p class="muted small">
              by @${esc(event.creatorUsername)}
            </p>

            ${
              isCreator
              ?`

                <div class="actions">

                  <button id="edit">
                    Edit
                  </button>

                  <button
                    id="delete"
                    class="danger"
                  >
                    Delete
                  </button>

                </div>

              `
              :""
            }

            ${
              !userUid
              ?`

                <div class="box">

                  <p>
                    You can view this event
                    without signing in.
                  </p>

                  <button id="respond">
                    Sign in to respond
                  </button>

                </div>

              `
              :""
            }

            ${
              userUid &&
              !canRespond &&
              !isCreator
              ?`

                <div class="box">

                  <p>
                    You're signed in.
                  </p>

                  <p class="muted">
                    You're not invited to respond
                    to this event.
                  </p>

                </div>

              `
              :""
            }

            ${
              canRespond
              ?`

                <h3>
                  Are you coming?
                </h3>

                <div class="choice">

                  <button
                    id="yes"
                    class="yes
                      ${
                        myResponse==="yes"
                        ?"selected"
                        :""
                      }"
                  >
                    ${
                      myResponse==="yes"
                      ?"✓ "
                      :""
                    }COMING
                  </button>

                  <button
                    id="no"
                    class="no
                      ${
                        myResponse==="no"
                        ?"selected"
                        :""
                      }"
                  >
                    ${
                      myResponse==="no"
                      ?"✓ "
                      :""
                    }NOT COMING
                  </button>

                </div>

                <p
                  id="message"
                  class="success"
                ></p>

              `
              :""
            }

          </div>


          <div class="box">

            <h3>
              Coming · ${coming.length}
            </h3>

            ${
              coming.length
              ? coming.map(
                  ([,response])=>`

                    <div class="person">

                      <strong>
                        @${esc(
                          response.username
                        )}
                      </strong>

                      <b>✓</b>

                    </div>

                  `
                ).join("")
              :`

                <p class="muted">
                  Nobody yet.
                </p>

              `
            }

          </div>


          <div class="box">

            <h3>
              Not coming · ${notComing.length}
            </h3>

            ${
              notComing.length
              ? notComing.map(
                  ([,response])=>`

                    <div class="person">

                      <strong>
                        @${esc(
                          response.username
                        )}
                      </strong>

                      <b>×</b>

                    </div>

                  `
                ).join("")
              :`

                <p class="muted">
                  Nobody yet.
                </p>

              `
            }

          </div>


          <div class="box">

            <strong>
              Share this event
            </strong>

            <div class="link">
              ${esc(eventUrl(id))}
            </div>

            <button id="copy">
              Copy link
            </button>

          </div>

        `;

        wireHeader();


        /* ---------- CREATOR ACTIONS ---------- */

        document.querySelector("#edit")
          ?.addEventListener(
            "click",
            ()=>editEvent(id)
          );

        document.querySelector("#delete")
          ?.addEventListener(
            "click",
            ()=>deleteEvent(id)
          );


        /* ---------- SIGN IN TO RESPOND ---------- */

        document.querySelector("#respond")
          ?.addEventListener(
            "click",
            async()=>{

              const signedIn =
                await requireAuth();

              if(signedIn){

                await ensureProfile();

                eventPage(id);
              }
            }
          );


        /* ---------- COPY ---------- */

        document.querySelector("#copy")
          ?.addEventListener(
            "click",
            async()=>{

              const copyButton =
                document.querySelector("#copy");

              try{

                await navigator.clipboard.writeText(
                  eventUrl(id)
                );

                copyButton.textContent =
                  "Copied!";

                setTimeout(()=>{

                  if(
                    document.querySelector("#copy")
                  ){
                    document.querySelector("#copy")
                      .textContent="Copy link";
                  }

                },1200);

              }catch{

                alert(
                  "Copy failed. Copy the link manually."
                );
              }
            }
          );


        if(!canRespond)
          return;


        /* ---------- RESPONSE ---------- */

        let choice =
          myResponse;

        const yes =
          document.querySelector("#yes");

        const no =
          document.querySelector("#no");

        const message =
          document.querySelector("#message");

        const saveChoice =
          async status=>{

            const profile =
              await getProfile();

            if(!profile)
              return;

            try{

              await set(
                ref(
                  db,
                  "events/"
                  +id
                  +"/responses/"
                  +userUid
                ),
                {
                  username:
                    profile.username,

                  status,

                  updatedAt:
                    Date.now()
                }
              );

              await set(
                ref(
                  db,
                  "userEvents/"
                  +userUid
                  +"/"
                  +id
                ),
                isCreator
                  ?"creator"
                  :"invited"
              );

              if(message)
                message.textContent =
                  status==="yes"
                  ? "You're coming."
                  : "You're not coming.";

            }catch(errorObject){

              console.error(
                errorObject
              );

              if(message)
                message.textContent =
                  "Couldn't save your response.";
            }
          };


        const updateChoice=()=>{

          yes?.classList.toggle(
            "selected",
            choice==="yes"
          );

          no?.classList.toggle(
            "selected",
            choice==="no"
          );

          if(yes){

            yes.textContent =
              choice==="yes"
              ? "✓ COMING"
              : "COMING";

          }

          if(no){

            no.textContent =
              choice==="no"
              ? "✓ NOT COMING"
              : "NOT COMING";

          }
        };


        yes?.addEventListener(
          "click",
          async()=>{

            choice="yes";

            updateChoice();

            await saveChoice("yes");

          }
        );


        no?.addEventListener(
          "click",
          async()=>{

            choice="no";

            updateChoice();

            await saveChoice("no");

          }
        );

      }
    );
}


/* ==================================================
   PROFILE
================================================== */

async function profilePage(){

  if(!auth.currentUser){

    const signedIn =
      await requireAuth();

    if(signedIn){

      await ensureProfile();

      profilePage();
    }

    return;
  }

  const profile =
    await getProfile();

  app.innerHTML=`

    ${header()}

    <div class="box center">

      ${
        profile?.photoURL
        ?`

          <img
            class="profile-photo"
            src="${esc(profile.photoURL)}"
            alt=""
          >

        `
        :""
      }

      <h2>
        @${esc(
          profile?.username || "unknown"
        )}
      </h2>

      <p class="muted">
        ${esc(
          profile?.displayName ||
          auth.currentUser.displayName ||
          ""
        )}
      </p>

      <button id="signout">
        Sign out
      </button>

    </div>

  `;

  wireHeader();

  document.querySelector("#signout")
    .onclick=async()=>{

      await signOut(auth);

      location.hash="";

      route();
    };
}


/* ==================================================
   ROUTER
================================================== */

function route(){

  stopListener();

  const match =
    location.hash.match(/^#e=([^]+)$/);

  if(match){

    eventPage(match[1]);
    return;
  }

  feedPage();
}


/* ==================================================
   START
================================================== */

auth.onAuthStateChanged(user=>{
  authReadyResolve(user);
  authReadyResolve=()=>{};
});

async function boot(){
  await authReady;
  if(auth.currentUser){
    const profile=await getProfile();
    if(!profile) await ensureProfile();
  }
  route();
}

boot();

addEventListener("hashchange",route);

</script>
