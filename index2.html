function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"

function parseDate(value){

}

  const date = parseDate(value);

function icon(name){
  const icons = {
    back:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`,
    calendar:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M7 3v4M17 3v4M3.5 9.5h17"/></svg>`,
    note:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-4 3v-16a2 2 0 0 1 2-2Z"/><path d="M8 9h8M8 13h6"/></svg>`,
    share:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>`,

/* =====================================================
   AUTH
===================================================== */

async function requireAuth(){
  if(auth.currentUser) return true;
  if(signingIn) return false;

  signingIn = true;

  try{
    await signInWithPopup(auth,googleProvider);
    return true;
  }catch(error){
    console.error("Firebase Auth Error:",error);

    if(
      error.code === "auth/popup-closed-by-user" ||
      error.code === "auth/cancelled-popup-request" ||
      error.code === "auth/popup-blocked"
    ){
      return false;
    }

    alert(
      "Google sign-in failed.\n\n" +
      error.code +
      "\n\n" +
      error.message
    );

    return false;
  }finally{
    signingIn = false;
  }
}

===================================================== */

function eventsPage(){
  stopListener();

  app.innerHTML = `
    <div class="page">
      ${renderHeader()}

      <section class="hero">
        <h1>What’s <span class="mark">happening?</span></h1>

        <div class="hero-illustration" aria-hidden="true">
          <div class="sun"></div>
          <div class="hill"></div>
          <div class="palm"></div>
        </div>
      </section>

      <div class="segmented">
        <button id="upcomingTab" class="${eventsTab === "upcoming" ? "active" : ""}">
          Upcoming
        </button>
        <button id="pastTab" class="${eventsTab === "past" ? "active" : ""}">
          Past
        </button>
      </div>

      <div id="eventsList"></div>
    </div>

    <button class="create-fab" id="createFab" aria-label="Create event">+</button>

    ${renderBottomNav()}
  `;

  wireHeader();
  wireBottomNav();

  document.querySelector("#createFab").onclick = createPage;

  document.querySelector("#upcomingTab").onclick = ()=>{
    eventsTab = "upcoming";
    eventsPage();
  };

  document.querySelector("#pastTab").onclick = ()=>{
    eventsTab = "past";
    eventsPage();
  };

  const eventsList = document.querySelector("#eventsList");

  activeListener = onValue(
    ref(db,"events"),
    snapshot=>{
      const events = snapshot.val() || {};
      const now = Date.now();

      const upcoming = [];
      const past = [];

      Object.entries(events).forEach(([id,event])=>{
        const eventTime = parseDate(event.when)?.getTime();

        if(Number.isFinite(eventTime) && eventTime < now){
          past.push([id,event]);
        }else{
          upcoming.push([id,event]);
        }
      });

      upcoming.sort((a,b)=>
        (parseDate(a[1].when)?.getTime() || 0) -
        (parseDate(b[1].when)?.getTime() || 0)
      );

      past.sort((a,b)=>
        (parseDate(b[1].when)?.getTime() || 0) -
        (parseDate(a[1].when)?.getTime() || 0)
      );

      const entries = eventsTab === "upcoming" ? upcoming : past;
      eventsList.innerHTML = renderEvents(entries);

      document.querySelectorAll(".event-card").forEach(card=>{
        card.addEventListener("click",()=>{
          location.hash = "e=" + card.dataset.id;
        });
      });
    },
    error=>{
      console.error("EVENTS LOAD ERROR:",error);
      eventsList.innerHTML = `
        <p class="error">
          Couldn't load events.<br><br>
          ${escapeHTML(error.message || "")}
        </p>
      `;
    }
  );
}

function renderEvents(entries){
  if(!entries.length){
    return `
      <div class="empty">
        ${eventsTab === "upcoming" ? "No upcoming events yet." : "No past events."}
      </div>
    `;
  }

  const tileClasses = ["green","pink","yellow","blue","lavender"];

  return `
    <div class="event-list">
      ${entries.map(([id,event],index)=>{
        const parts = dateParts(event.when);
        const coming = Object.values(event.responses || {})
          .filter(response => response.status === "yes")
          .length;

        return `
          <article
            class="event-card"
            data-id="${escapeHTML(id)}"
            tabindex="0"
            role="button"
            aria-label="Open ${escapeHTML(event.title)}"
          >
            <div class="date-tile ${tileClasses[index % tileClasses.length]}">
              <span class="date-month">${parts.month}</span>
              <span class="date-day">${parts.day}</span>
            </div>

            <div class="event-main">
              <div class="event-title">${escapeHTML(event.title)}</div>
              <div class="event-meta">
                ${formatDate(event.when).replace(/, \d{4}/,"")} 
              </div>
            </div>

            <div class="event-count" title="${coming} coming">
              ${coming}
            </div>
          </article>
        `;
      }).join("")}
    </div>
  `;
}

  }

  app.innerHTML = `
    <div class="page form-page">
      ${renderHeader({back:true})}

      <section class="form-heading">
        <div class="form-icon" aria-hidden="true">

          <input id="when" type="datetime-local">

        <label class="field">
          <span class="field-icon">${icon("note")}</span>
          <span class="field-label">Note (optional)</span>

      </form>

  wireHeader({back:true});
  wireCharacterCount("#eventNote","#noteCount");

  document.querySelector("#eventForm").onsubmit = async(event)=>{

    const user = auth.currentUser;

      error.textContent =
        "Couldn't create event.\n\n" +

        errorObject.message;
    }
  };

function wireCharacterCount(textareaSelector,countSelector){
  const textarea = document.querySelector(textareaSelector);
  const count = document.querySelector(countSelector);
  if(!textarea || !count) return;

  const update = ()=>{
    count.textContent = `${textarea.value.length}/${textarea.maxLength}`;
  };

  textarea.addEventListener("input",update);
  update();
}

async function deleteEvent(id){

  if(!snapshot.exists()){

}

function eventPage(id){
  stopListener();

  app.innerHTML = `
    <div class="page event-detail">
      ${renderHeader({back:true})}
      <div id="eventShell"></div>
    </div>
  `;

  wireHeader({back:true});

  activeListener = onValue(
    ref(db,"events/" + id),
    snapshot=>{
      const shell = document.querySelector("#eventShell");
      if(!shell) return;

      if(!snapshot.exists()){
        shell.innerHTML = `
          <section class="not-found">
            <h2>Event not found.</h2>
            <p class="muted">This event doesn't exist or has been deleted.</p>
          </section>
        `;
        return;
      }

      const event = snapshot.val();
      const user = auth.currentUser;
      const userUid = user?.uid || null;
      const isCreator = userUid === event.creatorUid;

      const responses = Object.entries(event.responses || {});
      const coming = responses.filter(([,response])=>response.status === "yes");
      const notComing = responses.filter(([,response])=>response.status === "no");
      const myResponse = userUid ? event.responses?.[userUid] : null;

      shell.innerHTML = `
        <section>
          <h1 class="detail-title">${escapeHTML(event.title)}</h1>

          <div class="detail-date">
            ${icon("calendar")}
            <span>
              ${escapeHTML(
                parseDate(event.when)
                  ? parseDate(event.when).toLocaleDateString("en-IN",{
                      day:"numeric",
                      month:"long",
                      year:"numeric"
                    })
                  : "Date unavailable"
              )}
              &nbsp; · &nbsp;
              ${escapeHTML(formatTime(event.when))}
            </span>
          </div>

          <div class="coming-pill">
            ${coming.length} coming
          </div>

          ${
            event.note
              ? `
                <div class="note-card">
                  <div class="note-card-title">
                    ${icon("note")}
                    <span>Note</span>
                  </div>
                  <p>${escapeHTML(event.note)}</p>
                </div>
              `
              : ""
          }

          <div class="creator">
            ${
              event.creatorPhoto
                ? `<img src="${escapeHTML(event.creatorPhoto)}" alt="">`
                : `<div class="avatar-button"><span class="avatar-placeholder">U</span></div>`
            }

            <div>
              <div class="creator-text">Created by</div>
              <div class="creator-name">
                ${escapeHTML(event.creatorName || "Unknown")}
              </div>
            </div>
          </div>

          <section class="response-section">
            <h3>Are you coming?</h3>

            ${
              !userUid
                ? `
                  <button class="primary" id="respondButton">
                    Continue with Google
                  </button>
                `
                : `
                  <div class="response-buttons">
                    <button
                      id="yesButton"
                      class="yes ${myResponse?.status === "yes" ? "selected" : ""}"
                    >
                      ${myResponse?.status === "yes" ? "✓ " : ""}COMING
                    </button>

                    <button
                      id="noButton"
                      class="no ${myResponse?.status === "no" ? "selected" : ""}"
                    >
                      ${myResponse?.status === "no" ? "✓ " : ""}NOT COMING
                    </button>
                  </div>

                  <div class="response-note-wrap">
                    ${icon("note")}
                    <textarea
                      id="responseNote"
                      maxlength="500"
                      placeholder="Add a note (optional)"
                    >${escapeHTML(myResponse?.note || "")}</textarea>
                  </div>

                  <button class="save-response" id="saveResponse">
                    Save response
                  </button>

                  <p id="responseMessage" class="success"></p>
                `
            }
          </section>

          <section class="people-section">
            <h3>Coming · ${coming.length}</h3>

            ${
              coming.length
                ? coming.map(([,response])=>renderPerson(response,true)).join("")
                : `<p class="muted small">Nobody yet.</p>`
            }
          </section>

          <section class="people-section">
            <h3>Not coming · ${notComing.length}</h3>

            ${
              notComing.length
                ? notComing.map(([,response])=>renderPerson(response,false)).join("")
                : `<p class="muted small">Nobody yet.</p>`
            }
          </section>

          <section class="share-section">
            <div class="share-actions">
              <button class="share-button" id="shareButton">
                ${icon("share")} &nbsp; Share
              </button>

              <button class="more-button" id="moreButton" aria-label="More options">
                …
              </button>
            </div>

            <div class="menu" id="moreMenu" hidden>
              ${
                isCreator
                  ? `
                    <button id="editButton">Edit event</button>
                    <button id="deleteButton" class="danger-text">Delete event</button>
                  `
                  : ""
              }
              <button id="copyButton">Copy event link</button>
            </div>
          </section>
        </section>
      `;

      document.querySelector("#moreButton").onclick = ()=>{
        const menu = document.querySelector("#moreMenu");
        menu.hidden = !menu.hidden;
      };

      document.querySelector("#editButton")?.addEventListener("click",()=>editEvent(id));
      document.querySelector("#deleteButton")?.addEventListener("click",()=>deleteEvent(id));

      document.querySelector("#copyButton")?.addEventListener("click",async()=>{
        const button = document.querySelector("#copyButton");

        try{
          await navigator.clipboard.writeText(eventURL(id));
          button.textContent = "Copied!";
          setTimeout(()=>{
            if(button.isConnected) button.textContent = "Copy event link";
          },1200);
        }catch{
          prompt("Copy this event link:",eventURL(id));
        }
      });

      document.querySelector("#respondButton")?.addEventListener("click",async()=>{
        const signedIn = await requireAuth();
        if(signedIn) eventPage(id);
      });

      document.querySelector("#shareButton")?.addEventListener("click",event=>{
        shareEvent(id,event.currentTarget);
      });

      if(!userUid) return;

      let choice = myResponse?.status || "";

      const yesButton = document.querySelector("#yesButton");
      const noButton = document.querySelector("#noButton");
      const responseNote = document.querySelector("#responseNote");
      const message = document.querySelector("#responseMessage");

      function updateChoice(){
        yesButton?.classList.toggle("selected",choice === "yes");
        noButton?.classList.toggle("selected",choice === "no");

        if(yesButton){
          yesButton.textContent = choice === "yes" ? "✓ COMING" : "COMING";
        }

        if(noButton){
          noButton.textContent = choice === "no" ? "✓ NOT COMING" : "NOT COMING";
        }
      }

      yesButton?.addEventListener("click",()=>{
        choice = "yes";
        updateChoice();
      });

      noButton?.addEventListener("click",()=>{
        choice = "no";
        updateChoice();
      });

      document.querySelector("#saveResponse")?.addEventListener("click",async()=>{
        if(choice !== "yes" && choice !== "no"){
          message.textContent = "Choose COMING or NOT COMING.";
          return;
        }

        const currentUser = auth.currentUser;
        if(!currentUser) return;

        const note = responseNote.value.trim();

        try{
          await set(
            ref(db,"events/" + id + "/responses/" + currentUser.uid),
            {
              name:currentUser.displayName || "Unknown",
              photo:currentUser.photoURL || "",
              status:choice,
              note,
              updatedAt:Date.now()
            }
          );

          message.textContent =
            choice === "yes"
              ? "You're coming."
              : "You're not coming.";
        }catch(errorObject){
          console.error("RESPONSE ERROR:",errorObject);
          message.textContent =
            "Couldn't save your response.\n\n" +
            errorObject.code +
            "\n" +
            errorObject.message;
        }
      });
    },
    error=>{
      console.error("EVENT ERROR:",error);

      const shell = document.querySelector("#eventShell");

      if(shell){
        shell.innerHTML = `
          <p class="error">
            Couldn't load event.<br><br>
            ${escapeHTML(error.message || "")}
          </p>
        `;
      }
    }
  );
}

function renderPerson(response,isComing){
  return `
    <div class="person">
      ${
        response.photo
          ? `<img src="${escapeHTML(response.photo)}" alt="">`
          : `<div class="avatar-button"><span class="avatar-placeholder">U</span></div>`
      }

      <div>
        <div class="person-name">${escapeHTML(response.name || "Unknown")}</div>
        ${
          response.note
            ? `<div class="person-note">${escapeHTML(response.note)}</div>`
            : ""
        }
      </div>

      <div class="person-status">${isComing ? "✓" : "×"}</div>
    </div>
  `;
}

/* =====================================================
   SHARE
===================================================== */

async function shareEvent(id,button){
  const url = eventURL(id);

  const snapshot = await get(ref(db,"events/" + id));
  const event = snapshot.val();

  if(!event) return;

  const date = parseDate(event.when);

  const dateText = date
    ? date.toLocaleDateString("en-IN",{
        day:"numeric",
        month:"long",
        year:"numeric"
      })
    : "Date unavailable";

  const timeText = date
    ? date.toLocaleTimeString("en-IN",{
        hour:"numeric",
        minute:"2-digit",
        hour12:true
      })
    : "Time unavailable";

  const message = `${event.title}
${dateText} · ${timeText}

# വരുന്നുണ്ടോ???`;

  if(navigator.share){
    try{
      await navigator.share({
        title:"വരുന്നുണ്ടോ???",
        text:message,
        url
      });
      return;
    }catch(error){
      if(error?.name === "AbortError") return;
    }
  }

  try{
    await navigator.clipboard.writeText(message + "\n\n" + url);

    if(button){
      const original = button.innerHTML;
      button.textContent = "Copied!";
      setTimeout(()=>{
        if(button.isConnected) button.innerHTML = original;
      },1200);
    }
  }catch{
    prompt("Copy this event message:",message + "\n\n" + url);
  }
}

/* =====================================================
   PROFILE
===================================================== */

function profilePage(){
  const user = auth.currentUser;
  if(!user) return;

  app.innerHTML = `
    <div class="page">
      ${renderHeader({back:true})}

      <section class="profile">
        ${
          user.photoURL
            ? `<img class="profile-avatar" src="${escapeHTML(user.photoURL)}" alt="">`
            : `<div class="profile-avatar avatar-placeholder">${escapeHTML((user.displayName || "U").charAt(0).toUpperCase())}</div>`
        }

        <h1>${escapeHTML(user.displayName || "Google account")}</h1>
        <div class="profile-email">${escapeHTML(user.email || "")}</div>

        <button class="outline" id="signOutButton">
          Sign out
        </button>
      </section>
    </div>
  `;

  wireHeader({back:true});

  document.querySelector("#signOutButton").onclick = async()=>{
    await signOut(auth);
    location.hash = "";
    eventsPage();
  };
}

/* =====================================================
   ROUTER
===================================================== */

function route(){
  stopListener();

  const match = location.hash.match(/^#e=(.+)$/);

  if(match){
    eventPage(decodeURIComponent(match[1]));
    return;
  }

  eventsPage();
}

/* =====================================================
   START
===================================================== */

onAuthStateChanged(auth,()=>{
  route();
});

window.addEventListener("hashchange",route);
</script>
